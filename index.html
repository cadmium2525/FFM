function statusesFromEffect(effect) {
  return statusMatchers.filter(([, pattern]) => pattern.test(effect ?? '')).map(([status]) => status);
}

function magicPower(record) {
  if (FF5_MAGIC_SPECS[record.id]) return FF5_MAGIC_SPECS[record.id].power;
  const level = record.level ?? ({ blue: 3, summon: 3 }[record.school] ?? 1);
  if (/大ダメージ|フレア|バハムート/.test(record.effect)) return 4.2 + level * 0.15;
  if (/中ダメージ/.test(record.effect)) return 2.7;
  if (record.school === 'summon') return 1.8 + level * 0.55;
  return 1.35 + level * 0.38;
}

function healAmount(record) {
  if (FF5_MAGIC_SPECS[record.id]?.formula === 'heal') return null;
  return 500 + (record.level ?? 1) * 180;
}

function magicOperations(record) {
  const conditionalLevel = Number(record.nameEn.match(/^Level (\d)/)?.[1] ?? 0) || null;
  const status = (statuses, extra = {}) => [{ op: 'status.apply', statuses, ...extra }];
  const damage = (extra = {}) => [{
    op: 'damage.magic', formula: FF5_MAGIC_SPECS[record.id]?.formula ?? 'ff5_magic',
    ff5Power: magicPower(record), power: magicPower(record), hits: FF5_MAGIC_SPECS[record.id]?.hits ?? 1, ...extra,
  }];
  const explicit = {
    magic_cure: [{ op: 'heal.hp', formula: 'ff5_magic', ff5Power: 15 }],
    magic_libra: [{ op: 'inspect', fields: ['hp', 'mp', 'weakness', 'status', 'level'] }],
    magic_poisona: [{ op: 'status.remove', statuses: ['poison'], mode: 'listed' }],
    magic_silence: status(['silence']), magic_protect: status(['protect']), magic_mini: status(['mini'], { toggle: true }),
    magic_cura: [{ op: 'heal.hp', formula: 'ff5_magic', ff5Power: 45 }],
    magic_raise: [{ op: 'revive', hpRatio: 0.25 }], magic_confuse: status(['confuse']),
    magic_blink: status([], { imageHits: 2 }), magic_shell: status(['shell']),
    magic_esuna: [{ op: 'status.remove', statuses: [], mode: 'all_curable' }],
    magic_curaga: [{ op: 'heal.hp', formula: 'ff5_magic', ff5Power: 180 }],
    magic_reflect: status(['reflect']), magic_berserk: status(['berserk']),
    magic_arise: [{ op: 'revive', hpRatio: 1 }], magic_dispel: [{ op: 'status.dispel', polarity: 'positive' }],
    magic_poison: status(['poison']), magic_sleep: status(['sleep']), magic_toad: status(['toad'], { toggle: true }),
    magic_break: status(['petrify']), magic_bio: [...damage(), ...status(['sap'])], magic_death: status(['ko']),
    magic_osmose: [{ op: 'drain.mp', power: 1.5 }],
    magic_speed: [{ op: 'battle.speed', multiplier: 0.7, duration: 4 }], magic_slow: status(['slow']),
    magic_regen: status(['regen']), magic_mute: [{ op: 'battle.field_status', status: 'mute' }],
    magic_haste: status(['haste']), magic_float: status(['float']),
    magic_gravity: [{ op: 'damage.hp_ratio', ratio: 0.5, heavyImmune: true }], magic_stop: status(['stop']),
    magic_teleport: [{ op: 'battle.escape' }], magic_slowga: status(['slow']), magic_return: [{ op: 'battle.restart' }],
    magic_graviga: [{ op: 'damage.hp_ratio', ratio: 0.75, heavyImmune: true }], magic_hastega: status(['haste']),
    magic_old: status(['old']), magic_quick: [{ op: 'turn.extra', count: 2 }],
    magic_banish: [{ op: 'remove.from_battle' }],
    magic_sylph: [
      { op: 'drain.hp', formula: 'ff5_magic', ff5Power: 25, power: 25, targetSide: 'enemy' },
      { op: 'heal.hp', formula: 'ff5_magic', ff5Power: 25, targetSide: 'ally' },
    ],
    magic_remora: status(['paralyze']), magic_golem: [{ op: 'barrier.physical', amountFormula: 'caster_level' }],
    magic_catoblepas: status(['petrify']), magic_carbuncle: status(['reflect']),
    magic_odin: [{ op: 'summon.odin', ff5Power: 180 }],
    magic_phoenix: [
      { op: 'damage.magic', formula: 'ff5_magic', ff5Power: 105, targetSide: 'enemy' },
      { op: 'revive', hpRatio: 1, targetSide: 'ally' },
    ],
    magic_goblin_punch: [{ op: 'damage.physical', formula: 'ff5_goblin_punch', power: 1, sameLevelMultiplier: 8 }],
    magic_roulette: status(['ko']), magic_self_destruct: [{ op: 'damage.caster_hp', sacrificeCaster: true }],
    magic_vampire: [{ op: 'drain.hp', formula: 'ff5_magic', ff5Power: 35, power: 35 }],
    magic_question_marks: [{ op: 'damage.missing_hp' }], magic_magic_hammer: [{ op: 'damage.mp_ratio', ratio: 0.5 }],
    magic_moon_flute: status(['berserk']), magic_lilliputian_lyric: status(['mini']), magic_pond_s_chorus: status(['toad']),
    magic_mind_blast: [...damage(), ...status(['paralyze', 'sap'])], magic_flash: status(['blind']),
    magic_missile: [{ op: 'damage.hp_ratio', ratio: 0.75, heavyImmune: true }],
    magic_level_4_graviga: [{ op: 'damage.hp_ratio', ratio: 0.75, heavyImmune: true }],
    magic_time_slip: status(['sleep', 'old']), magic_doom: status(['doom']), magic_level_2_old: status(['old']),
    magic_transfusion: [{ op: 'restore.full', targetSide: 'ally' }, { op: 'caster.sacrifice' }],
    magic_level_3_flare: damage(), magic_off_guard: [{ op: 'stat.modify', stat: 'def', multiplier: 0.5 }],
    magic_death_claw: [{ op: 'damage.to_critical', heavyImmune: true }, ...status(['paralyze'])],
    magic_level_5_death: status(['ko']), magic_1000_needles: [{ op: 'damage.fixed', amount: 1000 }],
    magic_dark_spark: [{ op: 'stat.modify', stat: 'level', multiplier: 0.5 }],
    magic_white_wind: [{ op: 'heal.caster_hp' }], magic_mighty_guard: status(['protect', 'shell', 'float']),
  };
  const operations = explicit[record.id] ?? (FF5_MAGIC_SPECS[record.id] ? damage() : [{ op: 'effect.script', handlerKey: record.id }]);
  return operations.map((operation) => Object.freeze({ ...operation, ...(conditionalLevel ? { conditionalLevel } : {}) }));
}

function itemOperations(record) {
  const effect = record.effect ?? '';
  const statuses = statusesFromEffect(effect);
  if (/HP・MPを全回復/.test(effect)) return [{ op: 'restore.full' }];
  if (/HPを(\d+)回復/.test(effect)) return [{ op: 'heal.hp', amount: Number(effect.match(/HPを(\d+)回復/)[1]) }];
  if (/MPを(\d+)回復/.test(effect)) return [{ op: 'heal.mp', amount: Number(effect.match(/MPを(\d+)回復/)[1]) }];
  if (/戦闘不能から復帰/.test(effect)) return [{ op: 'revive', hpRatio: 0.25 }];
  if (/治療/.test(effect)) return [{ op: 'status.remove', statuses, mode: /複数/.test(effect) ? 'all_curable' : 'listed' }];
  if (/最大HPを2倍/.test(effect)) return [{ op: 'stat.modify', stat: 'maxHp', multiplier: 2 }];
  if (/攻撃力を上昇/.test(effect)) return [{ op: 'stat.modify', stat: 'atk', multiplier: 1.25 }];
  if (/行動速度を上昇/.test(effect)) return [{ op: 'stat.modify', stat: 'agility', multiplier: 1.25 }];
  if (/物理防御を上昇/.test(effect)) return [{ op: 'stat.modify', stat: 'def', multiplier: 1.25 }];
  if (/レベルを上昇/.test(effect)) return [{ op: 'stat.modify', stat: 'level', multiplier: 1.2 }];
  if (/全体攻撃/.test(effect)) return [{ op: 'damage.magic', formula: 'ff5_magic', power: 2.5 }];
  if (record.id === 'item_magic_lamp') return [{ op: 'item.magic_lamp' }];
  return [{ op: record.category === 'mix_material' ? 'craft.material' : 'effect.script', handlerKey: record.id }];
}

function abilityOperations(record) {
  const effect = record.effect ?? '';
  if (record.type === 'field') return [{ op: 'field.passive', handlerKey: record.id }];
  if (record.type === 'equip') return [{ op: 'equipment.permission', handlerKey: record.id }];
  if (record.type === 'passive') return [{ op: 'battle.passive', handlerKey: record.id }];
  if (/魔法を使用|青魔法|白魔法|黒魔法|召喚魔法|時空魔法/.test(effect)) return [{ op: 'command.magic_menu', handlerKey: record.id }];
  return [{ op: 'command.execute', handlerKey: record.id }];
}

function songOperations(record) {
  const statuses = statusesFromEffect(record.effect);
  if (/ダメージ/.test(record.effect)) return [{ op: 'damage.magic', formula: 'ff5_flare', power: 2.8, creatureType: 'undead' }];
  if (/段階上昇/.test(record.effect)) return [{ op: 'stat.song_growth', handlerKey: record.id }];
  return [{ op: 'status.apply', statuses }];
}

function makeBattleDescriptor(record, sourceType, operations) {
  return Object.freeze({
    sourceType,
    target: targetDescriptor(record.target),
    mpCost: Math.max(0, Number(record.mpCost ?? 0)),
    element: normalizeBattleElement(record.element ?? null),
    formulaVersion: 'ff5_sfc_integer_v2',
    operations: Object.freeze(operations.map((operation) => Object.freeze({ ...operation }))),
    runtimeReady: true,
  });
}

function wrap(record, sourceType, operations) {
  return Object.freeze({ ...record, battle: makeBattleDescriptor(record, sourceType, operations) });
}

const battleReadyMagic = Object.freeze(ff5Magic.map((record) => wrap(record, 'magic', magicOperations(record))));
const battleReadyItems = Object.freeze(ff5Items.map((record) => wrap(record, 'item', itemOperations(record))));
const battleReadyAbilities = Object.freeze(ff5JobAbilities.map((record) => wrap(record, 'ability', abilityOperations(record))));
const battleReadySongs = Object.freeze(ff5Songs.map((record) => wrap(record, 'song', songOperations(record))));
const battleReadyEquipment = Object.freeze(ff5Equipment.map((record) => wrap(record, 'equipment', [{ op: record.special ? 'equipment.special' : 'equipment.stats', handlerKey: record.special ?? record.id }])));
const battleReadyShards = Object.freeze(crystalShards.map((record) => wrap({ ...record, target: 'one_enemy' }, 'crystal_shard', [{ op: 'damage.magic', formula: 'ffm_crystal', power: 3, techniqueId: record.techniqueId }])));
const battleReadyShops = Object.freeze(ff5Shops.map((record) => wrap({ ...record, target: null }, 'shop', [{ op: 'shop.inventory', inventoryTags: record.inventoryTags }])));

const battleCatalog = Object.freeze([
  ...battleReadyMagic,
  ...battleReadyItems,
  ...battleReadyAbilities,
  ...battleReadySongs,
  ...battleReadyEquipment,
  ...battleReadyShards,
  ...battleReadyShops,
]);

const battleRecordById = new Map(battleCatalog.map((record) => [record.id, record]));

function primaryActionKind(operation) {
  if (operation.op === 'damage.physical') return 'physical-attack';
  if (operation.op === 'damage.fixed') return 'fixed-damage';
  if (operation.op === 'damage.hp_ratio') return 'ratio-damage';
  if (operation.op === 'damage.mp_ratio') return 'mp-ratio-damage';
  if (operation.op === 'drain.hp') return 'magic-attack';
  if (operation.op === 'drain.mp') return 'mp-drain';
  if (operation.op === 'heal.hp' || operation.op === 'heal.caster_hp') return 'heal';
  if (operation.op === 'restore.full') return 'full-restore';
  if (operation.op === 'revive') return 'revive';
  if (operation.op === 'inspect') return 'scan';
  if (operation.op === 'status.remove') return 'cleanse';
  if (operation.op === 'status.dispel') return 'dispel';
  if (operation.op === 'status.apply') return 'status';
  if (operation.op === 'stat.modify') return 'stat-modify';
  if (operation.op === 'damage.magic') return 'magic-attack';
  if (operation.op === 'battle.speed') return 'field-speed';
  if (operation.op === 'battle.field_status') return 'field-status';
  if (operation.op === 'barrier.physical') return 'barrier-physical';
  if (operation.op === 'summon.odin') return 'summon-odin';
  return 'scripted';
}

function battleDisabledReason(record) {
  const operations = record.battle?.operations ?? [];
  if (operations.some((operation) => operation.op === 'battle.escape')) return 'ボス戦からはテレポで脱出できない。';
  if (operations.some((operation) => operation.op === 'battle.restart')) return 'ボス戦では戦闘開始時へ巻き戻せない。';
  if (record.category === 'camp') return '戦闘中は使用できない。';
  if (record.category === 'drink') return '「のむ」で使用する専用薬。';
  if (record.category === 'throw') return '「なげる」で使用する投擲アイテム。';
  if (record.category === 'mix_material') return '「ちょうごう」で使用する素材。';
  if (record.id === 'item_beastmaster_gourd') return '装備品のため戦闘中は使用できない。';
  return null;
}

function magicRecordToAction(record) {
  const primary = record.battle.operations[0];
  return Object.freeze({
    id: record.id,
    sourceId: record.id,
    sourceType: 'magic',
    school: record.school,
    ignoreReflect: record.school === 'summon',
    level: record.level,
    name: record.nameJa,
    actionKind: primaryActionKind(primary),
    ctbCost: 0.8 + Math.min(1.2, (record.mpCost ?? 0) / 65),
    mpCost: record.mpCost,
    element: record.battle.element,
    target: record.target,
    effect: record.effect,
    power: primary.power,
    ff5Power: primary.ff5Power,
    formula: primary.formula,
    healAmount: primary.amount,
    fixedDamage: primary.amount,
    ratio: primary.ratio,
    statuses: primary.statuses ?? [],
    operations: record.battle.operations,
    runtimeReady: true,
    disabledReason: battleDisabledReason(record),
  });
}

/** Convert any runtime-ready catalog record into the stable action shape used by BattleManager. */
function battleRecordToAction(record) {
  if (!record?.battle?.runtimeReady) throw new TypeError(`Battle descriptor missing: ${record?.id ?? 'unknown'}`);
  const primary = record.battle.operations[0] ?? { op: 'effect.script' };
  return Object.freeze({
    id: record.id,
    sourceId: record.id,
    sourceType: record.battle.sourceType,
    name: record.techniqueNameJa ?? record.nameJa ?? record.nameEn ?? record.id,
    actionKind: primaryActionKind(primary),
    ctbCost: 0.75 + Math.min(1.25, (record.battle.mpCost ?? 0) / 60),
    mpCost: record.battle.mpCost,
    element: record.battle.element,
    target: record.battle.target.id,
    effect: record.effect ?? record.lore ?? '',
    power: primary.power,
    ff5Power: primary.ff5Power,
    formula: primary.formula,
    healAmount: primary.amount,
    fixedDamage: primary.amount,
    ratio: primary.ratio,
    statuses: primary.statuses ?? [],
    operations: record.battle.operations,
    runtimeReady: true,
    disabledReason: battleDisabledReason(record),
  });
}

function itemRecordToAction(record) {
  const action = battleRecordToAction(record);
  return Object.freeze({
    ...action,
    name: record.nameJa,
    ctbCost: 1,
    consumable: record.consumable,
    category: record.category,
  });
}

function crystalShardAction(shardId) {
  const record = battleReadyShards.find((shard) => shard.id === shardId);
  return record ? battleRecordToAction(record) : null;
}

/** Resolve every technique carried by an equipped えんばんせき (a disc can hold
 * up to 4 fused technique ids) into the battle command list. */
function crystalShardActionsFor(shardIds = []) {
  return shardIds.map((id) => crystalShardAction(id)).filter(Boolean);
}

function magicActionsForSchool(school, { maxLevel = Infinity } = {}) {
  return battleReadyMagic.filter((record) => record.school === school && (record.level ?? 0) <= maxLevel).map(magicRecordToAction);
}

const FIREBASE_SDK_VERSION = '12.16.0';
const FIREBASE_CDN_ROOT = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}`;

function configured(config) {
  return ['apiKey', 'authDomain', 'projectId', 'appId'].every((key) => Boolean(config?.[key]));
}

function publicProfile(profile, loginId, loginIdKey, createdAt, updatedAt) {
  return {
    playerName: String(profile.name || 'PLAYER').slice(0, 12),
    loginId,
    loginIdKey,
    level: Math.max(1, Math.trunc(profile.level || 1)),
    gil: Math.max(0, Math.trunc(profile.gil || 0)),
    diamonds: Math.max(0, Math.trunc(profile.diamonds || 0)),
    potions: Math.max(0, Math.trunc(profile.potions || 0)),
    items: Object.fromEntries(Object.entries(profile.items ?? {}).map(([id, count]) => [
      String(id).slice(0, 64),
      Math.max(0, Math.min(99, Math.trunc(Number(count) || 0))),
    ])),
    volume: Math.min(100, Math.max(0, Math.trunc(profile.volume ?? 70))),
    windowHue: Math.min(359, Math.max(0, Math.trunc(profile.windowHue ?? 220))),
    shards: [],
    discs: Array.isArray(profile.discs)
      ? profile.discs.slice(0, 200).map(({ uid, name, shardIds }) => ({
          uid: String(uid),
          name: String(name).slice(0, 16),
          shardIds: Array.isArray(shardIds) ? shardIds.slice(0, 4).map(String) : [],
        }))
      : [],
    ...(createdAt ? { createdAt } : {}),
    updatedAt,
  };
}

class FirebaseAccountService {
  constructor({ onStateChange } = {}) {
    this.config = window.FFM_FIREBASE_CONFIG ?? {};
    this.adminUid = window.FFM_ADMIN_UID ?? '';
    this.onStateChange = onStateChange ?? (() => {});
    this.status = configured(this.config) ? 'idle' : 'unconfigured';
    this.user = null;
    this.api = null;
    this.auth = null;
    this.db = null;
    this.initializing = null;
  }

  get isConfigured() {
    return configured(this.config);
  }

  get isSignedIn() {
    return Boolean(this.user);
  }

  get isAdmin() {
    return Boolean(this.user && this.adminUid && this.user.uid === this.adminUid);
  }

  get snapshot() {
    return {
      status: this.status,
      user: this.user,
      isConfigured: this.isConfigured,
      isSignedIn: this.isSignedIn,
      isAdmin: this.isAdmin,
    };
  }

  emit() {
    this.onStateChange(this.snapshot);
  }

  async initialize() {
    if (!this.isConfigured) {
      this.status = 'unconfigured';
      this.emit();
      return this.snapshot;
    }
    if (this.api) return this.snapshot;
    if (this.initializing) return this.initializing;

    this.status = 'connecting';
    this.emit();
    this.initializing = (async () => {
      try {
        const [appApi, authApi, firestoreApi] = await Promise.all([
          import(`${FIREBASE_CDN_ROOT}/firebase-app.js`),
          import(`${FIREBASE_CDN_ROOT}/firebase-auth.js`),
          import(`${FIREBASE_CDN_ROOT}/firebase-firestore.js`),
        ]);
        const app = appApi.initializeApp(this.config);
        this.auth = authApi.getAuth(app);
        this.db = firestoreApi.getFirestore(app);
        this.api = { authApi, firestoreApi };
        await authApi.setPersistence(this.auth, authApi.browserLocalPersistence);
        authApi.onAuthStateChanged(this.auth, (user) => {
          this.user = user;
          this.status = user ? 'signed_in' : 'signed_out';
          this.emit();
        });
        return this.snapshot;
      } catch (error) {
        this.status = 'error';
        this.emit();
        throw error;
      }
    })();
    return this.initializing;
  }

  normalizeLoginId(loginId) {
    const normalized = String(loginId).normalize('NFKC').trim().toLowerCase();
    if (!/^[a-z0-9_-]{4,24}$/.test(normalized)) {
      throw new Error('ログインIDは半角英数字・_・-を使い、4〜24文字で入力してください。');
    }
    return normalized;
  }

  async loginIdKey(loginId) {
    const normalized = this.normalizeLoginId(loginId);
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(normalized));
    return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
  }

  async authEmail(loginId) {
    return `${await this.loginIdKey(loginId)}@players.ffm.app`;
  }

  async requireReady() {
    await this.initialize();
    if (!this.api) throw new Error('Firebaseが設定されていません。');
  }

  async register(loginId, password, profile) {
    await this.requireReady();
    if (String(password).length < 6) throw new Error('パスワードは6文字以上で入力してください。');
    const normalizedLoginId = this.normalizeLoginId(loginId);
    const email = await this.authEmail(normalizedLoginId);
    const credential = await this.api.authApi.createUserWithEmailAndPassword(this.auth, email, password);
    await this.api.authApi.updateProfile(credential.user, { displayName: profile.name });
    this.user = credential.user;
    await this.saveProfile({ ...profile, loginId: normalizedLoginId }, { create: true });
    return credential.user;
  }

  async signIn(loginId, password) {
    await this.requireReady();
    const email = await this.authEmail(loginId);
    const credential = await this.api.authApi.signInWithEmailAndPassword(this.auth, email, password);
    this.user = credential.user;
    return credential.user;
  }

  async changePassword(password) {
    await this.requireReady();
    if (!this.user) throw new Error('先にログインしてください。');
    if (String(password).length < 6) throw new Error('パスワードは6文字以上で入力してください。');
    await this.api.authApi.updatePassword(this.user, password);
  }

  async signOut() {
    await this.requireReady();
    await this.api.authApi.signOut(this.auth);
  }

  async saveProfile(profile, { create = false } = {}) {
    if (!this.api || !this.user) return false;
    if (!profile.loginId) return false;
    const loginId = this.normalizeLoginId(profile.loginId);
    const key = await this.loginIdKey(loginId);
    const { doc, serverTimestamp, setDoc } = this.api.firestoreApi;
    const data = publicProfile(
      profile,
      loginId,
      key,
      create ? serverTimestamp() : null,
      serverTimestamp(),
    );
    await setDoc(doc(this.db, 'users', this.user.uid), data, { merge: !create });
    return true;
  }

  async loadProfile() {
    await this.requireReady();
    if (!this.user) return null;
    const { doc, getDoc } = this.api.firestoreApi;
    const snapshot = await getDoc(doc(this.db, 'users', this.user.uid));
    return snapshot.exists() ? snapshot.data() : null;
  }
}

function getAbilityActions(abilityId) {
  if (abilityMagicSet[abilityId]) {
    return magicSets[abilityMagicSet[abilityId]].map((spell) => ({
      ...spell,
      commandSourceId: abilityId,
    }));
  }
  if (abilityId === 'ability_dualcast') {
    return magicSets['赤魔法'].map((spell) => ({
      ...spell,
      id: `dual-${spell.id}`,
      visualId: `ability_dualcast_${spell.sourceId}`,
      commandSourceId: 'ability_dualcast',
      dualcastCandidate: true,
    }));
  }
  if (abilityId === 'ability_spellblade') {
    return [
      ['fire', 'ファイア剣', 'fire', 2, 5], ['blizzard', 'ブリザド剣', 'ice', 2, 5], ['thunder', 'サンダー剣', 'thunder', 2, 5],
      ['poison', 'ポイズン剣', 'poison', 1, 5, 'poison'], ['silence', 'サイレス剣', null, 1, 5, 'silence'], ['sleep', 'スリプル剣', null, 1, 5, 'sleep'],
      ['fira', 'ファイラ剣', 'fire', 2, 10], ['blizzara', 'ブリザラ剣', 'ice', 2, 10], ['thundara', 'サンダラ剣', 'thunder', 2, 10],
      ['drain', 'ドレイン剣', null, 1, 15, 'drain'], ['break', 'ブレイク剣', null, 1, 15, 'petrify'], ['bio', 'バイオ剣', 'poison', 2, 15, 'poison'],
      ['firaga', 'ファイガ剣', 'fire', 3, 20], ['blizzaga', 'ブリザガ剣', 'ice', 3, 20], ['thundaga', 'サンダガ剣', 'thunder', 3, 20],
      ['holy', 'ホーリー剣', 'holy', 3, 30], ['flare', 'フレア剣', null, 1, 30, 'flare'], ['osmose', 'アスピル剣', null, 1, 1, 'osmose'],
    ].map(([id, name, element, spellbladeTier, mpCost, spellbladeEffect]) => ({
      id: `spellblade-${id}`, name, actionKind: 'imbue', element, spellbladeTier, spellbladeEffect, mpCost, ctbCost: 0.8, target: 'self',
    })).map((action) => ({ ...action, sourceType: 'ability', sourceId: 'ability_spellblade', visualId: `ability_spellblade_${action.id}` }));
  }
  if (abilityId === 'ability_call') return [{ id: 'call', sourceId: 'ability_call', sourceType: 'ability', visualId: 'ability_call_random', commandSourceId: 'ability_call', name: 'よびだす', actionKind: 'special-command', specialCommand: 'call', target: 'all_enemies', ctbCost: 1, mpCost: 0 }];
  if (abilityId === 'ability_sing') {
    // Instant songs each apply a specific status; continuous songs are
    // stat-up buffs that persist while the dancer keeps singing.
    const instantSongEffects = Object.freeze({
      song_mighty_march: { actionKind: 'status', statuses: ['regen'] },
      song_romeo_s_ballad: { actionKind: 'status', statuses: ['stop'], statusChance: 0.62, element: 'sound' },
      song_alluring_air: { actionKind: 'status', statuses: ['confuse'], statusChance: 0.62, element: 'sound' },
      song_requiem: { actionKind: 'magic-attack', element: 'holy', power: 2.2 },
    });
    return ff5Songs.map((song, index) => {
      const instant = instantSongEffects[song.id];
      return {
        id: song.id,
        sourceId: song.id,
        sourceType: 'song',
        commandSourceId: 'ability_sing',
        visualId: song.id,
        name: song.nameJa,
        actionKind: instant?.actionKind ?? 'special-command',
        specialCommand: instant ? null : 'sing',
        songMode: song.mode,
        element: instant?.element ?? null,
        power: instant?.power,
        statuses: instant?.statuses ?? [],
        statusChance: instant?.statusChance,
        stat: song.id.includes('mana') ? 'magic' : song.id.includes('sinewy') ? 'atk' : 'agility',
        multiplier: 1.18 + index * 0.01,
        ctbCost: song.mode === 'continuous' ? 1.15 : 1,
        target: song.target,
        effect: song.effect,
      };
    });
  }
  return (directAbilityActions[abilityId] ?? []).map((action) => ({
    ...action,
    sourceType: 'ability',
    sourceId: abilityId,
    visualId: `${abilityId}_${action.id}`,
  }));
}

function isAbilityImplemented(abilityId) {
  return getAbilityActions(abilityId).length > 0;
}

/**
 * FF5 ボス技 参照データベース（日本語データ版）
 * ----------------------------------------------------
 * 目的：原作『ファイナルファンタジーV』のストーリー/隠しボスが使用する技を集約し、
 * ボスの技として実装する際にそのまま参照できる形にしておく（`BossActionProfiles.js`
 * のようなキットへ転記しやすい形）。このファイルはまだ戦闘には接続されていない
 * 参照カタログであり、`ff5Database.js` / `battleCatalog.js` とは独立している
 * （`scripts/validate-database.mjs` の厳密なレコード数検証の対象外）。

 * データ出典・方針
 * ----------------
 * 全レコードを日本語の攻略情報（ピクセルリマスター版のボス個別ページ、および
 * GBA版の行動パターンまとめページ）から収集し、技名・弱点属性は日本語表記の
 * まま採用している。英語名は内部識別用のローマ字ID（`id`フィールド）にのみ
 * 使用し、UIに表示される`nameJa`・`note`等はすべて日本語。
 * 効果の説明文(`note`)は出典の文章をそのまま転記せず、技名から一般的なFF

 *
 * `nameConfidence`：
 *   - 'high'   : ピクセルリマスター版の個別攻略ページで技名を直接確認済み。
 *   - 'medium' : GBA版まとめページの技名を採用（PR版でも同名の可能性が高いが、
 *                個別ページ未確認、またはEXステージ限定でPR未実装のため）。

 * HP等の数値は原作の一例（多くはGBA版基準）であり、相対的な強さの参考値。
 * FFM独自のボスステータス（`src/data/bossData.js`）と一致させる必要はない。
 */

function activePhase(unit) {
  const profile = BOSS_ACTION_PROFILES[unit.id];
  if (!profile) return null;
  return profile.phases.filter((phase) => unit.hpRatio() <= phase.maxHpRatio).sort((a, b) => a.maxHpRatio - b.maxHpRatio)[0] ?? profile.phases[0];
}

function bossActionsFor(unit) {
  return activePhase(unit)?.sequence ?? unit.aiActions ?? [];
}

function resolveChoiceIndex(entry, safeCursor, sequenceLength, depth) {
  const cycle = Math.floor(safeCursor / sequenceLength);
  const seed = Math.imul(cycle + 1 + depth * 7919, 1103515245) + safeCursor * 12345 + depth * 97;
  return (seed >>> 16) % entry.choices.length;
}

function resolveEntry(entry, safeCursor, sequenceLength) {
  let resolved = entry;
  let depth = 0;
  while (resolved?.choices?.length) {
    resolved = resolved.choices[resolveChoiceIndex(resolved, safeCursor, sequenceLength, depth)];
    depth += 1;
    if (depth > 5) break; // safety net against a misconfigured cyclic choice
  }
  return resolved;
}

/**
 * Returns either a single resolved action, or `{ multi: [actionA, actionB] }`
 * for turns that fire more than one action (e.g. Omega's turn-5 "2回攻撃").
 * Resolution is a deterministic hash of the cursor, so suspend/resume can't
 * reroll into a more convenient move.
 */
function nextBossActionFor(unit, cursor = 0) {
  const sequence = bossActionsFor(unit);
  if (!sequence.length) return { id: 'enemy-attack', name: 'こうげき', kind: 'physical-attack', ctbCost: 1 };
  const safeCursor = Math.max(0, cursor);
  const entry = sequence[safeCursor % sequence.length];
  if (entry?.multi?.length) {
    return { multi: entry.multi.map((subEntry) => resolveEntry(subEntry, safeCursor, sequence.length)) };
  }
  return resolveEntry(entry, safeCursor, sequence.length);
}

function bossPhaseIndex(unit) {
  const profile = BOSS_ACTION_PROFILES[unit.id];
  if (!profile) return 0;
  return Math.max(0, profile.phases.indexOf(activePhase(unit)));
}

function counterSequenceFor(unit) {
  return BOSS_ACTION_PROFILES[unit.id]?.counterSequence ?? [];
}
