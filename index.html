// ---- src/core/EventBus.js ----
/**
 * EventBus - minimal pub/sub used to decouple battle logic from UI rendering.
 */
class EventBus {
  constructor() {
    this.listeners = new Map();
  }

  on(eventName, callback) {
    if (!this.listeners.has(eventName)) {
      this.listeners.set(eventName, new Set());
    }
    this.listeners.get(eventName).add(callback);
    return () => this.off(eventName, callback);
  }

  off(eventName, callback) {
    this.listeners.get(eventName)?.delete(callback);
  }

  emit(eventName, payload) {
    this.listeners.get(eventName)?.forEach((cb) => {
      try {
        cb(payload);
      } catch (err) {
        console.error(`[EventBus] listener for "${eventName}" threw:`, err);
      }
    });
  }
}

// Shared singleton bus for the whole app.

  GAMEOVER: 'GAMEOVER',

    // Progress trackers shared across the whole run.
    this.bossIndex = 0;
    this.partyRuntime = null; // populated by main.js with live Unit stat carry-over
  }

  set(next) {
    const prev = this.current;
    this.current = next;
    eventBus.emit('state:changed', { prev, next });
  }

  is(state) {
    return this.current === state;
  }
}

    this.uid = `u${uidCounter++}`;
    this.id = config.id;
    this.name = config.name;
    this.isEnemy = !!config.isEnemy;
    this.role = config.role || null;

    this.maxHp = config.maxHp;
    this.hp = config.hp ?? config.maxHp;
    this.maxMp = config.maxMp ?? 0;
    this.mp = config.mp ?? this.maxMp;

    this.atk = config.atk ?? 10;
    this.def = config.def ?? 10;
    this.magic = config.magic ?? 10;
    this.agility = config.agility ?? 20;

    this.weakness = config.weakness ?? null; // element string
    this.resist = config.resist ?? null;
    this.weaponElement = config.weaponElement ?? null;
    this.weaponId = config.weaponId ?? 'w_neutral';
    this.baseAtk = config.baseAtk ?? this.atk;
    this.equippedAbilitySet = config.equippedAbilitySet ?? 'たたかう型';

    this.size = config.size ?? 1.0;
    this.ai = config.ai ?? null;

    // CTB state
    this.ctValue = config.ctValue ?? Math.random() * 200; // slight stagger at battle start
    this.defending = false;

    this.magicList = config.magicList ?? [];
  }

  isAlive() {
    return this.hp > 0;
  }

  applyDamage(amount) {
    const dmg = Math.max(0, Math.round(amount));
    this.hp = Math.max(0, this.hp - dmg);
    return dmg;
  }

  applyHeal(amount) {
    const before = this.hp;
    this.hp = Math.min(this.maxHp, this.hp + Math.round(amount));
    return this.hp - before;
  }

  spendMp(amount) {
    this.mp = Math.max(0, this.mp - amount);
  }

  hpRatio() {
    return this.hp / this.maxHp;
  }
}

// ---- src/battle/ActionResolver.js ----
/**
 * ActionResolver
 * Pure(ish) functions that turn an "action" declaration into concrete
 * HP/MP changes on the involved units. Kept separate from BattleManager so
 * the math can be unit-tested / tweaked independently of turn flow.
 */

const VARIANCE = 0.15; // +/-15% randomness on damage

function randomVariance(base) {
  const factor = 1 + (Math.random() * 2 - 1) * VARIANCE;
  return base * factor;
}

/** Physical attack damage: ATK vs DEF, with a defend-state cut. */
function resolvePhysicalDamage(attacker, defender) {
  const raw = Math.max(1, attacker.atk * 2.2 - defender.def * 1.1);
  let dmg = randomVariance(raw);
  if (attacker.weaponElement && defender.weakness === attacker.weaponElement) dmg *= 1.5;
  if (attacker.weaponElement && defender.resist === attacker.weaponElement) dmg *= 0.5;
  if (defender.defending) dmg *= 0.5;
  return Math.max(1, Math.round(dmg));
}

/** Magic/elemental damage: MAGIC stat * spell power, weakness/resist modifiers. */
function resolveMagicDamage(caster, defender, spell) {
  const raw = Math.max(1, caster.magic * 2.6 * (spell.power ?? 1.0) - defender.def * 0.4);
  let dmg = randomVariance(raw);

  if (spell.element) {
    if (defender.weakness === spell.element) dmg *= 1.75;
    if (defender.resist === spell.element) dmg *= 0.4;
  }
  if (defender.defending) dmg *= 0.5;
  return Math.max(1, Math.round(dmg));
}

/** Heal amount, with light randomness. */
function resolveHeal(amount) {
  return Math.max(1, Math.round(randomVariance(amount)));
}

/**
 * Resolve a full action given the actor, the chosen action definition,
 * and the target(s). Returns a log-friendly result object.
 */
function resolveAction({ actor, action, targets }) {
  const results = [];

  switch (action.kind) {
    case 'physical-attack': {
      const target = targets[0];
      const dmg = resolvePhysicalDamage(actor, target);
      const dealt = target.applyDamage(dmg);
      results.push({ type: 'damage', targetUid: target.uid, amount: dealt });
      break;
    }
    case 'magic-attack': {
      const target = targets[0];
      actor.spendMp(action.mpCost ?? 0);
      const dmg = resolveMagicDamage(actor, target, action);
      const dealt = target.applyDamage(dmg);
      const isWeak = target.weakness === action.element;
      results.push({ type: 'damage', targetUid: target.uid, amount: dealt, weak: isWeak });
      break;
    }
    case 'heal': {
      const target = targets[0];
      if (action.mpCost) actor.spendMp(action.mpCost);
      const healed = target.applyHeal(resolveHeal(action.healAmount));
      results.push({ type: 'heal', targetUid: target.uid, amount: healed });
      break;
    }
    case 'defend': {
      actor.defending = true;
      results.push({ type: 'defend', targetUid: actor.uid });
      break;
    }
    default:
      break;
  }

  return results;
}

// ---- src/battle/CTBEngine.js ----
/**
 * CTBEngine
 * ----------
 * Reproduces the core feel of FFX's Count/Charge Time Battle system:
 *  - Every unit accrues "CT" each tick, proportional to its Agility.
 *  - When a unit's CT crosses BASE_THRESHOLD, it becomes ready to act.
 *  - Acting consumes CT: the action's `ctbCost` multiplier decides how far
 *    the unit's CT drops below the threshold, i.e. how long until its next
 *    turn. Cheap/fast actions (Defend) barely delay the unit; heavy spells
 *    delay it a lot.
 *  - previewQueue() runs a side simulation (cloned CT values only) to show
 *    the upcoming turn order without mutating real battle state.
 */
const BASE_THRESHOLD = 1000;

class CTBEngine {
  constructor(units) {
    this.units = units;
  }

  aliveUnits() {
    return this.units.filter((u) => u.isAlive());
  }

  /**
   * Advances real CT values tick by tick until exactly one unit is ready,
   * then returns that unit. Ties are broken by whichever accumulated the
   * highest CT overshoot, then by Agility.
   */
  advanceToNextActor() {
    const alive = this.aliveUnits();
    if (alive.length === 0) return null;

    // Fast-forward: compute, per unit, how many ticks until threshold, then
    // jump straight to the smallest requirement instead of looping tick by tick.
    // (Still tick-accurate for tie-breaking.)
    let guard = 0;
    while (guard++ < 100000) {
      const ready = alive.filter((u) => u.ctValue >= BASE_THRESHOLD);
      if (ready.length > 0) {
        ready.sort((a, b) => (b.ctValue - a.ctValue) || (b.agility - a.agility));
        return ready[0];
      }
      // Jump forward by the minimum number of ticks needed for the fastest
      // unit-to-threshold gap, applied to everyone at once (equivalent to
      // simulating tick-by-tick, just faster).
      const ticksNeeded = alive.map((u) =>
        Math.ceil((BASE_THRESHOLD - u.ctValue) / Math.max(1, u.agility))
      );
      const jump = Math.max(1, Math.min(...ticksNeeded));
      alive.forEach((u) => {
        u.ctValue += u.agility * jump;
      });
    }
    return alive[0];
  }

  /** Consumes the acting unit's turn, applying the action's CTB cost. */
  consumeTurn(unit, ctbCost = 1.0) {
    unit.ctValue -= BASE_THRESHOLD * ctbCost;
    if (unit.ctValue < -BASE_THRESHOLD * 2) {
      // safety clamp so a single huge cost can't strand a unit forever
      unit.ctValue = -BASE_THRESHOLD * 2;
    }
  }

  /**
   * Predicts the next `count` actors without mutating real units.
   * Enemies are assumed to use a "normal" (1.0) cost action; this is only
   * a preview so perfect accuracy isn't required.
   */
  previewQueue(count = 8) {
    const clones = this.aliveUnits().map((u) => ({
      uid: u.uid,
      id: u.id,
      name: u.name,
      isEnemy: u.isEnemy,
      ct: u.ctValue,
      agi: u.agility,
    }));
    if (clones.length === 0) return [];

    const queue = [];
    let guard = 0;
    while (queue.length < count && guard++ < 100000) {
      const ready = clones.filter((c) => c.ct >= BASE_THRESHOLD);
      if (ready.length === 0) {
        const ticksNeeded = clones.map((c) =>
          Math.ceil((BASE_THRESHOLD - c.ct) / Math.max(1, c.agi))
        );
        const jump = Math.max(1, Math.min(...ticksNeeded));
        clones.forEach((c) => {
          c.ct += c.agi * jump;
        });
        continue;
      }
      ready.sort((a, b) => (b.ct - a.ct) || (b.agi - a.agi));
      const actor = ready[0];
      queue.push({ uid: actor.uid, id: actor.id, name: actor.name, isEnemy: actor.isEnemy });
      actor.ct -= BASE_THRESHOLD * 1.0; // assume average-cost action for preview purposes
    }
    return queue;
  }
}

// ---- src/ui/MessageWindow.js ----
const HOLD_MS = 1800;

class MessageWindow {
  constructor(windowEl, textEl) {
    this.windowEl = windowEl;
    this.textEl = textEl;
    this.hideTimer = null;
  }

  show(text) {
    this.textEl.textContent = text;
    this.windowEl.classList.remove('hidden');
    clearTimeout(this.hideTimer);
    this.hideTimer = setTimeout(() => this.hide(), HOLD_MS);
  }

  hide() {
    this.windowEl.classList.add('hidden');
  }
}

// ---- src/battle/BattleManager.js ----
const ENEMY_TURN_DELAY_MS = 900;
const AUTO_ADVANCE_DELAY_MS = 550;

class BattleManager {
  constructor(partyUnits, bossUnit) {
    this.party = partyUnits;
    this.boss = bossUnit;
    this.units = [...partyUnits, bossUnit];
    this.ctb = new CTBEngine(this.units);

    this.currentActor = null;
    this.awaitingPlayerInput = false;
    this.finished = false;
    this.result = null; // 'victory' | 'defeat'
  }

  log(text) {
    eventBus.emit('battle:log', text);
  }

  broadcastState() {
    eventBus.emit('battle:stateUpdate', {
      party: this.party,
      boss: this.boss,
      preview: this.ctb.previewQueue(8),
    });
  }

  start() {
    this.log(`${this.boss.name} が あらわれた！`);
    this.broadcastState();
    this.scheduleNextTurn(400);
  }

  scheduleNextTurn(delay = AUTO_ADVANCE_DELAY_MS) {
    if (this.finished) return;
    setTimeout(() => this.advanceTurn(), delay);
  }

  checkBattleEnd() {
    if (!this.boss.isAlive()) {
      this.finished = true;
      this.result = 'victory';
      this.log(`${this.boss.name} を たおした！`);
      eventBus.emit('battle:end', { result: 'victory' });
      return true;
    }
    if (this.party.every((p) => !p.isAlive())) {
      this.finished = true;
      this.result = 'defeat';
      this.log('パーティは ぜんめつした...');
      eventBus.emit('battle:end', { result: 'defeat' });
      return true;
    }
    return false;
  }

  advanceTurn() {
    if (this.finished) return;
    const actor = this.ctb.advanceToNextActor();
    if (!actor) return;
    this.currentActor = actor;

    // Reset defend stance at the start of a unit's own turn.
    actor.defending = false;

    if (actor.isEnemy) {
      this.broadcastState();
      setTimeout(() => this.enemyAct(actor), ENEMY_TURN_DELAY_MS);
    } else {
      this.awaitingPlayerInput = true;
      this.broadcastState();
      eventBus.emit('battle:playerTurn', { actor });
    }
  }

  /** Simple AI: picks a target based on the boss's `ai` behaviour tag. */
  pickEnemyTarget() {
    const aliveParty = this.party.filter((p) => p.isAlive());
    if (aliveParty.length === 0) return null;

    switch (this.boss.ai) {
      case 'lowestHp':
        return aliveParty.reduce((a, b) => (a.hp < b.hp ? a : b));
      case 'aggressive':
        return aliveParty.reduce((a, b) => (a.atk > b.atk ? a : b));
      case 'random':
      default:
        return aliveParty[Math.floor(Math.random() * aliveParty.length)];
    }
  }

  enemyAct(actor) {
    if (this.finished) return;
    const target = this.pickEnemyTarget();
    if (!target) {
      this.checkBattleEnd();
      return;
    }

    const results = resolveAction({
      actor,
      action: { kind: 'physical-attack' },
      targets: [target],
    });

    results.forEach((r) => {
      if (r.type === 'damage') {
        this.log(`${actor.name} の こうげき！ ${target.name} に ${r.amount} の ダメージ！`);
      }
    });

    eventBus.emit('battle:actionResolved', { actor, results });
    this.ctb.consumeTurn(actor, attackAction.ctbCost);
    this.broadcastState();

    if (this.checkBattleEnd()) return;
    this.scheduleNextTurn();
  }

  /**
   * Called by the UI once the player has picked a command (+ target).
   * `choice` shape: { kind, name, ctbCost, element, power, mpCost, healAmount }
   */
  submitPlayerAction(choice, targetUnit) {
    if (!this.awaitingPlayerInput || !this.currentActor) return;
    const actor = this.currentActor;

    let action;
    let targets;

    switch (choice.type) {
      case 'attack':
        action = { kind: 'physical-attack' };
        targets = [targetUnit ?? this.boss];
        this.log(`${actor.name} の こうげき！`);
        break;
      case 'magic':
        action = {
          kind: choice.spell.healAmount !== undefined && choice.spell.power === undefined
            ? 'heal'
            : 'magic-attack',
          element: choice.spell.element,
          power: choice.spell.power,
          mpCost: choice.spell.mpCost,
          healAmount: choice.spell.healAmount,
        };
        targets = [
          action.kind === 'heal' ? targetUnit ?? actor : targetUnit ?? this.boss,
        ];
        this.log(`${actor.name} の ${choice.spell.name}！`);
        break;
      case 'item':
        action = { kind: 'heal', healAmount: choice.item.healAmount };
        targets = [targetUnit ?? actor];
        this.log(`${actor.name} は ${choice.item.name} を つかった！`);
        break;
      case 'defend':
        action = { kind: 'defend' };
        targets = [actor];
        this.log(`${actor.name} は みをまもっている。`);
        break;
      default:
        return;
    }

    const results = resolveAction({ actor, action, targets });
    results.forEach((r) => {
      if (r.type === 'damage') {
        const weakText = r.weak ? '(弱点！)' : '';
        this.log(`${targets[0].name} に ${r.amount} の ダメージ！${weakText}`);
      } else if (r.type === 'heal') {
        this.log(`${targets[0].name} の HPが ${r.amount} かいふくした。`);
      }
    });

    eventBus.emit('battle:actionResolved', { actor, results });

    const costUsed = choice.ctbCost ?? 1.0;
    this.ctb.consumeTurn(actor, costUsed);

    this.awaitingPlayerInput = false;
    this.currentActor = null;
    this.broadcastState();

    if (this.checkBattleEnd()) return;
    this.scheduleNextTurn();
  }
}

// ---- src/ui/BattleUI.js ----
function hpBarClass(unit) {
  const ratio = unit.hpRatio();
  if (ratio <= 0.25) return 'low';
  if (ratio <= 0.5) return 'mid';
  return '';
}

class BattleUI {
  constructor() {
    this.enemyFieldEl = document.getElementById('enemy-field');
    this.partyFieldEl = document.getElementById('party-field');
    this.ctbListEl = document.getElementById('ctb-list');
    this.enemyInfoEl = document.getElementById('enemy-info-content');
    this.commandListEl = document.getElementById('command-list');
    this.commandHeadingEl = document.getElementById('command-heading');
    this.partyStatusEl = document.getElementById('party-status-content');

    this.submenuWindowEl = document.getElementById('submenu-window');
    this.submenuHeadingEl = document.getElementById('submenu-heading');
    this.submenuListEl = document.getElementById('submenu-list');

    this.targetWindowEl = document.getElementById('target-window');
    this.targetListEl = document.getElementById('target-list');

    this.messageWindow = new MessageWindow(
      document.getElementById('message-window'),
      document.getElementById('message-text')
    );

    this.battleManager = null;
    this.pendingCommandType = null; // 'attack' | 'magic' | 'item' | 'defend'
    this.pendingSpellOrItem = null;

    this._bindStaticEvents();
  }

  attachBattle(battleManager) {
    this.battleManager = battleManager;
    this.closeActionWindows();
    this.renderCommandListIdle();
  }

  _bindStaticEvents() {
    eventBus.on('battle:log', (text) => this.messageWindow.show(text));

    eventBus.on('battle:stateUpdate', ({ party, boss, preview }) => {
      this.renderEnemyField(boss);
      this.renderPartyField(party, this.battleManager?.currentActor);
      this.renderCtbList(preview);
      this.renderEnemyInfo(boss);
      this.renderPartyStatus(party);
    });

    eventBus.on('battle:playerTurn', ({ actor }) => {
      this.closeActionWindows();
      this.renderCommandListForActor(actor);
    });

    eventBus.on('battle:actionResolved', ({ results }) => {
      results.forEach((r) => {
        const el = document.querySelector(`[data-uid="${r.targetUid}"]`);
        if (el) {
          el.classList.add('flash');
          setTimeout(() => el.classList.remove('flash'), 500);
        }
      });
    });
  }

  // ---------- Rendering ----------

  renderEnemyField(boss) {
    this.enemyFieldEl.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'enemy-sprite-wrap';

    const sprite = document.createElement('div');
    sprite.className = `sprite-placeholder boss${boss.isAlive() ? '' : ' dead'}`;
    sprite.dataset.uid = boss.uid;
    const scale = Math.min(220, 185 * (boss.size ?? 1));
    sprite.style.width = `${scale}px`;
    sprite.style.height = `${scale}px`;

    const blob = document.createElement('div');
    blob.className = 'blob';
    blob.style.width = '100%';
    blob.style.height = '100%';
    sprite.appendChild(blob);

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = boss.name;
    sprite.appendChild(label);

    wrap.appendChild(sprite);
    this.enemyFieldEl.appendChild(wrap);
  }

  renderPartyField(party, currentActor) {
    this.partyFieldEl.innerHTML = '';
    party.forEach((unit, idx) => {
      const row = document.createElement('div');
      row.className = 'party-unit-row';

      const spriteSlot = document.createElement('div');
      spriteSlot.className = 'sprite-slot';
      const sprite = document.createElement('div');
      sprite.className = `sprite-placeholder player${unit.isAlive() ? '' : ' dead'}`;
      sprite.dataset.uid = unit.uid;
      sprite.style.width = '100%';
      sprite.style.height = '100%';
      const blob = document.createElement('div');
      blob.className = 'blob';
      blob.style.width = '100%';
      blob.style.height = '100%';
      sprite.appendChild(blob);
      spriteSlot.appendChild(sprite);
      row.appendChild(spriteSlot);

      const meta = document.createElement('div');
      meta.className = 'unit-meta';

      const nameLine = document.createElement('div');
      nameLine.className = 'unit-name-line' + (currentActor === unit ? ' active-turn' : '');
      nameLine.innerHTML = `<span>P${idx + 1}: ${unit.name}</span>`;
      meta.appendChild(nameLine);

      const roleLine = document.createElement('div');
      roleLine.className = 'unit-role';
      roleLine.textContent = unit.role ?? '';
      meta.appendChild(roleLine);

      const barTrack = document.createElement('div');
      barTrack.className = 'stat-bar-track';
      const barFill = document.createElement('div');
      barFill.className = `stat-bar-fill hp ${hpBarClass(unit)}`;
      barFill.style.width = `${Math.max(0, unit.hpRatio() * 100)}%`;
      barTrack.appendChild(barFill);
      meta.appendChild(barTrack);

      row.appendChild(meta);
      this.partyFieldEl.appendChild(row);
    });
  }

  renderCtbList(preview) {
    this.ctbListEl.innerHTML = '';
    preview.forEach((entry) => {
      const row = document.createElement('div');
      row.className = 'ctb-entry';
      const icon = document.createElement('div');
      icon.className = `ctb-icon ${entry.isEnemy ? 'enemy' : 'player'}`;
      const label = document.createElement('div');
      label.className = 'ctb-label';
      label.textContent = entry.name;
      row.appendChild(icon);
      row.appendChild(label);
      this.ctbListEl.appendChild(row);
    });
  }

  renderEnemyInfo(boss) {
    const weakText = boss.weakness ? (elementNames[boss.weakness] ?? boss.weakness) : '不明';
    this.enemyInfoEl.innerHTML = `
      <div>${boss.name}</div>
      <div>HP: ${boss.hp} / ${boss.maxHp}</div>
      <div class="stat-bar-track"><div class="stat-bar-fill hp ${hpBarClass(boss)}" style="width:${Math.max(0, boss.hpRatio() * 100)}%"></div></div>
      <div>弱点: ${weakText}</div>
    `;
  }

  renderPartyStatus(party) {
    this.partyStatusEl.innerHTML = '';
    party.forEach((unit, idx) => {
      const row = document.createElement('div');
      row.className = 'status-row';
      row.innerHTML = `
        <div class="p-name">${unit.name}</div>
        <div class="p-nums">
          <span>HP ${unit.hp}/${unit.maxHp}</span>
          <div class="stat-bar-track"><div class="stat-bar-fill hp ${hpBarClass(unit)}" style="width:${Math.max(0, unit.hpRatio() * 100)}%"></div></div>
        </div>
        <div class="p-nums">
          <span>MP ${unit.mp}/${unit.maxMp}</span>
          <div class="stat-bar-track"><div class="stat-bar-fill mp" style="width:${unit.maxMp ? (unit.mp / unit.maxMp) * 100 : 0}%"></div></div>
        </div>
      `;
      this.partyStatusEl.appendChild(row);
    });
  }

  renderCommandListIdle() {
    this.commandHeadingEl.textContent = 'コマンド';
    this.commandListEl.innerHTML = '<li style="opacity:.6">・・・待機中・・・</li>';
  }

  renderCommandListForActor(actor) {
    this.commandHeadingEl.textContent = actor.name;
    this.commandListEl.innerHTML = '';
    basicCommands.forEach((cmd) => {
      const li = document.createElement('li');
      li.textContent = cmd.label;
      li.addEventListener('click', () => this.handleCommandSelect(cmd.id, actor));
      this.commandListEl.appendChild(li);
    });
  }

  // ---------- Player input flow ----------

  handleCommandSelect(commandId, actor) {
    // A newly selected command always replaces any open submenu/target window.
    this.closeActionWindows();

    switch (commandId) {
      case 'attack':
        this.submitAttack(actor);
        break;
      case 'defend':
        this.submitDefend(actor);
        break;
      case 'magic':
      case 'ability': {
        const setName = actor.equippedAbilitySet ?? 'たたかう型';
        const list = magicSets[setName] ?? [];
        this.openSubmenu(commandId === 'magic' ? 'まほう' : 'アビリティ', list, 'spell', actor);
        break;
      }
      case 'item':
        this.openSubmenu('アイテム', itemActions, 'item', actor);
        break;
      default:
        break;
    }
  }

  submitAttack(actor) {
    this.battleManager.submitPlayerAction({ type: 'attack', ctbCost: attackAction.ctbCost }, this.battleManager.boss);
  }

  submitDefend(actor) {
    this.battleManager.submitPlayerAction({ type: 'defend', ctbCost: defendAction.ctbCost }, actor);
  }

  openSubmenu(heading, list, kind, actor) {
    this.submenuHeadingEl.textContent = heading;
    this.submenuListEl.innerHTML = '';

    if (list.length === 0) {
      const li = document.createElement('li');
      li.textContent = '(つかえるものがない)';
      this.submenuListEl.appendChild(li);
    }

    list.forEach((entry) => {
      const li = document.createElement('li');
      const costLabel = entry.mpCost ? ` (MP${entry.mpCost})` : '';
      li.textContent = `${entry.name}${costLabel}`;
      const disabled = kind === 'spell' && entry.mpCost && actor.mp < entry.mpCost;
      if (disabled) {
        li.style.opacity = '0.4';
        li.style.cursor = 'not-allowed';
      } else {
        li.addEventListener('click', () => {
          this.closeSubmenu();
          this.pendingCommandType = kind;
          this.pendingSpellOrItem = entry;
          this.promptTarget(entry, kind, actor);
        });
      }
      this.submenuListEl.appendChild(li);
    });

    // cancel option
    const cancel = document.createElement('li');
    cancel.textContent = 'もどる';
    cancel.style.color = '#ffcf7a';
    cancel.addEventListener('click', () => this.closeSubmenu());
    this.submenuListEl.appendChild(cancel);

    this.submenuWindowEl.classList.remove('hidden');
  }

  closeSubmenu() {
    this.submenuWindowEl.classList.add('hidden');
  }

  closeActionWindows() {
    this.closeSubmenu();
    this.closeTargetWindow();
    this.pendingCommandType = null;
    this.pendingSpellOrItem = null;
  }

  promptTarget(entry, kind, actor) {
    const isHeal = entry.healAmount !== undefined;
    const targets = isHeal ? this.battleManager.party.filter((p) => p.isAlive()) : [this.battleManager.boss];

    if (targets.length === 1) {
      this.finalizeAction(entry, kind, targets[0]);
      return;
    }

    this.targetListEl.innerHTML = '';
    targets.forEach((t) => {
      const li = document.createElement('li');
      li.textContent = `${t.name} (HP ${t.hp}/${t.maxHp})`;
      li.addEventListener('click', () => {
        this.closeTargetWindow();
        this.finalizeAction(entry, kind, t);
      });
      this.targetListEl.appendChild(li);
    });
    this.targetWindowEl.classList.remove('hidden');
  }

  closeTargetWindow() {
    this.targetWindowEl.classList.add('hidden');
  }

  finalizeAction(entry, kind, target) {
    this.closeActionWindows();
    if (kind === 'spell') {
      this.battleManager.submitPlayerAction({ type: 'magic', spell: entry, ctbCost: entry.ctbCost }, target);
    } else if (kind === 'item') {
      this.battleManager.submitPlayerAction({ type: 'item', item: entry, ctbCost: entry.ctbCost }, target);
    }
  }
}

class IntermissionUI {

  render(partyUnits, nextBoss) {

      const spriteSlot = document.createElement('div');
      spriteSlot.className = 'sprite-slot';
      spriteSlot.style.width = '48px';
      spriteSlot.style.height = '48px';
      const sprite = document.createElement('div');
      sprite.className = 'sprite-placeholder player';
      sprite.style.width = '100%';
      sprite.style.height = '100%';
      const blob = document.createElement('div');
      blob.className = 'blob';
      blob.style.width = '100%';
      blob.style.height = '100%';
      sprite.appendChild(blob);
      spriteSlot.appendChild(sprite);
      card.appendChild(spriteSlot);

      const info = document.createElement('div');
      info.style.flex = '1';

      const nameEl = document.createElement('div');

      info.appendChild(nameEl);

      statsEl.className = 'card-stats';
      statsEl.innerHTML = `HP ${unit.hp}/${unit.maxHp}　MP ${unit.mp}/${unit.maxMp}<br>ATK ${unit.atk}　MAG ${unit.magic}　AGI ${unit.agility}`;
      info.appendChild(statsEl);

      const selects = document.createElement('div');
      selects.className = 'ability-select';

      // Weapon select
      const weaponLabel = document.createElement('label');
      weaponLabel.className = 'card-stats';
      weaponLabel.textContent = 'ぶき: ';
      const weaponSelect = document.createElement('select');
      weaponOptions.forEach((w) => {
        const opt = document.createElement('option');
        opt.value = w.id;
        opt.textContent = w.name;
        if (unit.weaponId === w.id || (!unit.weaponId && w.id === 'w_neutral')) opt.selected = true;
        weaponSelect.appendChild(opt);
      });
      weaponSelect.addEventListener('change', () => {
        const chosen = weaponOptions.find((w) => w.id === weaponSelect.value);
        unit.weaponId = chosen.id;
        unit.weaponElement = chosen.element;
        unit.atk = unit.baseAtk + chosen.atkBonus;
      });
      weaponLabel.appendChild(weaponSelect);
      selects.appendChild(weaponLabel);

      // Ability-set select
      const abilityLabel = document.createElement('label');
      abilityLabel.className = 'card-stats';
      abilityLabel.textContent = 'まほう: ';
      const abilitySelect = document.createElement('select');
      abilitySetOptions.forEach((setName) => {
        const opt = document.createElement('option');
        opt.value = setName;
        opt.textContent = setName;
        if (unit.equippedAbilitySet === setName) opt.selected = true;
        abilitySelect.appendChild(opt);
      });
      abilitySelect.addEventListener('change', () => {
        unit.equippedAbilitySet = abilitySelect.value;
      });
      abilityLabel.appendChild(abilitySelect);
      selects.appendChild(abilityLabel);

      info.appendChild(selects);
      card.appendChild(info);
      this.containerEl.appendChild(card);
    });
  }
}

const screens = {

  screens[stateName]?.classList.add('active-screen');
}

eventBus.on('state:changed', ({ next }) => showScreen(next));

// ---------- Player profile / menu ----------
const PROFILE_STORAGE_KEY = 'ff-crystal-rush-profile-v1';
const shardCatalog = [
  { id: 'azure', name: '蒼光のかけら', ability: 'アクアスパイラル' },
  { id: 'ember', name: '紅炎のかけら', ability: 'フレイムバースト' },
  { id: 'storm', name: '紫電のかけら', ability: 'ライトニングエッジ' },
  { id: 'verdant', name: '翠風のかけら', ability: 'ウィンドカッター' },
];

const defaultProfile = {
  name: 'PLAYER',
  level: 1,
  gil: 2000,
  diamonds: 900,
  potions: 3,
  volume: 70,
  statusHue: 220,
  shards: [{ ...shardCatalog[0], count: 1 }],
};

function loadProfile() {
  try {
    const saved = JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY) || 'null');
    if (!saved) return structuredClone(defaultProfile);
    return {
      ...structuredClone(defaultProfile),
      ...saved,
      shards: Array.isArray(saved.shards) ? saved.shards : structuredClone(defaultProfile.shards),
    };
  } catch {
    return structuredClone(defaultProfile);
  }
}

let profile = loadProfile();

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function applyProfileOptions() {
  document.documentElement.style.setProperty('--status-hue', String(profile.statusHue));
}

function renderProfileStatus() {
  document.getElementById('profile-name').textContent = profile.name;
  document.getElementById('profile-level').textContent = profile.level;
  document.getElementById('profile-gil').textContent = profile.gil.toLocaleString('ja-JP');
  document.getElementById('profile-diamonds').textContent = profile.diamonds.toLocaleString('ja-JP');
}

function saveProfile() {
  try {
    localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(profile));
  } catch {
    // The game remains usable when storage is unavailable (for example file:// previews).
  }
  applyProfileOptions();
  renderProfileStatus();
}

const menuPanelEl = document.getElementById('menu-panel');
const menuPanelTitleEl = document.getElementById('menu-panel-title');
const menuPanelContentEl = document.getElementById('menu-panel-content');

function closeMenuPanel() {
  menuPanelEl.classList.add('hidden');
  menuPanelContentEl.innerHTML = '';
}

function openMenuPanel(title, html) {
  menuPanelTitleEl.textContent = title;
  menuPanelContentEl.innerHTML = html;
  menuPanelEl.classList.remove('hidden');
}

function openMainMenu() {
  closeMenuPanel();
  renderProfileStatus();
  GameState.set(States.MENU);
}

function renderCourseSelect() {
  openMenuPanel(
    'コース選択',
    `<div class="course-list">
      <button id="course-beginner" class="course-card">
        <span class="course-rank">COURSE 01</span>
        <strong>クリスタル探索・初級</strong>
        <small>3連戦 / 推奨Lv 1 / 初回報酬 300 GIL</small>
        <span class="course-start-label">編成へ進む</span>
      </button>
    </div>`
  );
  document.getElementById('course-beginner').addEventListener('click', beginCourseSetup);
}

function renderShop(message = '') {
  openMenuPanel(
    'ショップ',
    `${message ? `<p class="menu-notice">${escapeHtml(message)}</p>` : ''}
    <div class="shop-card">
      <div>
        <strong>ポーション</strong>
        <small>味方ひとりのHPを400回復</small>
      </div>
      <div class="shop-card-side">
        <span>所持 ${profile.potions}</span>
        <button id="buy-potion" class="panel-button">100 GIL</button>
      </div>
    </div>`
  );
  document.getElementById('buy-potion').addEventListener('click', () => {
    if (profile.gil < 100) {
      renderShop('ギルが足りません。');
      return;
    }
    profile.gil -= 100;
    profile.potions += 1;
    saveProfile();
    renderShop('ポーションを購入しました。');
  });
}

function renderGacha(message = '') {
  openMenuPanel(
    'クリスタルガチャ',
    `<div class="gacha-visual" aria-hidden="true"><span></span></div>
    <p>クリスタルに眠る技の記憶を「かけら」として呼び出します。</p>
    ${message ? `<p class="menu-notice">${escapeHtml(message)}</p>` : ''}
    <button id="draw-crystal" class="panel-button primary">1回召喚 / 300 DIAMOND</button>`
  );
  document.getElementById('draw-crystal').addEventListener('click', () => {
    if (profile.diamonds < 300) {
      renderGacha('ダイヤが足りません。');
      return;
    }
    profile.diamonds -= 300;
    const drawn = shardCatalog[Math.floor(Math.random() * shardCatalog.length)];
    const owned = profile.shards.find((item) => item.id === drawn.id);
    if (owned) owned.count += 1;
    else profile.shards.push({ ...drawn, count: 1 });
    saveProfile();
    renderGacha(`${drawn.name}を入手！ アビリティ「${drawn.ability}」の記憶が輝いている。`);
  });
}

function renderKeyItems() {
  const items = profile.shards.length
    ? profile.shards
        .map(
          (item) => `<li class="shard-row">
            <span class="shard-gem" aria-hidden="true"></span>
            <span><strong>${escapeHtml(item.name)}</strong><small>記憶技：${escapeHtml(item.ability)}</small></span>
            <b>×${item.count}</b>
          </li>`
        )
        .join('')
    : '<li class="empty-state">まだクリスタルのかけらを持っていません。</li>';
  openMenuPanel('だいじなもの', `<ul class="shard-list">${items}</ul>`);
}

function renderOptions(message = '') {
  openMenuPanel(
    'オプション',
    `<form id="options-form" class="options-form">
      ${message ? `<p class="menu-notice">${escapeHtml(message)}</p>` : ''}
      <label>プレイヤー名<input id="option-player-name" maxlength="12" value="${escapeHtml(profile.name)}"></label>
      <label>音量 <output id="volume-output">${profile.volume}</output>
        <input id="option-volume" type="range" min="0" max="100" value="${profile.volume}">
      </label>
      <label>ステータスバーの色相 <output id="hue-output">${profile.statusHue}</output>
        <input id="option-hue" type="range" min="0" max="359" value="${profile.statusHue}">
      </label>
      <button class="panel-button primary" type="submit">設定を保存</button>
    </form>`
  );

  const hueInput = document.getElementById('option-hue');
  const volumeInput = document.getElementById('option-volume');
  hueInput.addEventListener('input', () => {
    document.getElementById('hue-output').textContent = hueInput.value;
    document.documentElement.style.setProperty('--status-hue', hueInput.value);
  });
  volumeInput.addEventListener('input', () => {
    document.getElementById('volume-output').textContent = volumeInput.value;
  });
  document.getElementById('options-form').addEventListener('submit', (event) => {
    event.preventDefault();
    profile.name = document.getElementById('option-player-name').value.trim() || 'PLAYER';
    profile.volume = Number(volumeInput.value);
    profile.statusHue = Number(hueInput.value);
    saveProfile();
    renderOptions('設定を保存しました。');
  });
}

document.querySelectorAll('[data-menu-action]').forEach((button) => {
  button.addEventListener('click', () => {
    const action = button.dataset.menuAction;
    if (action === 'battle') renderCourseSelect();
    if (action === 'shop') renderShop();
    if (action === 'gacha') renderGacha();
    if (action === 'key-items') renderKeyItems();
    if (action === 'options') renderOptions();
  });
});

document.getElementById('menu-panel-back').addEventListener('click', closeMenuPanel);

// ---------- Persistent party (carries HP/MP/equip across bosses) ----------
let livingParty = null;

function freshPartyState() {
  return partyData.map((p) => ({
    ...p,
    hp: p.maxHp,
    mp: p.maxMp,
    baseAtk: p.atk,
    weaponId: 'w_neutral',
    weaponElement: null,
    weaponAtkBonus: 0,
  }));
}

function buildPartyUnits(state) {
  return state.map(
    (p) =>
      new Unit({
        id: p.id,
        name: p.name,
        role: p.role,
        isEnemy: false,
        maxHp: p.maxHp,
        hp: p.hp,
        maxMp: p.maxMp,
        mp: p.mp,
        atk: p.baseAtk + (p.weaponAtkBonus ?? 0),
        def: p.def,
        magic: p.magic,
        agility: p.agility,
        weaponElement: p.weaponElement,
        weaponId: p.weaponId,
        baseAtk: p.baseAtk,
        equippedAbilitySet: p.equippedAbilitySet,
      })
  );
}

function syncStateFromUnits(state, units) {
  state.forEach((p, i) => {
    p.hp = units[i].hp;
    p.mp = units[i].mp;
  });
}

function buildBossUnit(bossConfig) {
  return new Unit({
    id: bossConfig.id,
    name: bossConfig.name,
    isEnemy: true,
    maxHp: bossConfig.maxHp,
    atk: bossConfig.atk,
    def: bossConfig.def,
    magic: bossConfig.magic,
    agility: bossConfig.agility,
    weakness: bossConfig.weakness,
    resist: bossConfig.resist,
    size: bossConfig.size,
    ai: bossConfig.ai,
  });
}

// ---------- UI instances ----------
const battleUI = new BattleUI();
const intermissionUI = new IntermissionUI();

function applyPartySetup(partyUnits) {
  partyUnits.forEach((unit, index) => {
    livingParty[index].weaponId = unit.weaponId;
    livingParty[index].weaponElement = unit.weaponElement;
    livingParty[index].baseAtk = unit.baseAtk;
    const chosenWeapon = weaponOptions.find((weapon) => weapon.id === unit.weaponId);
    livingParty[index].weaponAtkBonus = chosenWeapon ? chosenWeapon.atkBonus : 0;
    livingParty[index].equippedAbilitySet = unit.equippedAbilitySet;
    livingParty[index].hp = livingParty[index].maxHp;
    livingParty[index].mp = livingParty[index].maxMp;
  });
}

function openPartySetup(nextBoss, { canReturnToMenu = false, readyLabel = 'バトル開始' } = {}) {
  GameState.set(States.INTERMISSION);

  const partyUnits = buildPartyUnits(livingParty).map((unit, index) =>
    Object.assign(unit, {
      baseAtk: livingParty[index].baseAtk,
      weaponId: livingParty[index].weaponId,
      equippedAbilitySet: livingParty[index].equippedAbilitySet,
    })
  );

  intermissionUI.render(partyUnits, nextBoss);

  const backButton = document.getElementById('setup-back-button');
  const readyButton = document.getElementById('ready-button');
  backButton.classList.toggle('hidden', !canReturnToMenu);
  backButton.onclick = canReturnToMenu ? openMainMenu : null;
  readyButton.textContent = readyLabel;
  readyButton.onclick = () => {
    applyPartySetup(partyUnits);
    startBossBattle();
  };
}

function beginCourseSetup() {
  GameState.bossIndex = 0;
  livingParty = freshPartyState();
  closeMenuPanel();
  openPartySetup(bossData[0], { canReturnToMenu: true, readyLabel: 'バトル開始' });
}

// ---------- Boss rush flow ----------
function startBossBattle() {
  GameState.set(States.BATTLE);

  const partyUnits = buildPartyUnits(livingParty);
  const bossConfig = bossData[GameState.bossIndex];
  const bossUnit = buildBossUnit(bossConfig);

  const battleManager = new BattleManager(partyUnits, bossUnit);
  battleUI.attachBattle(battleManager);

  const onEnd = ({ result }) => {
    eventBus.off('battle:end', onEnd);
    syncStateFromUnits(livingParty, partyUnits);

    if (result === 'victory') {
      setTimeout(() => goToIntermissionOrWin(), 1200);
    } else {
      setTimeout(() => GameState.set(States.GAMEOVER), 1200);
    }
  };
  eventBus.on('battle:end', onEnd);

  battleManager.start();
}

function goToIntermissionOrWin() {
  GameState.bossIndex += 1;
  if (GameState.bossIndex >= bossData.length) {
    profile.gil += 300;
    saveProfile();
    GameState.set(States.VICTORY);
    return;
  }

  openPartySetup(bossData[GameState.bossIndex], {
    canReturnToMenu: false,
    readyLabel: '次のバトルへ',
  });
}

// ---------- Title / restart wiring ----------
document.getElementById('start-button').addEventListener('click', openMainMenu);
document.getElementById('restart-button-win').addEventListener('click', openMainMenu);
document.getElementById('restart-button-lose').addEventListener('click', openMainMenu);

// ---------- PWA ----------
if ('serviceWorker' in navigator && ['http:', 'https:'].includes(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch((error) => {
      console.warn('Service worker registration failed:', error);
    });
  });
}

applyProfileOptions();
renderProfileStatus();
showScreen('TITLE');

})();
</script>
