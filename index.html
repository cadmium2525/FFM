'use strict';

// ---- src/core/EventBus.js ----
/**
 * EventBus - minimal pub/sub used to decouple battle logic from UI rendering.
 */
class EventBus {
  constructor() {
    this.listeners = new Map();
  }

  on(eventName, callback) {
    if (!this.listeners.has(eventName)) {
      this.listeners.set(eventName, new Set());
    }
    this.listeners.get(eventName).add(callback);
    return () => this.off(eventName, callback);
  }

  off(eventName, callback) {
    this.listeners.get(eventName)?.delete(callback);
  }

  emit(eventName, payload) {
    this.listeners.get(eventName)?.forEach((cb) => {
      try {
        cb(payload);
      } catch (err) {
        console.error(`[EventBus] listener for "${eventName}" threw:`, err);
      }
    });
  }
}

// Shared singleton bus for the whole app.
const eventBus = new EventBus();

// ---- src/core/GameState.js ----
const States = Object.freeze({
  TITLE: 'TITLE',
  MENU: 'MENU',
  BATTLE: 'BATTLE',
  INTERMISSION: 'INTERMISSION',
  VICTORY: 'VICTORY',
  GAMEOVER: 'GAMEOVER',
});

class GameStateManager {
  constructor() {
    this.current = States.TITLE;
    // Progress trackers shared across the whole run.
    this.bossIndex = 0;
    this.partyRuntime = null; // populated by main.js with live Unit stat carry-over
  }

  set(next) {
    const prev = this.current;
    this.current = next;
    eventBus.emit('state:changed', { prev, next });
  }

  is(state) {
    return this.current === state;
  }
}

const GameState = new GameStateManager();

// ---- src/core/Settings.js ----
const SETTINGS_STORAGE_KEY = 'ff-crystal-rush-settings-v1';

/**
 * Message window pacing presets. `holdMs` is how long a single message stays
 * on screen before advancing (or closing), `fastHoldMs` is the shortened
 * hold used when more messages are already queued up, and `betweenMs` is the
 * gap between one message closing and the next appearing.
 */
const MESSAGE_SPEED_PRESETS = Object.freeze({
  slow: { label: 'おそい', holdMs: 2400, fastHoldMs: 1700, betweenMs: 180 },
  normal: { label: 'ふつう', holdMs: 1700, fastHoldMs: 1100, betweenMs: 140 },
  fast: { label: 'はやい', holdMs: 900, fastHoldMs: 580, betweenMs: 55 },
});

const DEFAULT_SETTINGS = Object.freeze({
  messageSpeed: 'normal',
});

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_STORAGE_KEY) || 'null');
    if (!saved || !MESSAGE_SPEED_PRESETS[saved.messageSpeed]) return { ...DEFAULT_SETTINGS };
    return { ...DEFAULT_SETTINGS, ...saved };
  } catch {
    return { ...DEFAULT_SETTINGS };
  }
}

const state = load();

function save() {
  try {
    localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(state));
  } catch {
    // Settings simply won't persist across sessions if storage is unavailable.
  }
}

function getMessageSpeed() {
  return state.messageSpeed;
}

function getMessageSpeedTiming() {
  return MESSAGE_SPEED_PRESETS[state.messageSpeed] ?? MESSAGE_SPEED_PRESETS.normal;
}

function setMessageSpeed(speed) {
  if (!MESSAGE_SPEED_PRESETS[speed]) return;
  state.messageSpeed = speed;
  save();
  eventBus.emit('settings:changed', { key: 'messageSpeed', value: speed });
}

// ---- src/core/Loadout.js ----
const LOADOUT_STORAGE_KEY = 'ff-crystal-rush-loadouts-v1';

/**
 * Per-character equipment/ability/crystal-shard selections made in the
 * intermission (party formation) screen, persisted to localStorage so the
 * player doesn't have to re-specify them every time they start a new run.
 */
function loadAll() {
  try {
    const saved = JSON.parse(localStorage.getItem(LOADOUT_STORAGE_KEY) || 'null');
    return saved && typeof saved === 'object' ? saved : {};
  } catch {
    return {};
  }
}

const loadoutState = loadAll();

function persist() {
  try {
    localStorage.setItem(LOADOUT_STORAGE_KEY, JSON.stringify(loadoutState));
  } catch {
    // Loadout simply won't persist across sessions if storage is unavailable.
  }
}

function getUnitLoadout(unitId) {
  return loadoutState[unitId] ?? null;
}

function saveUnitLoadout(unitId, loadout) {
  if (!unitId) return;
  loadoutState[unitId] = {
    equipment: { ...(loadout.equipment ?? {}) },
    abilityId: loadout.abilityId ?? null,
    crystalShardId: loadout.crystalShardId ?? null,
  };
  persist();
}

// ---- src/core/SuspendSave.js ----
const SUSPEND_STORAGE_KEY = 'ff-crystal-rush-suspend-v1';

const SUSPEND_SAVE_VERSION = 1;

function storageOrNull(storage) {
  try {
    return storage ?? globalThis.localStorage ?? null;
  } catch {
    return null;
  }
}
function readSuspendSave(storage) {
  try {
    const target = storageOrNull(storage);
    if (!target) return null;
    const parsed = JSON.parse(target.getItem(SUSPEND_STORAGE_KEY) || 'null');
    if (!parsed || parsed.version !== SUSPEND_SAVE_VERSION) return null;
    if (!['battle', 'intermission'].includes(parsed.screen)) return null;
    if (!Number.isInteger(parsed.bossIndex) || !Array.isArray(parsed.livingParty)) return null;
    return parsed;
  } catch {
    return null;
  }
}

function writeSuspendSave(snapshot, storage) {
  try {
    const target = storageOrNull(storage);
    if (!target || !snapshot) return false;
    target.setItem(SUSPEND_STORAGE_KEY, JSON.stringify({
      ...snapshot,
      version: SUSPEND_SAVE_VERSION,
      savedAt: Date.now(),
    }));
    return true;
  } catch {
    return false;
  }
}

function clearSuspendSave(storage) {
  try {
    const target = storageOrNull(storage);
    if (!target) return false;
    target.removeItem(SUSPEND_STORAGE_KEY);
    return true;
  } catch {
    return false;
  }
}

// ---- src/core/AbilityPosition.js ----
const POSITION_STORAGE_KEY = 'ff-crystal-rush-ability-positions-v1';

function loadPositions() {
  try {
    const parsed = JSON.parse(localStorage.getItem(POSITION_STORAGE_KEY) || 'null');
    return parsed && typeof parsed === 'object' ? parsed : {};
  } catch {
    return {};
  }
}
const positions = loadPositions();

function keyFor(unitId, surface, abilityId = '') {
  return `${surface}:${unitId || 'unknown'}:${abilityId || 'default'}`;
}

function getAbilityListPosition(unitId, surface = 'battle', abilityId = '') {
  const value = Number(positions[keyFor(unitId, surface, abilityId)] ?? 0);
  return Number.isFinite(value) ? Math.max(0, value) : 0;
}

function saveAbilityListPosition(unitId, surface, scrollTop, abilityId = '') {
  if (!unitId) return;
  positions[keyFor(unitId, surface, abilityId)] = Math.max(0, Math.round(Number(scrollTop) || 0));
  try {
    localStorage.setItem(POSITION_STORAGE_KEY, JSON.stringify(positions));
  } catch {
    // The UI remains usable when persistent storage is unavailable.
  }
}

// ---- src/battle/StatusEngine.js ----
/**
 * Lightweight status rules shared by CTB and the action resolver.
 * Statuses remain a Set on Unit for UI compatibility; durations live beside it.
 */
const POSITIVE_STATUSES = Object.freeze([
  'protect', 'shell', 'haste', 'regen', 'reflect', 'float', 'image', 'barrier',
]);

const INCAPACITATING_STATUSES = Object.freeze([
  'ko', 'petrify', 'stop', 'sleep', 'paralyze',
]);

const CURABLE_STATUSES = Object.freeze([
  'poison', 'blind', 'silence', 'toad', 'mini', 'petrify', 'confuse',
  'paralyze', 'sleep', 'old', 'berserk', 'zombie', 'stop', 'slow', 'doom', 'sap',
]);

/**
 * Canonical Japanese display names for every status id used in battle.
 * Used anywhere a status id would otherwise leak into a message as its raw
 * (English) internal identifier, e.g. "タバサに paralyze！" instead of
 * "タバサに 麻痺！".
 */
const STATUS_LABELS_JA = Object.freeze({
  ko: '戦闘不能', poison: '毒', blind: '暗闇', silence: '沈黙', toad: 'カエル', mini: '小人',
  petrify: '石化', confuse: '混乱', paralyze: '麻痺', sleep: '睡眠', old: '老化', berserk: '狂戦士',
  zombie: 'ゾンビ', stop: '停止', slow: 'スロウ', haste: 'ヘイスト', regen: 'リジェネ', protect: 'プロテス',
  shell: 'シェル', reflect: 'リフレク', float: 'レビテト', image: 'ブリンク', barrier: '物理障壁',
  doom: '死の宣告', sap: 'スリップ', time_focus: 'とき集中',
});

/** Translates a status id (or list of ids) to its Japanese display name. */
function statusLabel(status) {
  return STATUS_LABELS_JA[status] ?? status;
}

function statusLabels(statuses) {
  return (statuses ?? []).map(statusLabel).join('・');
}

const DEFAULT_STATUS_DURATIONS = Object.freeze({
  sleep: 3,
  paralyze: 2,
  stop: 2,
  confuse: 3,
  berserk: 4,
  protect: 6,
  shell: 6,
  haste: 6,
  slow: 6,
  reflect: 5,
  regen: 6,
  sap: 5,
  doom: 5,
  time_focus: 4,
});

function normalizeElement(element) {
  return element === 'lightning' ? 'thunder' : element;
}

function effectiveAgility(unit) {
  let value = Math.max(1, unit.agility ?? 1);
  if (unit.statuses?.has('haste')) value *= 1.5;
  if (unit.statuses?.has('slow')) value *= 0.65;
  if (unit.statuses?.has('old')) value *= 0.8;
  if (unit.statuses?.has('time_focus')) value *= 1.2;
  if (unit.statuses?.has('stop')) value = 0;
  return Math.max(0, Math.round(value));
}

function isIncapacitated(unit) {
  if (!unit?.isAlive?.()) return true;
  return INCAPACITATING_STATUSES.some((status) => unit.statuses?.has(status));
}

function canIssueCommand(unit) {
  return !isIncapacitated(unit) && !unit.statuses?.has('berserk') && !unit.statuses?.has('confuse');
}

function canUseMagic(unit) {
  return unit?.isAlive?.() && !unit.statuses?.has('silence') && !unit.statuses?.has('toad');
}

function statusTick(unit) {
  const results = [];
  if (!unit.isAlive()) return results;

  if (unit.statuses.has('poison')) {
    const amount = unit.applyDamage(Math.max(1, Math.floor(unit.maxHp / 16)));
    results.push({ type: 'status-damage', status: 'poison', targetUid: unit.uid, amount });
  }
  if (unit.statuses.has('sap') && unit.isAlive()) {
    const amount = unit.applyDamage(Math.max(1, Math.floor(unit.maxHp / 24)));
    results.push({ type: 'status-damage', status: 'sap', targetUid: unit.uid, amount });
  }
  if (unit.statuses.has('regen') && unit.isAlive()) {
    const amount = unit.applyHeal(Math.max(1, Math.floor(unit.maxHp / 12)));
    results.push({ type: 'status-heal', status: 'regen', targetUid: unit.uid, amount });
  }

  const expired = [];
  unit.statusDurations?.forEach((remaining, status) => {
    if (unit.permanentStatuses?.has(status)) {
      unit.statusDurations.delete(status);
      return;
    }
    const next = remaining - 1;
    if (next <= 0) expired.push(status);
    else unit.statusDurations.set(status, next);
  });
  expired.forEach((status) => {
    if (status === 'doom' && unit.isAlive()) {
      unit.applyDamage(unit.hp);
      results.push({ type: 'doom', status, targetUid: unit.uid, amount: 0 });
    }
    unit.removeStatus(status);
    results.push({ type: 'status-expired', status, targetUid: unit.uid, amount: 0 });
  });

  return results;
}

// ---- src/battle/Unit.js ----
let uidCounter = 0;

class Unit {
  constructor(config) {
    this.uid = `u${uidCounter++}`;
    this.id = config.id;
    this.name = config.name;
    this.isEnemy = !!config.isEnemy;
    this.role = config.role || null;
    this.spriteUrl = config.spriteUrl ?? null;
    this.effectAnchor = config.effectAnchor ?? null;

    this.maxHp = config.maxHp;
    this.hp = config.hp ?? config.maxHp;
    this.maxMp = config.maxMp ?? 0;
    this.mp = config.mp ?? this.maxMp;

    this.atk = config.atk ?? 10;
    this.monsterM = config.monsterM ?? (this.isEnemy ? Math.max(1, Math.round(this.atk / 10)) : null);
    this.strength = config.strength ?? config.baseAtk ?? this.atk;
    this.vitality = config.vitality ?? config.baseDef ?? config.def ?? 10;
    this.def = config.def ?? 10;
    this.magicDef = config.magicDef ?? Math.round(this.def * 0.5);
    this.magic = config.magic ?? 10;
    this.agility = config.agility ?? 20;
    this.evasion = config.evasion ?? 0;

    this.weakness = config.weakness ?? null; // element string
    this.resist = config.resist ?? null;
    this.weaponElement = config.weaponElement ?? null;
    this.weaponAccuracy = config.weaponAccuracy ?? 100;
    this.weaponSpecial = config.weaponSpecial ?? null;
    this.weaponId = config.weaponId ?? 'w_neutral';
    this.equipmentEffects = config.equipmentEffects ?? {};
    this.weaponAttack = config.weaponAttack ?? this.equipmentEffects?.weaponAttack ?? 0;
    this.weaponType = config.weaponType ?? this.equipmentEffects?.weaponType ?? 'sword';
    this.hasBrawl = Boolean(config.hasBrawl);
    this.baseAtk = config.baseAtk ?? this.atk;
    this.baseDef = config.baseDef ?? this.def;
    this.baseMagicDef = config.baseMagicDef ?? this.magicDef;
    this.baseMagic = config.baseMagic ?? this.magic;
    this.baseAgility = config.baseAgility ?? this.agility;
    this.mpCostMultiplier = this.equipmentEffects.mpCostMultiplier ?? 1;
    this.physicalDamageMultiplier = this.equipmentEffects.physicalDamageMultiplier ?? 1;
    this.imageHits = this.equipmentEffects.initialImageHits ?? 0;
    this.nextAttackMultiplier = 1;
    this.magicDamageMultiplier = 1;
    this.physicalBarrier = Math.max(0, config.physicalBarrier ?? 0);
    this.statuses = new Set(config.statuses ?? []);
    this.statusDurations = new Map(config.statusDurations ?? []);
    this.permanentStatuses = new Set(config.permanentStatuses ?? []);
    this.statusImmunities = new Set([
      ...(config.statusImmunities ?? []),
      ...(this.equipmentEffects.statusImmunities ?? []),
    ]);
    this.statusResistance = Math.min(0.9, Math.max(0, config.statusResistance ?? this.equipmentEffects.statusResistance ?? 0));
    this.temporaryNullElements = new Set(config.temporaryNullElements ?? []);
    this.elementalPower = Boolean(config.elementalPower);
    this.level = config.level ?? 1;
    this.equippedAbilitySet = config.equippedAbilitySet ?? 'たたかう型';
    this.equipment = config.equipment ?? {
      weapon: null,
      shield: null,
      head: null,
      body: null,
      accessory: null,
    };
    this.abilityId = config.abilityId ?? 'ability_guard';
    this.crystalShardId = config.crystalShardId ?? 'shard_azure';
    // A disc can carry 1-4 techniques once fused; this is the resolved list
    // of technique ids the equipped えんばんせき currently grants in battle.
    // Callers that know the real owned-disc composition (main.js, battle
    // snapshot restore) pass this explicitly. Anything else falls back to
    // treating crystalShardId as a single base technique id.
    this.crystalShardTechniqueIds = Array.isArray(config.crystalShardTechniqueIds)
      ? config.crystalShardTechniqueIds
      : (this.crystalShardId ? [this.crystalShardId] : []);

    this.size = config.size ?? 1.0;
    this.ai = config.ai ?? null;
    this.aiActions = config.aiActions ?? [];
    this.counterOnHit = config.counterOnHit ?? null; // { chance, times } -- see BattleManager.resolveCounterAttacks
    this.creatureTypes = new Set(config.creatureTypes ?? (config.isEnemy ? ['boss'] : ['human']));
    this.row = config.row ?? 'front';
    this.heavy = config.heavy ?? this.creatureTypes.has('boss');
    this.isUndead = config.isUndead ?? this.equipmentEffects.undeadProperties ?? this.creatureTypes.has('undead');
    this.removedFromBattle = false;
    this.hidden = Boolean(config.hidden);
    this.pendingJump = config.pendingJump ?? null;
    this.capturedMonster = config.capturedMonster ?? null;
    this.singing = config.singing ?? null;
    this.weaponSpellblade = config.weaponSpellblade ?? null;
    this.stolen = Boolean(config.stolen);

    // CTB state
    this.ctValue = config.ctValue ?? Math.random() * 200 + (this.equipmentEffects.initialCtBonus ?? 0); // slight stagger at battle start
    this.defending = false;

    this.magicList = config.magicList ?? [];

    // Equipment auto-buffs are battle-long traits, not ordinary timed spells.
    // Auto Doom is the deliberate exception: the Cursed Ring starts a real
    // countdown. Mirage Vest is represented separately by imageHits, so its
    // charges can be consumed and restored exactly by suspend saves.
    (this.equipmentEffects.autoStatuses ?? []).forEach((status) => this.addStatus(status, {
      force: true,
      permanent: status !== 'doom',
    }));
    this.permanentStatuses.forEach((status) => {
      this.statuses.add(status);
      this.statusDurations.delete(status);
    });
  }

  isAlive() {
    return this.hp > 0;
  }

  applyDamage(amount) {
    const dmg = Math.max(0, Math.round(amount));
    const before = this.hp;
    this.hp = Math.max(0, this.hp - dmg);
    if (this.hp === 0) this.statuses.add('ko');
    return before - this.hp;
  }

  applyHeal(amount) {
    if (!this.isAlive() || this.statuses.has('zombie')) return 0;
    const before = this.hp;
    this.hp = Math.min(this.maxHp, this.hp + Math.round(amount));
    return this.hp - before;
  }

  spendMp(amount) {
    this.mp = Math.max(0, this.mp - amount);
  }

  hpRatio() {
    return this.hp / this.maxHp;
  }

  canAffordMp(amount) {
    return this.mp >= Math.ceil(Math.max(0, amount) * (this.mpCostMultiplier ?? 1));
  }

  canIssueCommand() {
    return canIssueCommand(this);
  }

  canUseMagic() {
    return canUseMagic(this);
  }

  addStatus(status, {
    duration,
    chance = 1,
    force = false,
    guaranteed = false,
    permanent = false,
    random = Math.random,
  } = {}) {
    if (!status || (!force && this.statusImmunities.has(status))) return false;
    if (!force && !guaranteed && random() > Math.max(0.05, chance * (1 - this.statusResistance))) return false;
    if (status === 'ko') {
      this.hp = 0;
      this.statuses.add('ko');
      return true;
    }
    if (!this.isAlive()) return false;
    this.statuses.add(status);
    if (permanent) this.permanentStatuses.add(status);
    if (this.permanentStatuses.has(status)) {
      this.statusDurations.delete(status);
      return true;
    }
    const turns = duration ?? DEFAULT_STATUS_DURATIONS[status];
    if (turns) this.statusDurations.set(status, turns);
    return true;
  }

  removeStatus(status, { force = false } = {}) {
    if (this.permanentStatuses.has(status) && !force) return false;
    const removed = this.statuses.delete(status);
    this.statusDurations.delete(status);
    if (force) this.permanentStatuses.delete(status);
    return removed;
  }

  revive(hpRatio = 0.25) {
    if (this.isAlive() && !this.statuses.has('ko')) return 0;
    this.removeStatus('ko');
    this.hp = Math.max(1, Math.round(this.maxHp * hpRatio));
    return this.hp;
  }

  processTurnStatuses() {
    return statusTick(this);
  }
}

// ---- src/battle/FF5FormulaEngine.js ----
/**
 * Integer battle formulas modelled after the SFC Final Fantasy V battle code.
 *
 * The original engine first derives attack (A), defense (D), and a stat/level
 * multiplier (M), then applies: max(0, A - D) * M.  Weapon families are not
 * interchangeable: axes roll a wide attack range, knives split Strength and
 * Agility, and spears only double M while landing from Jump.
 *
 * Reference implementation used while deriving these rules:
 * https://github.com/everything8215/ff5/blob/main/src/battle/battle-main.asm
 */

const DAMAGE_CAP = 9999;

const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const stat = (value) => clamp(Math.floor(Number(value) || 0), 0, 99);
const level = (unit) => clamp(Math.floor(Number(unit.level) || 1), 1, 99);

function randomInt(maxInclusive, random = Math.random) {
  const max = Math.max(0, Math.floor(maxInclusive));
  return Math.floor(clamp(random(), 0, 0.999999999) * (max + 1));
}

function ff5FinalDamage(attack, defense, multiplier) {
  return clamp(Math.max(0, Math.floor(attack) - Math.floor(defense)) * Math.max(0, Math.floor(multiplier)), 0, DAMAGE_CAP);
}

function ff5PhysicalHit({ attacker, defender, action = {}, random = Math.random }) {
  if (action.ignoreEvasion || action.commandFormula === 'aim' || action.commandFormula === 'rapid-fire' || action.commandFormula === 'jump') return true;
  if ((defender.imageHits ?? 0) > 0) return false;
  let accuracy = Math.floor(action.accuracy ?? attacker.weaponAccuracy ?? 100);
  if (attacker.statuses?.has('blind')) accuracy = Math.max(1, Math.floor(accuracy / 4));
  let evasion = Math.floor(defender.evasion ?? 0);
  if (defender.statuses?.has('toad')) evasion = 0;
  if (defender.statuses?.has('mini')) evasion = Math.min(99, evasion * 2);
  if (randomInt(99, random) >= accuracy) return false;
  if (['sleep', 'confuse', 'paralyze', 'stop'].some((status) => defender.statuses?.has(status))) return true;
  return randomInt(99, random) >= evasion;
}

function basePhysicalParameters(attacker, defender, action, random) {
  const configuredWeaponPower = Number(attacker.equipmentEffects?.weaponAttack ?? attacker.weaponAttack ?? 0);
  const weaponPower = Math.max(0, Math.floor(configuredWeaponPower > 0 ? configuredWeaponPower : attacker.atk));
  const strength = stat(attacker.strength ?? attacker.baseAtk ?? attacker.atk);
  const agility = stat(attacker.agility);
  const attackerLevel = level(attacker);
  const weaponType = action.weaponType ?? attacker.equipmentEffects?.weaponType ?? attacker.weaponType ?? (weaponPower > 0 ? 'sword' : 'fist');
  let attack;
  let multiplier;

  switch (weaponType) {
    case 'axe':
    case 'hammer':
    case 'flail':
      attack = Math.floor(weaponPower / 2) + randomInt(weaponPower, random);
      multiplier = Math.floor(attackerLevel * strength / 128) + 2;
      break;
    case 'knife':
    case 'ninja_blade':
    case 'whip':
    case 'bow':
    case 'throwing':
      attack = weaponPower + randomInt(3, random);
      multiplier = Math.floor(attackerLevel * strength / 128) + Math.floor(attackerLevel * agility / 128) + 2;
      break;
    case 'bell':
      attack = Math.floor(weaponPower / 2) + randomInt(Math.floor(weaponPower / 2), random);
      multiplier = Math.floor(attackerLevel * stat(attacker.magic) / 128) + Math.floor(attackerLevel * agility / 128) + 2;
      break;
    case 'rod':
      attack = randomInt(weaponPower, random) * 2;
      multiplier = Math.floor(attackerLevel * stat(attacker.magic) / 256) + 2;
      break;
    case 'fist':
      if (attacker.hasBrawl || attacker.abilityId === 'ability_barehanded') {
        attack = weaponPower + attackerLevel * 2 + randomInt(Math.floor(attackerLevel / 4), random)
          + (attacker.equipmentEffects?.improvedBrawl ? 50 : 0);
        multiplier = Math.floor(attackerLevel * strength / 256) + 2;
      } else {
        attack = weaponPower + randomInt(Math.floor(attackerLevel / 4), random);
        multiplier = 2;
      }
      break;
    default:
      attack = weaponPower + randomInt(Math.floor(weaponPower / 8), random);
      multiplier = Math.floor(attackerLevel * strength / 128) + 2;
      break;
  }

  let defense = Math.max(0, Math.floor(defender.def ?? 0));
  if (['axe', 'hammer', 'flail'].includes(weaponType)) defense = Math.floor(defense / 4);
  if (['bell', 'rod'].includes(weaponType)) defense = Math.max(0, Math.floor(defender.magicDef ?? 0));
  let postMultiplier = Number(action.power ?? 1) * Number(action.attackMultiplier ?? 1);

  if (action.commandFormula === 'rapid-fire') {
    defense = 0;
    postMultiplier *= 0.5;
  }
  if (action.commandFormula === 'focus') postMultiplier *= 2;
  if (action.commandFormula === 'sword-dance') postMultiplier *= 4;
  if (action.commandFormula === 'jump' && ['spear', 'lance'].includes(weaponType)) multiplier *= 2;
  if (action.ignoreDefense) defense = 0;

  const isRanged = action.ranged || ['bow', 'whip'].includes(weaponType) || action.commandFormula === 'jump' || action.commandFormula === 'throw';
  if (!isRanged && attacker.row === 'back' && !attacker.equipmentEffects?.backRowFullDamage) multiplier = Math.floor(multiplier / 2);
  if (!isRanged && defender.row === 'back') multiplier = Math.floor(multiplier / 2);
  if (defender.statuses?.has('protect')) multiplier = Math.floor(multiplier / 2);
  if (defender.defending) multiplier = Math.floor(multiplier / 2);
  if (attacker.statuses?.has('berserk')) attack = Math.floor(attack * 1.5);
  if (attacker.statuses?.has('toad') || attacker.statuses?.has('mini')) attack = 3;
  if (defender.statuses?.has('toad') || defender.statuses?.has('mini')) defense = 0;

  const critical = Boolean(action.forceCritical)
    || (['katana'].includes(weaponType) && random() < (attacker.weaponSpecial === 'high_critical' ? 0.25 : 0.125));
  if (critical) {
    defense = 0;
    multiplier *= 2;
  }

  return { attack, defense, multiplier, postMultiplier, weaponType, critical };
}

function ff5PhysicalDamage(attacker, defender, action = {}, random = Math.random) {
  if (attacker.weaponSpecial === 'always_1_damage' && action.commandFormula !== 'throw') return { damage: 1, critical: false };
  const params = basePhysicalParameters(attacker, defender, action, random);
  let damage = Math.floor(ff5FinalDamage(params.attack, params.defense, params.multiplier) * params.postMultiplier);
  damage = clamp(Math.floor(damage * (defender.physicalDamageMultiplier ?? 1)), 0, DAMAGE_CAP);
  return { damage, critical: params.critical, formula: params };
}

/**
 * SFC monster attacks do not reuse a character's sword formula.
 * A = MonsterAttack + 0..MonsterAttack/8, M = MonsterM, D = Defense.
 */
function ff5MonsterDamage(attacker, defender, action = {}, random = Math.random) {
  let attack = Math.max(0, Math.floor(attacker.atk ?? 0));
  attack += randomInt(Math.floor(attack / 8), random);
  let defense = Math.max(0, Math.floor(defender.def ?? 0));
  let multiplier = Math.max(1, Math.floor(attacker.monsterM ?? 1));
  if (action.commandFormula === 'rapid-fire') defense = 0;
  if (action.ignoreDefense) defense = 0;
  if (defender.statuses?.has('protect')) multiplier = Math.floor(multiplier / 2);
  if (defender.defending) multiplier = Math.floor(multiplier / 2);
  let damage = ff5FinalDamage(attack, defense, multiplier);
  damage = Math.floor(damage * Number(action.power ?? 1) * Number(action.attackMultiplier ?? 1));
  damage = Math.floor(damage * (defender.physicalDamageMultiplier ?? 1));
  return { damage: clamp(damage, 0, DAMAGE_CAP), formula: { attack, defense, multiplier, weaponType: 'monster' } };
}

function ff5MagicDamage(caster, defender, spell = {}, random = Math.random) {
  const power = Math.max(0, Math.floor(spell.ff5Power ?? spell.magicPower ?? Math.max(1, Number(spell.power ?? 1) * 40)));
  const casterLevel = level(caster);
  const magic = stat(caster.magic);
  const flareFormula = spell.formula === 'ff5_flare' || spell.sourceId === 'magic_flare' || spell.id === 'magic_flare';
  let attack = power + randomInt(Math.floor(power / (flareFormula ? 32 : 8)), random);
  let defense = Math.max(0, Math.floor(defender.magicDef ?? 0));
  let multiplier = Math.floor(casterLevel * magic / 256) + 4;

  if (spell.multiTarget) attack = Math.floor(attack / 2);
  if (flareFormula) defense = Math.floor(defense / 32);
  if (defender.statuses?.has('shell')) multiplier = Math.floor(multiplier / 2);
  if (defender.defending) multiplier = Math.floor(multiplier / 2);
  const boosted = caster.equipmentEffects?.magicBoostElements?.includes(spell.element);
  if (boosted || caster.elementalPower) attack = Math.floor(attack * 1.5);

  return { damage: ff5FinalDamage(attack, defense, multiplier), formula: { attack, defense, multiplier, power } };
}

function ff5MagicHeal(caster, spell = {}, random = Math.random) {
  const power = Math.max(1, Math.floor(spell.ff5Power ?? spell.magicPower ?? 10));
  const attack = power + randomInt(Math.floor(power / 8), random);
  let multiplier = Math.floor(level(caster) * stat(caster.magic) / 256) + 4;
  if (spell.multiTarget) multiplier = Math.max(1, Math.floor(multiplier / 2));
  return clamp(attack * multiplier, 1, DAMAGE_CAP);
}

function ff5ThrowDamage(attacker, defender, throwPower, random = Math.random) {
  const attack = Math.max(0, Math.floor(throwPower)) + randomInt(Math.floor(throwPower / 8), random);
  const multiplier = (Math.floor(level(attacker) * stat(attacker.strength ?? attacker.baseAtk) / 128)
    + Math.floor(level(attacker) * stat(attacker.agility) / 128) + 2) * 2;
  return ff5FinalDamage(attack, defender.def ?? 0, multiplier);
}

function ff5Zeninage(actor, targetCount = 1) {
  const attack = level(actor) + 10;
  const multiplier = 50;
  // Gil is paid once per command; hitting several enemies does not multiply
  // the price. Param1 and Param2 are both 50 in FFV's command data.
  const cost = level(actor) * 50;
  return { cost, attack, multiplier, targetCount: Math.max(1, targetCount) };
}

// ---- src/battle/ActionResolver.js ----
/**
 * ActionResolver
 * Pure(ish) functions that turn an "action" declaration into concrete
 * HP/MP changes on the involved units. Kept separate from BattleManager so
 * the math can be unit-tested / tweaked independently of turn flow.
 */


function equipmentElementState(defender, element) {
  const effects = defender.equipmentEffects ?? {};
  if (!element) return 'normal';
  element = normalizeElement(element);
  if (effects.absorbs?.includes(element)) return 'absorb';
  if (defender.temporaryNullElements?.has(element)) return 'null';
  if (effects.nullElements?.includes(element)) return 'null';
  if (effects.weaknesses?.includes(element) || defender.weakness === element) return 'weak';
  if (effects.resistances?.includes(element) || defender.resist === element) return 'resist';
  return 'normal';
}

/** Physical attack damage: ATK vs DEF, with weapon and armor effects. */
function resolvePhysicalDamage(attacker, defender, action = {}) {
  const spellblade = attacker.weaponSpellblade;
  const formulaAction = spellblade?.effect === 'flare' ? { ...action, ignoreDefense: true } : action;
  let dmg = (attacker.isEnemy
    ? ff5MonsterDamage(attacker, defender, action)
    : ff5PhysicalDamage(attacker, defender, formulaAction)).damage;
  if ((attacker.equipmentEffects?.killers ?? []).some((type) => defender.creatureTypes?.has(type))) dmg *= 2;
  const attackElement = spellblade?.element ?? attacker.weaponElement;
  const elementState = equipmentElementState(defender, attackElement);
  if (elementState === 'weak') dmg *= Math.max(2, spellblade?.tier ?? 2);
  if (elementState === 'resist') dmg *= 0.5;
  if (elementState === 'null' || elementState === 'absorb') dmg = 0;
  return Math.max(0, Math.round(dmg));
}

/** Magic/elemental damage: MAGIC stat * spell power, weakness/resist modifiers. */
function resolveMagicDamage(caster, defender, spell) {
  let dmg = ff5MagicDamage(caster, defender, spell).damage;

  if (spell.element) {
    const elementState = equipmentElementState(defender, spell.element);
    if (elementState === 'weak') dmg *= 2;
    if (elementState === 'resist') dmg *= 0.5;
    if (elementState === 'null') dmg = 0;
  }
  if (equipmentElementState(defender, spell.element) === 'null') return 0;
  return Math.max(0, Math.round(dmg));
}

/** Items are fixed; magic healing uses the same integer A×M structure as FFV. */
function resolveHeal(amount, caster = null, action = {}) {
  if (action.formula === 'ff5_magic' || action.ff5Power) return ff5MagicHeal(caster, action);
  return Math.max(1, Math.round(amount));
}

function operationToAction(operation, actor) {
  const common = { _compiledOperation: true, mpCost: 0 };
  switch (operation.op) {
    case 'damage.magic': return { ...common, kind: 'magic-attack', power: operation.power, ff5Power: operation.ff5Power, formula: operation.formula, hits: operation.hits, element: operation.element };
    case 'damage.physical': return { ...common, kind: 'physical-attack', power: operation.power, sameLevelMultiplier: operation.sameLevelMultiplier, commandFormula: operation.commandFormula };
    case 'damage.fixed': return { ...common, kind: 'fixed-damage', fixedDamage: operation.amount };
    case 'damage.caster_hp': return { ...common, kind: 'fixed-damage', fixedDamage: actor.hp, sacrificeCaster: operation.sacrificeCaster };
    case 'damage.missing_hp': return { ...common, kind: 'fixed-damage', fixedDamage: actor.maxHp - actor.hp };
    case 'damage.hp_ratio': return { ...common, kind: 'ratio-damage', ratio: operation.ratio, heavyImmune: operation.heavyImmune };
    case 'damage.max_hp_ratio': return { ...common, kind: 'max-hp-ratio-damage', ratio: operation.ratio, heavyImmune: operation.heavyImmune };
    case 'damage.to_critical': return { ...common, kind: 'critical-damage', heavyImmune: operation.heavyImmune };
    case 'damage.mp_ratio': return { ...common, kind: 'mp-ratio-damage', ratio: operation.ratio };
    case 'drain.hp': return { ...common, kind: 'magic-attack', power: operation.power, drain: true };
    case 'drain.mp': return { ...common, kind: 'mp-drain', power: operation.power };
    case 'heal.hp': return { ...common, kind: 'heal', healAmount: operation.amount, ff5Power: operation.ff5Power, formula: operation.formula };
    case 'heal.caster_hp': return { ...common, kind: 'heal', healAmount: actor.hp };
    case 'heal.mp': return { ...common, kind: 'mp-heal-target', mpAmount: operation.amount };
    case 'restore.full': return { ...common, kind: 'full-restore' };
    case 'revive': return { ...common, kind: 'revive', hpRatio: operation.hpRatio };
    case 'inspect': return { ...common, kind: 'scan', fields: operation.fields };
    case 'status.apply': return { ...common, kind: 'status', statuses: operation.statuses, toggle: operation.toggle, imageHits: operation.imageHits, duration: operation.duration, statusChance: operation.statusChance };
    case 'status.remove': return { ...common, kind: 'cleanse', statuses: operation.statuses, mode: operation.mode };
    case 'status.dispel': return { ...common, kind: 'dispel' };
    case 'stat.modify': return { ...common, kind: 'stat-modify', stat: operation.stat, multiplier: operation.multiplier };
    case 'battle.speed': return { ...common, kind: 'field-speed', multiplier: operation.multiplier, duration: operation.duration };
    case 'battle.field_status': return { ...common, kind: 'field-status', status: operation.status, duration: operation.duration };
    case 'barrier.physical': return { ...common, kind: 'barrier-physical', amountFormula: operation.amountFormula, amount: operation.amount };
    case 'summon.odin': return { ...common, kind: 'summon-odin', ff5Power: operation.ff5Power ?? 180, formula: 'ff5_magic' };
    case 'caster.sacrifice': return { ...common, kind: 'sacrifice' };
    case 'remove.from_battle': return { ...common, kind: 'remove-from-battle' };
    case 'turn.extra': return { ...common, kind: 'extra-turn', count: operation.count };
    default: return { ...common, kind: 'scripted', label: operation.handlerKey ?? operation.op };
  }
}

/**
 * Resolve a full action given the actor, the chosen action definition,
 * and the target(s). Returns a log-friendly result object.
 */
function resolveAction({ actor, action, targets, battleUnits = targets }) {
  targets = (targets ?? []).filter(Boolean);
  if (action.disabledReason) return [{ type: 'unavailable', targetUid: actor.uid, reason: action.disabledReason }];
  if (targets.length === 0) return [{ type: 'invalid-target', targetUid: actor.uid }];
  const actionMpCost = Math.ceil((action.mpCost ?? 0) * (actor.mpCostMultiplier ?? 1));
  if (!action._compiledOperation && actionMpCost > actor.mp) {
    return [{ type: 'insufficient-mp', targetUid: actor.uid, required: actionMpCost }];
  }
  const sealedMagicAction = action.usesMagic !== false
    && !['ability', 'song'].includes(action.sourceType)
    && ['magic-attack', 'heal', 'status', 'cleanse', 'dispel', 'revive'].includes(action.kind);
  if (!action._compiledOperation && sealedMagicAction && !actor.canUseMagic?.()) {
    return [{ type: 'sealed', targetUid: actor.uid }];
  }
  if (action.operations?.length && !action._compiledOperation) {
    if (action.mpCost) actor.spendMp(Math.ceil(action.mpCost * (actor.mpCostMultiplier ?? 1)));
    return action.operations.flatMap((operation) => {
      const operationTargets = operation.targetSide
        ? (battleUnits ?? targets).filter((target) => operation.targetSide === 'enemy' ? target.isEnemy !== actor.isEnemy : target.isEnemy === actor.isEnemy)
        : targets;
      const livingTargets = operation.op === 'revive' ? operationTargets : operationTargets.filter((target) => target.isAlive());
      const eligibleTargets = operation.conditionalLevel
        ? livingTargets.filter((target) => target.level % operation.conditionalLevel === 0)
        : livingTargets;
      if (operation.conditionalLevel && eligibleTargets.length === 0) {
        return [{ type: 'miss', targetUid: operationTargets[0]?.uid ?? actor.uid, hits: 1 }];
      }
      return resolveAction({
        actor,
        action: { ...operationToAction(operation, actor), element: operation.element ?? action.element },
        targets: eligibleTargets.length ? eligibleTargets : [actor],
        battleUnits,
      });
    });
  }

  const results = [];

  switch (action.kind) {
    case 'physical-attack': {
      const target = targets[0];
      if (!target?.isAlive()) return [{ type: 'invalid-target', targetUid: target?.uid ?? actor.uid }];
      const hits = Math.max(1, action.hits ?? (actor.weaponSpecial === 'double_hit' ? 2 : 1));
      const attackMultiplier = actor.nextAttackMultiplier ?? 1;
      actor.nextAttackMultiplier = 1;
      let dealtTotal = 0;
      let missedHits = 0;
      let blockedHits = 0;
      for (let hit = 0; hit < hits; hit += 1) {
        const blockedByImage = !action.ignoreEvasion && target.imageHits > 0;
        if (blockedByImage) target.imageHits -= 1;
        if (blockedByImage || !ff5PhysicalHit({ attacker: actor, defender: target, action })) {
          missedHits += 1;
          continue;
        }
        const sameLevelPower = action.sameLevelMultiplier && actor.level === target.level
          ? (action.power ?? 1) * action.sameLevelMultiplier
          : action.power;
        let damage = resolvePhysicalDamage(actor, target, { ...action, power: sameLevelPower, attackMultiplier });
        if (damage > 0 && target.physicalBarrier > 0) {
          const absorbed = Math.min(target.physicalBarrier, damage);
          target.physicalBarrier -= absorbed;
          damage -= absorbed;
          results.push({ type: 'barrier-absorb', targetUid: target.uid, amount: absorbed, remaining: target.physicalBarrier });
        }
        if (damage <= 0) blockedHits += 1;
        else dealtTotal += target.applyDamage(damage);
      }
      if (dealtTotal > 0) results.push({ type: 'damage', targetUid: target.uid, amount: dealtTotal, hits });
      if (missedHits > 0) results.push({ type: 'miss', targetUid: target.uid, hits: missedHits });
      if (blockedHits > 0) results.push({ type: 'blocked', targetUid: target.uid, hits: blockedHits });
      if (action.drain || actor.weaponSpecial === 'hp_drain') {
        const healed = actor.applyHeal(Math.round(dealtTotal * 0.5));
        if (healed > 0) results.push({ type: 'heal', targetUid: actor.uid, amount: healed });
      }
      if (action.mpDrain || actor.weaponSpecial === 'mp_drain') {
        const restored = Math.min(actor.maxMp - actor.mp, action.mpDrain ?? 8);
        actor.mp += restored;
        if (restored > 0) results.push({ type: 'mp-heal', targetUid: actor.uid, amount: restored });
      }
      const spellbladeEffect = actor.weaponSpellblade?.effect;
      if (dealtTotal > 0 && ['poison', 'silence', 'sleep', 'petrify'].includes(spellbladeEffect)) {
        const blocked = target.heavy && spellbladeEffect === 'petrify';
        const applied = !blocked && target.addStatus?.(spellbladeEffect, { chance: 1 });
        results.push({ type: applied ? 'status' : 'status-resist', targetUid: target.uid, statuses: [spellbladeEffect] });
      }
      if (dealtTotal > 0 && spellbladeEffect === 'drain') {
        const amount = actor.applyHeal(dealtTotal);
        if (amount) results.push({ type: 'heal', targetUid: actor.uid, amount });
      }
      if (dealtTotal > 0 && spellbladeEffect === 'osmose') {
        const amount = Math.min(target.mp, Math.max(1, Math.floor(dealtTotal / 8)));
        target.spendMp(amount);
        actor.mp = Math.min(actor.maxMp, actor.mp + amount);
        results.push({ type: 'mp-damage', targetUid: target.uid, amount }, { type: 'mp-heal', targetUid: actor.uid, amount });
      }
      if (dealtTotal > 0 && target.singing) {
        target.singing = null;
        results.push({ type: 'song-stopped', targetUid: target.uid });
      }
      if (dealtTotal > 0) {
        (actor.equipmentEffects?.onHitStatuses ?? []).forEach(({ status, chance }) => {
          if (status === 'ko' && target.heavy) return;
          const applied = target.addStatus?.(status, { chance });
          results.push({ type: applied ? 'status' : 'status-resist', targetUid: target.uid, statuses: [status] });
        });
        const proc = actor.equipmentEffects?.onHitProc;
        if (proc && Math.random() < proc.chance) {
          const procDamage = target.applyDamage(resolveMagicDamage(actor, target, proc));
          results.push({ type: 'damage', targetUid: target.uid, amount: procDamage, element: proc.element, proc: true });
        }
      }
      break;
    }
    case 'magic-attack': {
      actor.spendMp(Math.ceil((action.mpCost ?? 0) * (actor.mpCostMultiplier ?? 1)));
      let drainedTotal = 0;
      targets.forEach((target) => {
        const magicEvasion = action.ignoreEvasion ? 0 : (target.equipmentEffects?.magicEvasion ?? 0);
        if (magicEvasion > 0 && Math.random() * 100 < magicEvasion) {
          results.push({ type: 'miss', targetUid: target.uid, hits: action.hits ?? 1 });
          return;
        }
        const elementState = equipmentElementState(target, action.element);
        const hits = Math.max(1, action.hits ?? 1);
        let dmg = 0;
        for (let hit = 0; hit < hits; hit += 1) dmg += resolveMagicDamage(actor, target, { ...action, multiTarget: targets.length > 1 });
        dmg = Math.round(dmg * (target.magicDamageMultiplier ?? 1));
        if (elementState === 'absorb') {
          const healed = target.applyHeal(dmg);
          results.push({ type: 'absorb', targetUid: target.uid, amount: healed });
        } else {
          const dealt = elementState === 'null' ? 0 : target.applyDamage(dmg);
          drainedTotal += dealt;
          results.push({ type: 'damage', targetUid: target.uid, amount: dealt, hits, element: action.element, weak: elementState === 'weak', resisted: elementState === 'resist', nullified: elementState === 'null' });
          if (dealt > 0 && target.singing) {
            target.singing = null;
            results.push({ type: 'song-stopped', targetUid: target.uid });
          }
        }
      });
      if (action.drain && drainedTotal > 0) results.push({ type: 'heal', targetUid: actor.uid, amount: actor.applyHeal(drainedTotal) });
      break;
    }
    case 'heal': {
      if (action.mpCost) actor.spendMp(Math.ceil(action.mpCost * (actor.mpCostMultiplier ?? 1)));
      targets.forEach((target) => {
        if (target.statuses?.has('zombie') || target.isUndead) {
          const damaged = target.applyDamage(resolveHeal(action.healAmount, actor, { ...action, multiTarget: targets.length > 1 }));
          results.push({ type: 'damage', targetUid: target.uid, amount: damaged, reversed: true });
          return;
        }
        const healed = target.applyHeal(resolveHeal(action.healAmount, actor, { ...action, multiTarget: targets.length > 1 }));
        results.push({ type: 'heal', targetUid: target.uid, amount: healed });
      });
      break;
    }
    case 'fixed-damage': {
      if (action.mpCost) actor.spendMp(Math.ceil(action.mpCost * (actor.mpCostMultiplier ?? 1)));
      targets.forEach((target) => results.push({ type: 'damage', targetUid: target.uid, amount: target.applyDamage(action.fixedDamage ?? 1) }));
      if (action.sacrificeCaster) actor.applyDamage(actor.hp);
      break;
    }
    case 'ratio-damage': {
      targets.forEach((target) => {
        if (action.heavyImmune && target.heavy) results.push({ type: 'blocked', targetUid: target.uid, hits: 1 });
        else results.push({ type: 'damage', targetUid: target.uid, amount: target.applyDamage(Math.floor(target.hp * (action.ratio ?? 0.5))) });
      });
      break;
    }
    case 'max-hp-ratio-damage': {
      // Percentage-of-MAX-HP damage (e.g. Omega's Wave Cannon: 1/2 of target's max HP,
      // regardless of current HP) -- distinct from 'ratio-damage', which uses current HP.
      targets.forEach((target) => {
        if (action.heavyImmune && target.heavy) results.push({ type: 'blocked', targetUid: target.uid, hits: 1 });
        else results.push({ type: 'damage', targetUid: target.uid, amount: target.applyDamage(Math.floor(target.maxHp * (action.ratio ?? 0.5))) });
      });
      break;
    }
    case 'critical-damage': {
      // Brings each target down to a random single-digit HP value (1-9),
      // i.e. "HPを1桁にする" — never finishes a target off outright,
      // matching the source move's described effect (e.g. Maelstrom).
      targets.forEach((target) => {
        if (action.heavyImmune && target.heavy) { results.push({ type: 'blocked', targetUid: target.uid, hits: 1 }); return; }
        if (!target.isAlive()) return;
        const finalHp = Math.min(target.hp, 1 + Math.floor(Math.random() * 9));
        const amount = target.applyDamage(target.hp - finalHp);
        results.push({ type: 'damage', targetUid: target.uid, amount });
      });
      break;
    }
    case 'mp-ratio-damage': {
      targets.forEach((target) => {
        const amount = Math.floor(target.mp * (action.ratio ?? 0.5));
        target.spendMp(amount);
        results.push({ type: 'mp-damage', targetUid: target.uid, amount });
      });
      break;
    }
    case 'mp-drain': {
      targets.forEach((target) => {
        const amount = Math.min(target.mp, Math.max(1, Math.round(actor.magic * (action.power ?? 1))));
        target.spendMp(amount);
        const restored = Math.min(actor.maxMp - actor.mp, amount);
        actor.mp += restored;
        results.push({ type: 'mp-damage', targetUid: target.uid, amount }, { type: 'mp-heal', targetUid: actor.uid, amount: restored });
      });
      break;
    }
    case 'mp-heal-target': {
      targets.forEach((target) => {
        const amount = Math.min(target.maxMp - target.mp, action.mpAmount ?? 0);
        target.mp += amount;
        results.push({ type: 'mp-heal', targetUid: target.uid, amount });
      });
      break;
    }
    case 'full-restore': {
      targets.forEach((target) => {
        const healed = target.applyHeal(target.maxHp);
        const mpAmount = target.maxMp - target.mp;
        target.mp = target.maxMp;
        results.push({ type: 'heal', targetUid: target.uid, amount: healed }, { type: 'mp-heal', targetUid: target.uid, amount: mpAmount });
      });
      break;
    }
    case 'revive': {
      targets.forEach((target) => {
        const amount = target.revive?.(action.hpRatio ?? 0.25) ?? 0;
        if (amount > 0) results.push({ type: 'revive', targetUid: target.uid, amount });
        else results.push({ type: 'invalid-target', targetUid: target.uid });
      });
      break;
    }
    case 'scan': {
      targets.forEach((target) => results.push({
        type: 'scan',
        targetUid: target.uid,
        hp: target.hp,
        maxHp: target.maxHp,
        mp: target.mp,
        maxMp: target.maxMp,
        level: target.level,
        weakness: target.weakness,
        statuses: [...(target.statuses ?? [])],
      }));
      break;
    }
    case 'throw-damage': {
      targets.forEach((target) => {
        const amount = ff5ThrowDamage(actor, target, action.throwPower ?? 1);
        results.push({ type: 'damage', targetUid: target.uid, amount: target.applyDamage(amount), element: action.element });
      });
      break;
    }
    case 'status': {
      targets.forEach((target) => {
        const appliedStatuses = [];
        const resistedStatuses = [];
        // Some effects are delivered through an element/category the target
        // is explicitly weak to (e.g. Omega and 音波/sound-based Sing
        // techniques such as Romeo's Ballad). A weakness to the delivery
        // element guarantees the status lands, bypassing normal chance and
        // status resistance, just like FF5's own accuracy formula.
        const guaranteedByWeakness = action.element && equipmentElementState(target, action.element) === 'weak';
        (action.statuses ?? []).forEach((status) => {
          if (status === 'ko' && action.heavyImmune && target.heavy) {
            resistedStatuses.push(status);
            return;
          }
          const guaranteedBuff = target.isEnemy === actor.isEnemy && POSITIVE_STATUSES.includes(status);
          if (action.toggle && target.statuses.has(status)) target.removeStatus(status);
          else if (target.addStatus?.(status, {
            duration: action.duration,
            chance: guaranteedByWeakness || guaranteedBuff ? 1 : (action.statusChance ?? action.chance ?? 0.85),
            guaranteed: guaranteedByWeakness || guaranteedBuff,
          })) appliedStatuses.push(status);
          else resistedStatuses.push(status);
        });
        if (action.imageHits) target.imageHits = Math.max(target.imageHits, action.imageHits);
        if (appliedStatuses.length || action.imageHits) results.push({ type: 'status', targetUid: target.uid, statuses: appliedStatuses });
        if (resistedStatuses.length) results.push({ type: 'status-resist', targetUid: target.uid, statuses: resistedStatuses });
      });
      break;
    }
    case 'cleanse': {
      targets.forEach((target) => {
        const removed = action.mode === 'all_curable' ? [...target.statuses].filter((status) => CURABLE_STATUSES.includes(status)) : (action.statuses ?? []);
        removed.forEach((status) => target.removeStatus?.(status));
        results.push({ type: 'cleanse', targetUid: target.uid, statuses: removed });
      });
      break;
    }
    case 'dispel': {
      targets.forEach((target) => {
        POSITIVE_STATUSES.forEach((status) => target.removeStatus?.(status));
        results.push({ type: 'dispel', targetUid: target.uid });
      });
      break;
    }
    case 'stat-modify': {
      targets.forEach((target) => {
        if (typeof target[action.stat] === 'number') target[action.stat] = Math.max(1, Math.round(target[action.stat] * (action.multiplier ?? 1)));
        results.push({ type: 'buff', targetUid: target.uid, label: `${action.stat}変化` });
      });
      break;
    }
    case 'field-speed': {
      actor.addStatus?.('time_focus', { force: true, duration: action.duration ?? 4 });
      results.push({ type: 'field-status', targetUid: actor.uid, status: 'time_focus', multiplier: action.multiplier ?? 0.7 });
      break;
    }
    case 'field-status': {
      const status = action.status === 'mute' ? 'silence' : action.status;
      (battleUnits ?? targets).filter((unit) => unit.isAlive()).forEach((target) => {
        const applied = target.addStatus?.(status, { chance: 1, duration: action.duration ?? 4 });
        results.push({ type: applied ? 'status' : 'status-resist', targetUid: target.uid, statuses: [status] });
      });
      break;
    }
    case 'barrier-physical': {
      const total = action.amount ?? Math.max(400, actor.level * 60 + actor.magic * 10);
      targets.filter((target) => target.isAlive()).forEach((target) => {
        target.physicalBarrier = Math.max(target.physicalBarrier ?? 0, total);
        results.push({ type: 'barrier', targetUid: target.uid, amount: target.physicalBarrier });
      });
      break;
    }
    case 'sacrifice': {
      actor.applyDamage(actor.hp);
      results.push({ type: 'status', targetUid: actor.uid, statuses: ['ko'] });
      break;
    }
    case 'remove-from-battle': {
      targets.forEach((target) => {
        if (target.heavy) results.push({ type: 'blocked', targetUid: target.uid, hits: 1 });
        else {
          target.removedFromBattle = true;
          results.push({ type: 'removed', targetUid: target.uid });
        }
      });
      break;
    }
    case 'extra-turn': {
      actor.ctValue += 1000 * Math.max(1, action.count ?? 1);
      results.push({ type: 'extra-turn', targetUid: actor.uid, count: action.count ?? 1 });
      break;
    }
    case 'scripted': {
      results.push({ type: 'effect', targetUid: targets[0]?.uid ?? actor.uid, label: action.label });
      break;
    }
    case 'summon-odin': {
      targets.forEach((target) => {
        if (!target.heavy && !target.statusImmunities?.has('ko')) {
          const applied = target.addStatus?.('ko', { chance: 1, guaranteed: true });
          results.push({ type: applied ? 'status' : 'status-resist', targetUid: target.uid, statuses: ['ko'] });
          return;
        }
        const amount = target.applyDamage(resolveMagicDamage(actor, target, action));
        results.push({ type: 'damage', targetUid: target.uid, amount, element: null, odinFallback: 'gungnir' });
      });
      break;
    }
    case 'special-command': {
      results.push({ type: 'effect', targetUid: targets[0]?.uid ?? actor.uid, label: action.name ?? action.specialCommand });
      break;
    }
    case 'defend': {
      actor.defending = true;
      results.push({ type: 'defend', targetUid: actor.uid });
      break;
    }
    case 'guard': {
      actor.defending = true;
      actor.physicalDamageMultiplier = 0;
      results.push({ type: 'buff', targetUid: actor.uid, label: '物理攻撃無効' });
      break;
    }
    case 'focus': {
      actor.nextAttackMultiplier = Math.max(actor.nextAttackMultiplier ?? 1, 2);
      results.push({ type: 'buff', targetUid: actor.uid, label: '次の物理攻撃強化' });
      break;
    }
    case 'image': {
      actor.imageHits = Math.max(actor.imageHits ?? 0, action.imageHits ?? 2);
      results.push({ type: 'buff', targetUid: actor.uid, label: `分身${actor.imageHits}回` });
      break;
    }
    case 'haste': {
      actor.spendMp(Math.ceil((action.mpCost ?? 0) * (actor.mpCostMultiplier ?? 1)));
      actor.addStatus?.('haste', { force: true, duration: action.duration });
      results.push({ type: 'buff', targetUid: actor.uid, label: '素早さ上昇' });
      break;
    }
    case 'imbue': {
      actor.spendMp(Math.ceil((action.mpCost ?? 0) * (actor.mpCostMultiplier ?? 1)));
      actor.weaponElement = action.element;
      actor.weaponSpellblade = { element: action.element ?? null, tier: action.spellbladeTier ?? 1, effect: action.spellbladeEffect ?? null, name: action.name };
      results.push({ type: 'buff', targetUid: actor.uid, label: `${action.name ?? '魔法剣'}を付与` });
      break;
    }
    default:
      break;
  }

  return results;
}

// ---- src/battle/CTBEngine.js ----
/**
 * CTBEngine
 * ----------
 * Reproduces the core feel of FFX's Count/Charge Time Battle system:
 *  - Every unit accrues "CT" each tick, proportional to its Agility.
 *  - When a unit's CT crosses BASE_THRESHOLD, it becomes ready to act.
 *  - Acting consumes CT: the action's `ctbCost` multiplier decides how far
 *    the unit's CT drops below the threshold, i.e. how long until its next
 *    turn. Cheap/fast actions (Defend) barely delay the unit; heavy spells
 *    delay it a lot.
 *  - previewQueue() runs a side simulation (cloned CT values only) to show
 *    the upcoming turn order without mutating real battle state.
 */

const BASE_THRESHOLD = 1000;

class CTBEngine {
  constructor(units) {
    this.units = units;
  }

  aliveUnits() {
    return this.units.filter((u) => u.isAlive() && !u.removedFromBattle);
  }

  /**
   * Advances real CT values tick by tick until exactly one unit is ready,
   * then returns that unit. Ties are broken by whichever accumulated the
   * highest CT overshoot, then by Agility.
   */
  advanceToNextActor() {
    const alive = this.aliveUnits();
    if (alive.length === 0) return null;

    // Fast-forward: compute, per unit, how many ticks until threshold, then
    // jump straight to the smallest requirement instead of looping tick by tick.
    // (Still tick-accurate for tie-breaking.)
    let guard = 0;
    while (guard++ < 100000) {
      const ready = alive.filter((u) => u.ctValue >= BASE_THRESHOLD);
      if (ready.length > 0) {
        ready.sort((a, b) => (b.ctValue - a.ctValue) || (effectiveAgility(b) - effectiveAgility(a)));
        return ready[0];
      }
      // Jump forward by the minimum number of ticks needed for the fastest
      // unit-to-threshold gap, applied to everyone at once (equivalent to
      // simulating tick-by-tick, just faster).
      const ticksNeeded = alive.map((u) =>
        Math.ceil((BASE_THRESHOLD - u.ctValue) / Math.max(1, effectiveAgility(u)))
      );
      const jump = Math.max(1, Math.min(...ticksNeeded));
      alive.forEach((u) => {
        u.ctValue += Math.max(1, effectiveAgility(u)) * jump;
      });
    }
    return alive[0];
  }

  /** Consumes the acting unit's turn, applying the action's CTB cost. */
  consumeTurn(unit, ctbCost = 1.0) {
    unit.ctValue -= BASE_THRESHOLD * ctbCost;
    if (unit.ctValue < -BASE_THRESHOLD * 2) {
      // safety clamp so a single huge cost can't strand a unit forever
      unit.ctValue = -BASE_THRESHOLD * 2;
    }
  }

  /**
   * Predicts the next `count` actors without mutating real units.
   * Enemies are assumed to use a "normal" (1.0) cost action; this is only
   * a preview so perfect accuracy isn't required.
   */
  previewQueue(count = 8) {
    const clones = this.aliveUnits().map((u) => ({
      uid: u.uid,
      id: u.id,
      name: u.name,
      isEnemy: u.isEnemy,
      ct: u.ctValue,
      agi: Math.max(1, effectiveAgility(u)),
    }));
    if (clones.length === 0) return [];

    const queue = [];
    let guard = 0;
    while (queue.length < count && guard++ < 100000) {
      const ready = clones.filter((c) => c.ct >= BASE_THRESHOLD);
      if (ready.length === 0) {
        const ticksNeeded = clones.map((c) =>
          Math.ceil((BASE_THRESHOLD - c.ct) / Math.max(1, c.agi))
        );
        const jump = Math.max(1, Math.min(...ticksNeeded));
        clones.forEach((c) => {
          c.ct += c.agi * jump;
        });
        continue;
      }
      ready.sort((a, b) => (b.ct - a.ct) || (b.agi - a.agi));
      const actor = ready[0];
      queue.push({ uid: actor.uid, id: actor.id, name: actor.name, isEnemy: actor.isEnemy });
      actor.ct -= BASE_THRESHOLD * 1.0; // assume average-cost action for preview purposes
    }
    return queue;
  }
}

/**
 * えんばんせき (disc stones) — collectible technique discs.
 *
 * Each owned disc is an individual instance (not a stacked count) so it can
 * be freely renamed and fused with another disc. A disc always carries 1-4
 * distinct base techniques drawn from the crystalShards reference pool
 * (src/database/ff5Database.js). Fusing two discs merges their technique
 * lists into a brand-new disc instance; the two source discs are consumed.
 */

let discUidCounter = 0;
function nextDiscUid() {
  discUidCounter += 1;
  return `disc_${Date.now().toString(36)}_${discUidCounter}_${Math.floor(Math.random() * 1e6).toString(36)}`;
}

function baseDiscRecord(shardId) {
  return crystalShards.find((entry) => entry.id === shardId) ?? null;
}

function createDiscInstance(shardId) {
  const base = baseDiscRecord(shardId);
  if (!base) return null;
  return { uid: nextDiscUid(), name: base.nameJa, shardIds: [shardId] };
}

function discTechniques(disc) {
  return (disc?.shardIds ?? []).map((id) => baseDiscRecord(id)).filter(Boolean);
}

function discDefaultName(shardIds) {
  const bases = shardIds.map((id) => baseDiscRecord(id)).filter(Boolean);
  if (bases.length <= 1) return bases[0]?.nameJa ?? 'えんばんせき';
  return `融合えんばんせき（${bases.map((base) => base.nameJa.replace('のかけら', '')).join('・')}）`;
}

const MERGE_COST_BY_RESULT_COUNT = { 2: 300, 3: 900, 4: 2000 };
function mergeCost(resultCount) {
  return MERGE_COST_BY_RESULT_COUNT[resultCount] ?? resultCount * 500;
}

function canMergeDiscs(discA, discB) {
  if (!discA || !discB || discA.uid === discB.uid) return { ok: false, reason: 'invalid' };
  const shardIds = [...discA.shardIds, ...discB.shardIds];
  const unique = new Set(shardIds);
  if (unique.size !== shardIds.length) return { ok: false, reason: 'duplicate' };
  if (unique.size > 4) return { ok: false, reason: 'toomany' };
  return { ok: true, resultCount: unique.size };
}

function mergeDiscs(discA, discB, customName = null) {
  const check = canMergeDiscs(discA, discB);
  if (!check.ok) return check;
  const shardIds = [...discA.shardIds, ...discB.shardIds];
  const disc = {
    uid: nextDiscUid(),
    name: customName?.trim() || discDefaultName(shardIds),
    shardIds,
  };
  return { ok: true, disc, cost: mergeCost(check.resultCount), resultCount: check.resultCount };
}

/** Resolve the technique ids an equipped えんばんせき grants in battle. `crystalShardId`
 * may be an owned disc's uid or (for characters who never customized their
 * loadout) a base crystalShards catalog id. */
function resolveDiscTechniqueIds(crystalShardId, ownedDiscs = []) {
  if (!crystalShardId) return [];
  const owned = ownedDiscs.find((disc) => disc.uid === crystalShardId);
  if (owned) return [...owned.shardIds];
  const base = baseDiscRecord(crystalShardId);
  return base ? [base.id] : [];
}

/**
 * えんばんせきガチャ — gacha odds and reward pools.
 *
 *  - 大当たり (jackpot, 5%): a new single-technique えんばんせき.
 *  - 小当たり (small win): a useful consumable (Phoenix Down / Hi-Potion / Ether).
 *  - ハズレ (miss): a Potion.
 *
 * A 10-pull guarantees at least one 小当たり-or-better among the ten slots.
 */

const GACHA_SINGLE_COST = 50;
const GACHA_TEN_COST = 500;
const GACHA_TEN_PULL_COUNT = 10;

const GACHA_TIER_WEIGHTS = [
  { tier: 'jackpot', weight: 5 },
  { tier: 'small', weight: 25 },
  { tier: 'miss', weight: 70 },
];

const MISS_POOL = [
  { itemId: 'item_potion', qty: 1, nameJa: 'ポーション' },
  { itemId: 'item_antidote', qty: 1, nameJa: 'どくけし' },
  { itemId: 'item_eye_drops', qty: 1, nameJa: 'めぐすり' },
  { itemId: 'item_maiden_s_kiss', qty: 1, nameJa: 'おとめのキッス' },
  { itemId: 'item_mallet', qty: 1, nameJa: 'うちでのこづち' },
  { itemId: 'item_gold_needle', qty: 1, nameJa: 'きんのはり' },
  { itemId: 'item_holy_water', qty: 1, nameJa: 'せいすい' },
];

const SMALL_POOL = [
  { itemId: 'item_phoenix_down', qty: 1, nameJa: 'フェニックスのお' },
  { itemId: 'item_hi_potion', qty: 1, nameJa: 'ハイポーション' },
  { itemId: 'item_ether', qty: 1, nameJa: 'エーテル' },
];

function pick(list) {
  return list[Math.floor(Math.random() * list.length)];
}

function rollTier() {
  const total = GACHA_TIER_WEIGHTS.reduce((sum, entry) => sum + entry.weight, 0);
  let roll = Math.random() * total;
  for (const entry of GACHA_TIER_WEIGHTS) {
    if (roll < entry.weight) return entry.tier;
    roll -= entry.weight;
  }
  return 'miss';
}

function rollJackpotDisc() {
  const shard = pick(crystalShards);
  return createDiscInstance(shard.id);
}

/**
 * "確定演出" (early-tell) state for the crystal-crack reveal (see
 * playGachaReveal in main.js). About half of all 小当たり/大当たり slots
 * light up gold/rainbow while the crystal is still cracking, so the player
 * gets an early tell; the other half stay a mystery blue crystal until the
 * moment it opens (surprise reveal). ハズレ is always plain blue.
 *
 *  - 'blue'         : no early tell, stays blue until opened
 *  - 'gold'          : early tell, confirmed 小当たり以上
 *  - 'rainbow'       : early tell, confirmed 大当たり (visible immediately)
 *  - 'gold-upgrade'  : early tell shows gold, then upgrades to rainbow
 *                      (大当たり) right before it opens
 */
function rollTellState(tier) {
  if (tier === 'miss') return 'blue';
  const hasTell = Math.random() < 0.5;
  if (!hasTell) return 'blue';
  if (tier === 'small') return 'gold';
  return Math.random() < 0.5 ? 'rainbow' : 'gold-upgrade';
}

/** Roll one gacha slot. Pass a tier ('jackpot' | 'small' | 'miss') to force a
 * result — used for the guaranteed 10-pull slot and the admin preview. */
function rollGachaResult(forcedTier = null) {
  const tier = forcedTier ?? rollTier();
  const tell = rollTellState(tier);
  if (tier === 'jackpot') {
    return { tier, tell, kind: 'disc', disc: rollJackpotDisc() };
  }
  const item = pick(tier === 'small' ? SMALL_POOL : MISS_POOL);
  return { tier, tell, kind: 'item', itemId: item.itemId, qty: item.qty, nameJa: item.nameJa };
}

function rollTenPullResults() {
  const results = Array.from({ length: GACHA_TEN_PULL_COUNT }, () => rollGachaResult());
  const hasGoodResult = results.some((entry) => entry.tier === 'jackpot' || entry.tier === 'small');
  if (!hasGoodResult) {
    const index = Math.floor(Math.random() * results.length);
    results[index] = rollGachaResult('small');
  }
  return results;
}

function addUnique(list, value) {
  if (value && !list.includes(value)) list.push(value);
}

function findEquipment(id) {

}

function equipmentEffectText(item) {
  if (!item) return 'なし';
  return item.special ? specialEffectDescriptions[item.special] ?? item.special : '追加効果なし';
}

function equipmentDetailText(item) {

  const parts = [];

  } else {
    parts.push(`防御 ${item.defense}`, `魔防 ${item.magicDefense}`, `回避 ${item.evasion}%`);
  }
  parts.push(`追加効果: ${equipmentEffectText(item)}`);
  return parts.join(' / ');
}

function calculateEquipmentBonuses(equipment = {}) {
  const items = Object.values(equipment).map(findEquipment).filter(Boolean);
  const weapon = findEquipment(equipment.weapon);
  const result = {
    attack: weapon?.attack ?? 0,
    weaponAttack: weapon?.attack ?? 0,
    weaponType: weapon?.type ?? (weapon ? 'sword' : 'fist'),
    throwPower: weapon?.throwAttack ?? weapon?.attack ?? 0,
    defense: items.reduce((sum, item) => sum + (item.defense ?? 0), 0),
    magicDefense: items.reduce((sum, item) => sum + (item.magicDefense ?? 0), 0),
    evasion: items.reduce((sum, item) => sum + (item.evasion ?? 0), 0),
    magic: 0,
    agility: 0,
    weaponElement: normalizeElement(weapon?.element ?? null),
    weaponAccuracy: weapon?.accuracy ?? 100,
    weaponSpecial: weapon?.special ?? null,
    resistances: [], nullElements: [], absorbs: [], weaknesses: [], magicBoostElements: [],
    statusImmunities: [], autoStatuses: [], onHitStatuses: [], killers: [],
    statusResistance: 0,
    magicEvasion: 0,
    onHitProc: null,
    initialCtBonus: 0,
    undeadProperties: false,
    backRowFullDamage: false,
    mpCostMultiplier: 1,
    physicalDamageMultiplier: 1,
    initialImageHits: 0,
    stealRate: 0.4,
    danceBoost: false,
    catchBoost: false,
    improvedBrawl: false,
  };

  items.forEach((item) => {
    const special = item.special ?? '';
    const statBonus = (pattern) => Number(special.match(pattern)?.[1] ?? 0);
    result.attack += statBonus(/^str_plus_(\d+)/) + statBonus(/^str_agi_plus_(\d+)/);
    result.magic += statBonus(/^mag_plus_(\d+)/) + statBonus(/^vit_mag_plus_(\d+)/);
    result.agility += statBonus(/^agi_plus_(\d+)/) + statBonus(/^str_agi_plus_(\d+)/);
    if (special === 'magic_plus') result.magic += 3;
    if (special === 'most_status_immunity_and_all_stats_plus_5') {
      result.attack += 5; result.defense += 5; result.magic += 5; result.agility += 5;
    }
    if (special === 'barehanded_boost_str_plus_5') { result.attack += 5; result.improvedBrawl = true; }
    if (special === 'steal_boost_agi_plus_1') result.agility += 1;
    if (special === 'steal_boost_agi_plus_1') result.stealRate = 0.8;
    if (special === 'confuse_immunity_and_dance_boost') result.danceBoost = true;
    if (special === 'catch_boost') result.catchBoost = true;
    if (special === 'sap_sleep_immunity_mag_minus_5') result.magic -= 5;
    if (special === 'physical_evasion') result.evasion += 25;
    if (special === 'evasion_and_protect') result.evasion += 10;
    if (special === 'auto_image') result.initialImageHits = Math.max(result.initialImageHits, 1);
    if (special === 'half_mp_cost') result.mpCostMultiplier = 0.5;
    if (special === 'first_strike_and_haste') result.initialCtBonus = Math.max(result.initialCtBonus, 700);
    if (special === 'undead_properties') result.undeadProperties = true;
    if (special === 'back_row_full_damage') result.backRowFullDamage = true;

    const immunityMap = {
      blind_immunity: ['blind'], silence_immunity: ['silence'],
      confuse_mini_immunity: ['confuse', 'mini'], confuse_toad_immunity: ['confuse', 'toad'],
      paralyze_mini_immunity: ['paralyze', 'mini'], paralyze_toad_immunity: ['paralyze', 'toad'],
      zombie_old_immunity: ['zombie', 'old'], sap_sleep_immunity_mag_minus_5: ['sap', 'sleep'],
      petrify_immunity_and_magic_block: ['petrify'],
      confuse_immunity_and_dance_boost: ['confuse'],
    };
    (immunityMap[special] ?? []).forEach((status) => addUnique(result.statusImmunities, status));
    if (special === 'auto_haste_and_status_immunity' || special === 'most_status_immunity_and_all_stats_plus_5') {
      ['poison', 'blind', 'silence', 'toad', 'mini', 'petrify', 'confuse', 'paralyze', 'sleep', 'old'].forEach((status) => addUnique(result.statusImmunities, status));
      result.statusResistance = 0.35;
    }
    if (special === 'auto_haste_and_status_immunity') addUnique(result.autoStatuses, 'haste');
    if (special === 'auto_reflect') addUnique(result.autoStatuses, 'reflect');
    if (special === 'auto_regen_vit_plus_5') addUnique(result.autoStatuses, 'regen');
    if (special === 'auto_doom') addUnique(result.autoStatuses, 'doom');
    if (special === 'petrify_immunity_and_magic_block') result.magicEvasion += 20;

    const onHitStatusMap = {
      berserk_on_hit: 'berserk', blind: 'blind', confuse: 'confuse', old: 'old',
      paralyze: 'paralyze', poison: 'poison', silence: 'silence', sleep: 'sleep',
      instant_death: 'ko',
    };
    if (onHitStatusMap[special]) result.onHitStatuses.push({ status: onHitStatusMap[special], chance: special === 'instant_death' ? 0.08 : 0.22 });

    const killerMap = {
      aevis_killer: ['aevis'], dragon_and_undead_killer: ['dragon', 'undead'], dragon_killer: ['dragon'],
      giant_killer: ['giant'], human_killer: ['human'], magic_beast_killer: ['magic_beast'],
    };
    (killerMap[special] ?? []).forEach((type) => addUnique(result.killers, type));
    const procMap = {
      earthquake_proc: { element: 'earth', power: 1.8, chance: 0.18 },
      firaga_proc: { element: 'fire', power: 2.3, chance: 0.2 },
      thunder_proc: { element: 'thunder', power: 1.45, chance: 0.25 },
      wind_slash: { element: 'wind', power: 1.65, chance: 0.2 },
    };
    if (procMap[special]) result.onHitProc = procMap[special];

    if (special === 'resist_lightning') addUnique(result.resistances, 'thunder');
    if (special.includes('absorb_fire')) addUnique(result.absorbs, 'fire');
    if (special.includes('absorb_ice')) addUnique(result.absorbs, 'ice');
    if (special.includes('absorb_water')) addUnique(result.absorbs, 'water');
    if (special.includes('null_ice')) addUnique(result.nullElements, 'ice');
    if (special.includes('null_fire')) addUnique(result.nullElements, 'fire');
    if (special.includes('poison_null')) addUnique(result.nullElements, 'poison');
    if (special.includes('weak_water')) addUnique(result.weaknesses, 'water');
    if (special.includes('weak_lightning')) addUnique(result.weaknesses, 'thunder');
    if (special === 'boost_earth') addUnique(result.magicBoostElements, 'earth');
    if (special === 'boost_wind') addUnique(result.magicBoostElements, 'wind');
    if (special.includes('boost_fire_ice_lightning') || special === 'multi_element_boost') {
      ['fire', 'ice', 'thunder'].forEach((element) => addUnique(result.magicBoostElements, element));
    }
    if (special === 'multi_element_boost') ['earth', 'wind'].forEach((element) => addUnique(result.magicBoostElements, element));
    if (special === 'boost_holy_and_raise') addUnique(result.magicBoostElements, 'holy');
    if (special === 'boost_and_break_cast' && item.element) addUnique(result.magicBoostElements, normalizeElement(item.element));
  });

  result.evasion = Math.min(80, result.evasion);
  return result;
}
