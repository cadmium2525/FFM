  { minLevel: 50, id: 'animal-wild-boar', name: 'いのしし', kind: 'physical-attack', power: 2, ranged: true, target: 'single-enemy' },
  { minLevel: 60, id: 'animal-unicorn', name: 'ユニコーン', kind: 'heal', ff5Power: 120, formula: 'ff5_magic', target: 'all_allies' },
]);

const choose = (list, random = Math.random) => list[Math.floor(random() * list.length)];
const livingAllies = (manager, actor) => manager.units.filter((unit) => unit.isAlive() && !unit.removedFromBattle && unit.isEnemy === actor.isEnemy);
const livingEnemies = (manager, actor) => manager.units.filter((unit) => unit.isAlive() && !unit.removedFromBattle && !unit.hidden && unit.isEnemy !== actor.isEnemy);
const resultLabel = (actor, text) => ({ type: 'command-message', targetUid: actor.uid, label: text });

function capturePresentationPatch(unit) {
  if (!unit) return null;
  const cloneValue = (value) => {
    if (value instanceof Set) return [...value].map(cloneValue);
    if (value instanceof Map) return [...value].map(([key, entry]) => [key, cloneValue(entry)]);
    if (Array.isArray(value)) return value.map(cloneValue);
    if (value && typeof value === 'object') return Object.fromEntries(Object.entries(value).map(([key, entry]) => [key, cloneValue(entry)]));
    return value;
  };
  return { uid: unit.uid, ...Object.fromEntries(Object.entries(unit).map(([key, value]) => [key, cloneValue(value)])) };
}

function commandTargets(manager, actor, action, fallback) {
  if (['all_enemies', 'enemy_group'].includes(action.target)) return livingEnemies(manager, actor);
  if (['all_allies', 'party'].includes(action.target)) return livingAllies(manager, actor);
  if (action.target === 'self') return [actor];
  return [fallback ?? livingEnemies(manager, actor)[0] ?? actor];
}

function steal(manager, actor, target) {
  if (!target || target.stolen) return [resultLabel(actor, '何も持っていない。')];
  const rate = actor.equipmentEffects?.stealRate ?? 0.4;
  if (Math.random() >= rate) return [resultLabel(actor, 'ぬすめなかった。')];
  const table = STEAL_TABLE[target.id] ?? { common: 'item_potion', rare: 'item_hi_potion', commonName: 'ポーション', rareName: 'ハイポーション' };
  const rare = Math.floor(Math.random() * 256) < 10;
  const itemId = rare ? table.rare : table.common;
  const itemName = rare ? table.rareName : table.commonName;
  target.stolen = true;
  manager.addItemStock?.(itemId, 1);
  return [{ type: 'steal', targetUid: target.uid, itemId, itemName, rare }];
}

function resolveMix(manager, actor, action, targets) {
  const needed = new Map();
  action.ingredients.forEach((id) => needed.set(id, (needed.get(id) ?? 0) + 1));
  for (const [id, amount] of needed) {
    if (manager.getItemStock(id) < amount) return { valid: false, reason: '調合素材が足りない。' };
  }
  for (const [id, amount] of needed) manager.consumeItemStock(id, amount);
  const results = [];
  const applyTo = targets.length ? targets : [actor];
  const heal = (unit, amount) => results.push({ type: 'heal', targetUid: unit.uid, amount: unit.applyHeal(amount) });
  const restoreMp = (unit, amount) => {
    const before = unit.mp;
    unit.mp = Math.min(unit.maxMp, unit.mp + amount);
    results.push({ type: 'mp-heal', targetUid: unit.uid, amount: unit.mp - before });
  };
  const damage = (unit, amount, element = null) => results.push({ type: 'damage', targetUid: unit.uid, amount: unit.applyDamage(amount), element });
  const status = (unit, statuses, duration = 12) => {
    const applied = statuses.filter((name) => unit.addStatus(name, { duration, chance: 1, guaranteed: true }));
    results.push({ type: applied.length ? 'status' : 'status-resist', targetUid: unit.uid, statuses: applied.length ? applied : statuses });
  };
  const cleanse = (unit, statuses) => {
    const removed = statuses.filter((name) => unit.removeStatus(name));
    results.push({ type: 'cleanse', targetUid: unit.uid, statuses: removed });
  };
  const revive = (unit, hpRatio, fullMp = false) => {
    const amount = unit.revive(hpRatio);
    if (fullMp) unit.mp = unit.maxMp;
    results.push({ type: 'revive', targetUid: unit.uid, amount });
  };

  switch (action.mixEffect) {
    case 'potion': applyTo.forEach((unit) => heal(unit, 90)); break;
    case 'hi-potion': applyTo.forEach((unit) => heal(unit, 900)); break;
    case 'lifewater': applyTo.forEach((unit) => status(unit, ['regen'])); break;
    case 'resurrection': applyTo.forEach((unit) => revive(unit, 0.25)); break;
    case 'reincarnate': applyTo.forEach((unit) => revive(unit, 1, true)); break;
    case 'phoenix-down': applyTo.forEach((unit) => revive(unit, 0.125)); break;
    case 'x-potion': applyTo.forEach((unit) => heal(unit, 9999)); break;
    case 'neutralizer': applyTo.forEach((unit) => { heal(unit, 90); cleanse(unit, ['poison']); }); break;
    case 'cure-blind': applyTo.forEach((unit) => { heal(unit, 90); cleanse(unit, ['blind']); }); break;
    case 'maiden-kiss': applyTo.forEach((unit) => { heal(unit, 90); cleanse(unit, ['toad']); }); break;
    case 'holy-water': applyTo.forEach((unit) => { heal(unit, 90); cleanse(unit, ['zombie']); }); break;
    case 'antidote': applyTo.forEach((unit) => cleanse(unit, ['poison'])); break;
    case 'remedy': applyTo.forEach((unit) => cleanse(unit, ['poison', 'blind', 'sleep', 'petrify', 'toad', 'mini', 'old', 'silence'])); break;
    case 'smelling-salts': applyTo.forEach((unit) => cleanse(unit, ['confuse', 'sleep', 'paralyze'])); break;
    case 'ether': applyTo.forEach((unit) => restoreMp(unit, 80)); break;
    case 'balm': applyTo.forEach((unit) => restoreMp(unit, 9999)); break;
    case 'elixir': applyTo.forEach((unit) => { heal(unit, 9999); restoreMp(unit, 9999); }); break;
    case 'dragon-power': applyTo.forEach((unit) => { unit.level = Math.min(255, unit.level + 20); results.push({ type: 'buff', targetUid: unit.uid, label: 'レベル+20' }); }); break;
    case 'samson-power': applyTo.forEach((unit) => { unit.level = Math.min(255, unit.level + 10); results.push({ type: 'buff', targetUid: unit.uid, label: 'レベル+10' }); }); break;
    case 'goliath': applyTo.forEach((unit) => { const gain = unit.maxHp; unit.maxHp = Math.min(9999, unit.maxHp * 2); unit.hp = Math.min(unit.maxHp, unit.hp + gain); results.push({ type: 'buff', targetUid: unit.uid, label: '最大HP2倍' }); }); break;
    case 'elemental-power': applyTo.forEach((unit) => { unit.elementalPower = true; results.push({ type: 'buff', targetUid: unit.uid, label: '全属性強化' }); }); break;
    case 'resist-fire': case 'resist-ice': case 'resist-thunder': {
      const element = action.mixEffect.replace('resist-', '');
      applyTo.forEach((unit) => { unit.temporaryNullElements.add(element); results.push({ type: 'buff', targetUid: unit.uid, label: `${element}無効` }); });
      break;
    }
    case 'dragon-shield': applyTo.forEach((unit) => { ['fire', 'ice', 'thunder'].forEach((element) => unit.temporaryNullElements.add(element)); results.push({ type: 'buff', targetUid: unit.uid, label: '炎・氷・雷無効' }); }); break;
    case 'dragon-defense': applyTo.forEach((unit) => status(unit, ['protect', 'shell', 'regen', 'reflect'])); break;
    case 'protect-potion': applyTo.forEach((unit) => status(unit, ['protect', 'shell'])); break;
    case 'levisalve': applyTo.forEach((unit) => status(unit, ['float'])); break;
    case 'hasty-ade': applyTo.forEach((unit) => status(unit, ['haste'])); break;
    case 'lifeshield': applyTo.forEach((unit) => { unit.statusImmunities.add('ko'); results.push({ type: 'buff', targetUid: unit.uid, label: '即死耐性' }); }); break;
    case 'dragon-kiss': applyTo.forEach((unit) => { unit.creatureTypes.add('dragon'); unit.heavy = true; results.push({ type: 'buff', targetUid: unit.uid, label: '竜・ボス特性' }); }); break;
    case 'blessed-kiss': applyTo.forEach((unit) => { status(unit, ['berserk', 'haste']); unit.imageHits = Math.max(unit.imageHits, 2); results.push({ type: 'buff', targetUid: unit.uid, label: '分身×2' }); }); break;
    case 'bacchus-cider': applyTo.forEach((unit) => status(unit, ['berserk'])); break;
    case 'lamia-kiss': applyTo.forEach((unit) => status(unit, ['confuse'])); break;
    case 'toad-kiss': applyTo.forEach((unit) => status(unit, ['toad'])); break;
    case 'poison': case 'dud-poison': applyTo.forEach((unit) => status(unit, ['poison'])); break;
    case 'dark-gas': applyTo.forEach((unit) => status(unit, ['blind'])); break;
    case 'dark-sigh': {
      const ailments = ['blind', 'old', 'confuse', 'sleep', 'toad', 'mini', 'silence'];
      applyTo.forEach((unit) => status(unit, [choose(ailments)]));
      break;
    }
    case 'death-potion': applyTo.forEach((unit) => status(unit, ['ko'])); break;
    case 'turtle-soup': applyTo.forEach((unit) => { unit.def = Math.floor(unit.def / 2); unit.magicDef = Math.floor(unit.magicDef / 2); results.push({ type: 'debuff', targetUid: unit.uid, label: '防御・魔法防御半減' }); }); break;
    case 'dark-ether': applyTo.forEach((unit) => { const amount = unit.mp - Math.floor(unit.mp / 4); unit.spendMp(amount); results.push({ type: 'mp-damage', targetUid: unit.uid, amount }); }); break;
    case 'lilith-kiss': applyTo.forEach((unit) => { const amount = Math.min(unit.mp, Math.max(1, actor.level)); unit.spendMp(amount); actor.mp = Math.min(actor.maxMp, actor.mp + amount); results.push({ type: 'mp-damage', targetUid: unit.uid, amount }, { type: 'mp-heal', targetUid: actor.uid, amount }); }); break;
    case 'succubus-kiss': applyTo.forEach((unit) => { const amount = unit.applyDamage(Math.max(1, actor.level * 8)); actor.applyHeal(amount); results.push({ type: 'damage', targetUid: unit.uid, amount }, { type: 'heal', targetUid: actor.uid, amount }); }); break;
    case 'devil-juice': applyTo.forEach((unit) => damage(unit, 666)); break;
    case 'holy-breath': applyTo.forEach((unit) => damage(unit, actor.hp, 'holy')); break;
    case 'dragon-breath': applyTo.forEach((unit) => damage(unit, actor.hp, 'fire')); break;
    case 'dark-breath': applyTo.forEach((unit) => damage(unit, Math.max(1, actor.maxHp - actor.hp))); break;
    case 'dud-gravity': applyTo.forEach((unit) => damage(unit, Math.floor(unit.hp / 4))); break;
    case 'antilixir': applyTo.forEach((unit) => { const amount = Math.max(0, unit.hp - 1); damage(unit, amount); const mpAmount = Math.max(0, unit.mp - 1); unit.spendMp(mpAmount); results.push({ type: 'mp-damage', targetUid: unit.uid, amount: mpAmount }); }); break;
    case 'poison-breath': {
      const derived = { ...action, kind: 'magic-attack', specialCommand: null, ff5Power: 60, formula: 'ff5_magic', element: 'poison', statuses: ['poison'], statusChance: 0.75 };
      results.push(...resolveAction({ actor, action: derived, targets: applyTo, battleUnits: manager.units }));
      break;
    }
    case 'shadowflare': {
      const derived = { ...action, kind: 'scripted', specialCommand: null, operations: [{ op: 'damage.magic', formula: 'ff5_flare', ff5Power: 200 }, { op: 'status.apply', statuses: ['sap'], statusChance: 0.75 }] };
      results.push(...resolveAction({ actor, action: derived, targets: applyTo, battleUnits: manager.units }));
      break;
    }
    case 'tnt': applyTo.forEach((unit) => damage(unit, Math.max(1, actor.maxHp), 'fire')); actor.applyDamage(actor.hp); results.push({ type: 'damage', targetUid: actor.uid, amount: actor.maxHp, element: 'fire' }); break;
    default: return { valid: false, reason: 'この組み合わせは調合できない。' };
  }
  return { valid: true, action: { ...action, kind: 'special-command' }, targets: applyTo, results };
}

function dualcastTargets(manager, actor, spell, storedUid, fallback) {
  if (['all_enemies', 'enemy_group'].includes(spell.target)) return livingEnemies(manager, actor);
  if (['all_allies', 'party'].includes(spell.target)) return livingAllies(manager, actor);
  if (spell.target === 'self') return [actor];
  const stored = manager.units.find((unit) => unit.uid === storedUid && unit.isAlive() && !unit.removedFromBattle);
  if (stored) return [stored];
  if (String(spell.target).includes('ally')) return [actor];
  return [fallback ?? livingEnemies(manager, actor)[0] ?? actor];
}

function applySongStep(manager, actor, action) {
  const allies = livingAllies(manager, actor);
  const id = action.id ?? '';
  const stats = id.includes('hero') ? ['level', 'strength', 'magic', 'agility']
    : id.includes('mana') ? ['magic']
      : id.includes('sinewy') ? ['strength']
        : ['agility'];
  const results = [];
  allies.forEach((unit) => {
    stats.forEach((statName) => {
      const current = Math.max(1, Math.floor(unit[statName] ?? (statName === 'strength' ? unit.atk : 1)));
      unit[statName] = Math.min(99, current + 1);
      if (statName === 'strength') unit.atk = Math.max(unit.atk, unit.strength);
    });
    results.push({ type: 'buff', targetUid: unit.uid, label: `${action.name}：${stats.join('・')}+1` });
  });
  return results;
}

/** Resolve commands whose behavior cannot be expressed as one generic action. */
function resolveFF5SpecialCommand({ manager, actor, action, targets }) {
  const target = targets[0];
  switch (action.specialCommand) {
    case 'steal':
      return { valid: true, action, targets, results: steal(manager, actor, target) };
    case 'mug': {
      const attack = { ...action, kind: 'physical-attack', specialCommand: null, commandFormula: 'mug' };
      return { valid: true, action: attack, targets, results: [...resolveAction({ actor, action: attack, targets, battleUnits: manager.units }), ...steal(manager, actor, target)] };
    }
    case 'mimic': {
      const saved = manager.lastPartyAction;
      if (!saved?.action || saved.action.specialCommand === 'mimic') return { valid: false, reason: 'ものまねできる行動がない。' };
      const copied = { ...saved.action, mpCost: 0, _mimicked: true, name: saved.action.name ?? 'ものまね' };
      const copiedTargets = (saved.targetIds ?? []).map((uid) => manager.units.find((unit) => unit.uid === uid)).filter((unit) => unit?.isAlive());
      const finalTargets = copiedTargets.length ? copiedTargets : targets;
      return { valid: true, action: copied, targets: finalTargets, results: resolveAction({ actor, action: copied, targets: finalTargets, battleUnits: manager.units }), remember: false };
    }
    case 'dualcast': {
      const spells = action.dualSpells ?? [];
      if (spells.length !== 2) return { valid: false, reason: 'れんぞくまは2つの魔法を選ぶ。' };
      const totalCost = spells.reduce((sum, spell) => sum + Math.ceil((spell.mpCost ?? 0) * (actor.mpCostMultiplier ?? 1)), 0);
      if (actor.mp < totalCost) return { valid: false, reason: `MPが足りない（必要 ${totalCost}）。` };
      const results = [];
      spells.forEach((spell, index) => {
        const spellTargets = dualcastTargets(manager, actor, spell, action.dualTargetUids?.[index], target);
        results.push(...resolveAction({ actor, action: { ...spell, kind: spell.actionKind ?? 'magic-attack' }, targets: spellTargets, battleUnits: manager.units })
          .map((result) => ({
            ...result,
            castIndex: index,
            visualAction: spell,
            presentationPatch: capturePresentationPatch(manager.units.find((unit) => unit.uid === result.targetUid)),
          })));
      });
      return { valid: true, action, targets, results };
    }
    case 'jump':
      actor.pendingJump = { targetUid: target?.uid ?? null, action: { ...action, kind: 'physical-attack', specialCommand: null, commandFormula: 'jump', ignoreEvasion: true } };
      actor.hidden = true;
      return { valid: true, action, targets: [actor], results: [{ type: 'jump-start', targetUid: actor.uid }], remember: false };
    case 'gaia': {
      const derived = { ...choose(GAIA_CRYSTAL_SANCTUM), sourceId: action.sourceId, commandSourceId: action.sourceId, visualId: `ability_gaia_${Date.now()}` };
      const derivedTargets = commandTargets(manager, actor, derived, target);
      return { valid: true, action: derived, targets: derivedTargets, results: resolveAction({ actor, action: derived, targets: derivedTargets, battleUnits: manager.units }) };
    }
    case 'animals': {
      const eligible = ANIMALS.filter((animal) => actor.level >= animal.minLevel);
      const derived = { ...choose(eligible), sourceId: action.sourceId, commandSourceId: action.sourceId };
      const derivedTargets = commandTargets(manager, actor, derived, target);
      const results = resolveAction({ actor, action: derived, targets: derivedTargets, battleUnits: manager.units });
      if (derived.cleanse) derivedTargets.forEach((unit) => derived.cleanse.forEach((status) => unit.removeStatus(status)));
      return { valid: true, action: derived, targets: derivedTargets, results };
    }
    case 'dance': {
      const dances = [
        { id: 'tempting-tango', name: 'ゆうわくのタンゴ', kind: 'status', statuses: ['confuse'], statusChance: 1 },
        { id: 'mystery-waltz', name: 'ミステリーワルツ', kind: 'mp-drain', power: 2 },
        { id: 'jitterbug', name: '二人のジルバ', kind: 'physical-attack', drain: true },
        { id: 'sword-dance', name: 'つるぎのまい', kind: 'physical-attack', commandFormula: 'sword-dance', ignoreEvasion: true },
      ];
      let derived = actor.equipmentEffects?.danceBoost && Math.random() < 0.5 ? dances[3] : choose(dances);
      derived = { ...derived, sourceId: action.sourceId, commandSourceId: action.sourceId, target: 'single-enemy' };
      return { valid: true, action: derived, targets, results: resolveAction({ actor, action: derived, targets, battleUnits: manager.units }) };
    }
    case 'throw': {
      if (manager.getItemStock(action.requiredItemId) < 1) return { valid: false, reason: '投げるアイテムがない。' };
      manager.consumeItemStock(action.requiredItemId, 1);
      const derived = action.element
        ? { ...action, kind: 'magic-attack', specialCommand: null, ff5Power: action.throwPower, formula: 'ff5_magic', mpCost: 0 }
        : { ...action, kind: 'throw-damage', specialCommand: null };
      return { valid: true, action: derived, targets, results: resolveAction({ actor, action: derived, targets, battleUnits: manager.units }) };
    }
    case 'zeninage': {
      const spec = ff5Zeninage(actor, targets.length);
      if ((manager.getGil?.() ?? 0) < spec.cost) return { valid: false, reason: `ギルが足りない（必要 ${spec.cost}）。` };
      manager.spendGil?.(spec.cost);
      const results = targets.map((unit) => ({ type: 'damage', targetUid: unit.uid, amount: unit.applyDamage(ff5FinalDamage(spec.attack, unit.def ?? 0, spec.multiplier)) }));
      return { valid: true, action: { ...action, specialCommand: null }, targets, results };
    }
    case 'mix': return resolveMix(manager, actor, action, targets);
    case 'drink': {
      if (manager.getItemStock(action.requiredItemId) < 1) return { valid: false, reason: '薬がない。' };
      manager.consumeItemStock(action.requiredItemId, 1);
      let derived;
      if (action.drinkEffect === 'giant') derived = { ...action, kind: 'stat-modify', stat: 'maxHp', multiplier: 2 };
      else if (action.drinkEffect === 'power') derived = { ...action, kind: 'stat-modify', stat: 'atk', multiplier: 1.25 };
      else if (action.drinkEffect === 'speed') derived = { ...action, kind: 'status', statuses: ['haste'], duration: 12, statusChance: 1 };
      else if (action.drinkEffect === 'iron') derived = { ...action, kind: 'status', statuses: ['protect'], duration: 12, statusChance: 1 };
      else derived = { ...action, kind: 'stat-modify', stat: 'level', multiplier: 1.2 };
      return { valid: true, action: derived, targets: [actor], results: resolveAction({ actor, action: derived, targets: [actor], battleUnits: manager.units }) };
    }
    case 'call': {
      const summon = { ...choose(SUMMONS), mpCost: 0, id: `call-${Date.now()}`, commandSourceId: 'ability_call' };
      const summonTargets = commandTargets(manager, actor, summon, target);
      return { valid: true, action: summon, targets: summonTargets, results: resolveAction({ actor, action: summon, targets: summonTargets, battleUnits: manager.units }) };
    }
    case 'lance': {
      const hpAction = { ...action, kind: 'magic-attack', specialCommand: null, ff5Power: 35, drain: true, mpCost: 0 };
      const results = resolveAction({ actor, action: hpAction, targets, battleUnits: manager.units });
      const mpAmount = Math.min(target?.mp ?? 0, Math.max(1, Math.floor(actor.level * actor.magic / 128) + 1));
      if (target && mpAmount) { target.spendMp(mpAmount); actor.mp = Math.min(actor.maxMp, actor.mp + mpAmount); results.push({ type: 'mp-damage', targetUid: target.uid, amount: mpAmount }, { type: 'mp-heal', targetUid: actor.uid, amount: mpAmount }); }
      return { valid: true, action: hpAction, targets, results };
    }
    case 'chakra': {
      const amount = Math.max(1, Math.floor(actor.level * actor.level / 4) + actor.vitality);
      const healed = actor.applyHeal(amount);
      ['poison', 'blind'].forEach((status) => actor.removeStatus(status));
      return { valid: true, action, targets: [actor], results: [{ type: 'heal', targetUid: actor.uid, amount: healed }, { type: 'cleanse', targetUid: actor.uid, statuses: ['poison', 'blind'] }] };
    }
    case 'calm': {
      const calmable = target && !target.heavy && [...(target.creatureTypes ?? [])].some((type) => ['beast', 'magic_beast'].includes(type));
      if (!calmable) return { valid: true, action, targets, results: [resultLabel(actor, `${target?.name ?? '敵'}には なだめるが効かない！`)] };
      const derived = { ...action, kind: 'status', specialCommand: null, statuses: ['stop'], statusChance: 1 };
      return { valid: true, action: derived, targets, results: resolveAction({ actor, action: derived, targets, battleUnits: manager.units }) };
    }
    case 'control':
      if (target?.heavy || target?.statusImmunities?.has('confuse')) return { valid: true, action, targets, results: [resultLabel(actor, `${target.name}は あやつれない！`)] };
      return { valid: true, action, targets, results: resolveAction({ actor, action: { ...action, kind: 'status', statuses: ['confuse'], statusChance: actor.equipmentEffects?.controlBoost ? 0.8 : 0.4 }, targets, battleUnits: manager.units }) };
    case 'catch': {
      const threshold = actor.equipmentEffects?.catchBoost ? 0.5 : 0.125;
      if (!target || target.heavy || target.hpRatio() > threshold) return { valid: true, action, targets, results: [resultLabel(actor, `${target?.name ?? '敵'}は とらえられない！`)] };
      actor.capturedMonster = { id: target.id, name: target.name, level: target.level, atk: target.atk, magic: target.magic };
      target.removedFromBattle = true;
      return { valid: true, action, targets, results: [{ type: 'captured', targetUid: target.uid, label: `${target.name}を とらえた！` }] };
    }
    case 'release': {
      const captured = actor.capturedMonster;
      if (!captured) return { valid: false, reason: 'はなせるモンスターがいない。' };
      actor.capturedMonster = null;
      const derived = {
        ...action,
        id: `release-${captured.id}`,
        name: `${captured.name}を はなつ`,
        kind: 'magic-attack',
        specialCommand: null,
        ff5Power: Math.max(30, Math.min(180, (captured.atk ?? 20) + Math.floor((captured.level ?? 1) / 2))),
        formula: 'ff5_magic',
        mpCost: 0,
        target: 'all_enemies',
      };
      const releaseTargets = livingEnemies(manager, actor);
      return { valid: true, action: derived, targets: releaseTargets, results: resolveAction({ actor, action: derived, targets: releaseTargets, battleUnits: manager.units }) };
    }
    case 'sing': {
      actor.singing = { ...action };
      return { valid: true, action, targets: livingAllies(manager, actor), results: applySongStep(manager, actor, action), remember: false };
    }
    case 'hide':
      actor.hidden = !actor.hidden;
      return { valid: true, action: { ...action, name: actor.hidden ? 'かくれる' : 'あらわれる' }, targets: [actor], results: [{ type: actor.hidden ? 'hidden' : 'revealed', targetUid: actor.uid }] };
    default:
      return { valid: false, reason: '特殊コマンドの処理が見つからない。' };
  }
}

// ---- src/ui/MessageWindow.js ----
const MAX_QUEUE_LENGTH = 80;

class MessageWindow {
  constructor(windowEl, textEl) {
    this.windowEl = windowEl;
    this.textEl = textEl;
    this.hideTimer = null;
    this.advanceTimer = null;
    this.queue = [];
    this.isShowing = false;
    this.currentDeadline = 0;
  }

  show(text) {
    if (!text) return;
    this.queue.push(String(text));
    // An action may produce several result lines. Keep the whole action journal
    // visible instead of dropping its opening lines while the battle races on.
    if (this.queue.length > MAX_QUEUE_LENGTH) this.queue.splice(MAX_QUEUE_LENGTH);
    if (!this.isShowing) this.showNext();
    return this.remainingDurationMs();
  }

  showNext() {
    const text = this.queue.shift();
    if (!text) {
      this.hide();
      return;
    }
    this.isShowing = true;
    this.textEl.textContent = text;
    this.windowEl.classList.remove('hidden', 'message-enter');
    // Force a fresh transition when several combat messages arrive together.
    requestAnimationFrame(() => this.windowEl.classList.add('message-enter'));
    clearTimeout(this.hideTimer);
    // Read the current speed setting on every message so a mid-battle
    // change in Options takes effect immediately, without needing to
    // reset or recreate the message window.
    const { holdMs: HOLD_MS, fastHoldMs: FAST_HOLD_MS, betweenMs: BETWEEN_MESSAGES_MS } = getMessageSpeedTiming();
    const holdMs = this.queue.length ? FAST_HOLD_MS : HOLD_MS;
    this.currentDeadline = Date.now() + holdMs;
    this.hideTimer = setTimeout(() => {
      this.windowEl.classList.remove('message-enter');
      this.isShowing = false;
      if (this.queue.length) this.advanceTimer = setTimeout(() => this.showNext(), BETWEEN_MESSAGES_MS);
      else this.hide();
    }, holdMs);
  }

  hide() {
    clearTimeout(this.hideTimer);
    clearTimeout(this.advanceTimer);
    this.isShowing = false;
    this.currentDeadline = 0;
    this.windowEl.classList.add('hidden');
  }

  remainingDurationMs() {
    const timing = getMessageSpeedTiming();
    let remaining = this.isShowing ? Math.max(0, this.currentDeadline - Date.now()) : 0;
    if (this.isShowing && this.queue.length) remaining += timing.betweenMs;
    this.queue.forEach((_text, index) => {
      const remainingAfter = this.queue.length - index - 1;
      remaining += remainingAfter ? timing.fastHoldMs : timing.holdMs;
      if (remainingAfter) remaining += timing.betweenMs;
    });
    return remaining;
  }

  reset() {
    clearTimeout(this.hideTimer);
    clearTimeout(this.advanceTimer);
    this.queue.length = 0;
    this.isShowing = false;
    this.currentDeadline = 0;
    this.textEl.textContent = '';
    this.windowEl.classList.remove('message-enter');
    this.windowEl.classList.add('hidden');
  }
}

// ---- src/battle/BattleManager.js ----
const ENEMY_TURN_DELAY_MS = 900;
const AUTO_ADVANCE_DELAY_MS = 550;
// FFV resets the enemy ATB interval after every ordinary command. A powerful
// spell does not make the next gauge 1.2x or 1.55x longer; animation pacing is
// already handled by the presentation gate.
const FF5_ENEMY_TURN_COST = 1;

function cloneSerializable(value, fallback) {
  try {
    return structuredClone(value);
  } catch {
    try {
      return JSON.parse(JSON.stringify(value));
    } catch {
      return fallback;
    }
  }
}

function snapshotUnit(unit) {
  return {
    id: unit.id,
    name: unit.name,
    isEnemy: unit.isEnemy,
    role: unit.role,
    spriteUrl: unit.spriteUrl,
    effectAnchor: cloneSerializable(unit.effectAnchor, null),
    maxHp: unit.maxHp,
    hp: unit.hp,
    maxMp: unit.maxMp,
    mp: unit.mp,
    atk: unit.atk,
    monsterM: unit.monsterM,
    def: unit.def,
    magicDef: unit.magicDef,
    magic: unit.magic,
    agility: unit.agility,
    evasion: unit.evasion,
    weakness: unit.weakness,
    resist: unit.resist,
    weaponElement: unit.weaponElement,
    weaponAccuracy: unit.weaponAccuracy,
    weaponSpecial: unit.weaponSpecial,
    weaponId: unit.weaponId,
    weaponAttack: unit.weaponAttack,
    weaponType: unit.weaponType,
    hasBrawl: unit.hasBrawl,
    strength: unit.strength,
    vitality: unit.vitality,
    baseAtk: unit.baseAtk,
    baseDef: unit.baseDef,
    baseMagicDef: unit.baseMagicDef,
    baseMagic: unit.baseMagic,
    baseAgility: unit.baseAgility,
    equipmentEffects: cloneSerializable(unit.equipmentEffects, {}),
    physicalDamageMultiplier: unit.physicalDamageMultiplier,
    magicDamageMultiplier: unit.magicDamageMultiplier,
    imageHits: unit.imageHits,
    nextAttackMultiplier: unit.nextAttackMultiplier,
    physicalBarrier: unit.physicalBarrier,
    statuses: [...unit.statuses],
    statusDurations: [...unit.statusDurations],
    permanentStatuses: [...(unit.permanentStatuses ?? [])],
    statusImmunities: [...unit.statusImmunities],
    statusResistance: unit.statusResistance,
    temporaryNullElements: [...(unit.temporaryNullElements ?? [])],
    elementalPower: Boolean(unit.elementalPower),
    level: unit.level,
    equippedAbilitySet: unit.equippedAbilitySet,
    equipment: cloneSerializable(unit.equipment, {}),
    abilityId: unit.abilityId,
    crystalShardId: unit.crystalShardId,
    crystalShardTechniqueIds: [...(unit.crystalShardTechniqueIds ?? [])],
    size: unit.size,
    ai: unit.ai,
    counterOnHit: cloneSerializable(unit.counterOnHit, null),
    creatureTypes: [...unit.creatureTypes],
    row: unit.row,
    heavy: unit.heavy,
    isUndead: unit.isUndead,
    removedFromBattle: unit.removedFromBattle,
    hidden: unit.hidden,
    pendingJump: cloneSerializable(unit.pendingJump, null),
    capturedMonster: cloneSerializable(unit.capturedMonster, null),
    singing: cloneSerializable(unit.singing, null),
    weaponSpellblade: cloneSerializable(unit.weaponSpellblade, null),
    stolen: unit.stolen,
    ctValue: unit.ctValue,
    defending: unit.defending,
    magicList: cloneSerializable(unit.magicList, []),
  };
}

function restoreUnit(snapshot) {
  const unit = new Unit({
    ...snapshot,
    equipmentEffects: cloneSerializable(snapshot.equipmentEffects, {}),
    equipment: cloneSerializable(snapshot.equipment, {}),
    statuses: snapshot.statuses ?? [],
    statusDurations: snapshot.statusDurations ?? [],
    permanentStatuses: snapshot.permanentStatuses ?? [],
    statusImmunities: snapshot.statusImmunities ?? [],
    temporaryNullElements: snapshot.temporaryNullElements ?? [],
    elementalPower: Boolean(snapshot.elementalPower),
    creatureTypes: snapshot.creatureTypes ?? [],
    magicList: cloneSerializable(snapshot.magicList, []),
  });
  unit.physicalDamageMultiplier = snapshot.physicalDamageMultiplier ?? unit.physicalDamageMultiplier;
  unit.magicDamageMultiplier = snapshot.magicDamageMultiplier ?? 1;
  unit.imageHits = snapshot.imageHits ?? 0;
  unit.nextAttackMultiplier = snapshot.nextAttackMultiplier ?? 1;
  unit.physicalBarrier = snapshot.physicalBarrier ?? 0;
  unit.removedFromBattle = Boolean(snapshot.removedFromBattle);
  unit.defending = Boolean(snapshot.defending);
  return unit;
}

class BattleManager {
  constructor(partyUnits, bossUnit, options = {}) {
    this.party = partyUnits;
    this.boss = bossUnit;
    this.units = [...partyUnits, bossUnit];
    this.ctb = new CTBEngine(this.units);

    this.currentActor = null;
    this.awaitingPlayerInput = false;
    this.finished = false;
    this.result = null; // 'victory' | 'defeat'
    this.logSequence = 0;
    this.logJournal = [];
    this.pendingEnemyActions = new Map();
    this.bossPhase = 0;
    this.bossIntel = { hp: false, mp: false, weakness: false, status: false, level: false };
    this.presentationHoldUntil = 0;
    this.battleEndTimer = null;
    this.itemStockProvider = options.getItemStock ?? (() => Infinity);
    this.itemConsumer = options.consumeItem ?? (() => true);
    this.itemAdder = options.addItemStock ?? (() => true);
    this.gilProvider = options.getGil ?? (() => 0);
    this.gilConsumer = options.spendGil ?? (() => false);
    this.lastPartyAction = null;
    this.magicLampUse = 0;
    this.enemyActionCursor = 0;
  }

  createSnapshot() {
    const currentActorIndex = this.currentActor ? this.units.indexOf(this.currentActor) : -1;
    return {
      version: 1,
      partyLength: this.party.length,
      units: this.units.map(snapshotUnit),
      currentActorIndex,
      awaitingPlayerInput: this.awaitingPlayerInput,
      bossPhase: this.bossPhase,
      bossIntel: cloneSerializable(this.bossIntel, {}),
      logSequence: this.logSequence,
      logJournal: cloneSerializable(this.logJournal, []),
      pendingEnemyActions: [...this.pendingEnemyActions.entries()].map(([uid, action]) => [
        this.units.findIndex((unit) => unit.uid === uid),
        cloneSerializable(action, null),
      ]).filter(([index, action]) => index >= 0 && action),
      // Unit uids are recreated while restoring a suspended battle. Persist
      // target indexes as the stable reference so Mimic keeps the exact
      // original targets after a task-kill/resume cycle.
      lastPartyAction: this.lastPartyAction ? {
        action: cloneSerializable(this.lastPartyAction.action, null),
        targetIndexes: (this.lastPartyAction.targetIds ?? [])
          .map((uid) => this.units.findIndex((unit) => unit.uid === uid))
          .filter((index) => index >= 0),
      } : null,
      magicLampUse: this.magicLampUse,
      enemyActionCursor: this.enemyActionCursor,
    };
  }

  static fromSnapshot(snapshot, options = {}) {
    if (!snapshot || snapshot.version !== 1 || !Array.isArray(snapshot.units)) {
      throw new Error('Invalid battle suspend snapshot');
    }
    const units = snapshot.units.map(restoreUnit);
    const partyLength = Math.max(1, Math.min(units.length - 1, Number(snapshot.partyLength) || units.length - 1));
    const manager = new BattleManager(units.slice(0, partyLength), units[partyLength], options);
    manager.currentActor = units[snapshot.currentActorIndex] ?? null;
    manager.awaitingPlayerInput = Boolean(snapshot.awaitingPlayerInput && manager.currentActor && !manager.currentActor.isEnemy);
    manager.bossPhase = Math.max(0, Number(snapshot.bossPhase) || 0);
    manager.bossIntel = {
      hp: Boolean(snapshot.bossIntel?.hp),
      mp: Boolean(snapshot.bossIntel?.mp),
      weakness: Boolean(snapshot.bossIntel?.weakness),
      status: Boolean(snapshot.bossIntel?.status),
      level: Boolean(snapshot.bossIntel?.level),
    };
    manager.logSequence = Math.max(0, Number(snapshot.logSequence) || 0);
    manager.logJournal = Array.isArray(snapshot.logJournal) ? snapshot.logJournal.slice(-80) : [];
    manager.pendingEnemyActions = new Map((snapshot.pendingEnemyActions ?? []).flatMap(([index, action]) => {
      const unit = units[index];
      return unit && action ? [[unit.uid, action]] : [];
    }));
    manager.lastPartyAction = snapshot.lastPartyAction ? {
      action: cloneSerializable(snapshot.lastPartyAction.action, null),
      targetIds: (snapshot.lastPartyAction.targetIndexes ?? [])
        .map((index) => units[index]?.uid)
        .filter(Boolean),
    } : null;
    manager.magicLampUse = Math.max(0, Number(snapshot.magicLampUse) || 0);
    manager.enemyActionCursor = Math.max(0, Number(snapshot.enemyActionCursor) || 0);
    return manager;
  }

  resume() {
    if (this.checkBattleEnd()) return;
    this.presentationHoldUntil = 0;
    this.broadcastState();
    const actor = this.currentActor;
    if (!actor) {
      this.awaitingPlayerInput = false;
      this.scheduleNextTurn(350);
      return;
    }
    if (this.awaitingPlayerInput && !actor.isEnemy) {
      eventBus.emit('battle:playerTurn', { actor });
      return;
    }
    this.beginActorTurn(actor);
  }

  itemId(itemOrId) {
    return typeof itemOrId === 'string' ? itemOrId : itemOrId?.sourceId ?? itemOrId?.id ?? '';
  }

  getItemStock(itemOrId) {
    const stock = Number(this.itemStockProvider(this.itemId(itemOrId), itemOrId));
    return Number.isFinite(stock) ? Math.max(0, Math.floor(stock)) : Infinity;
  }

  canUseItem(itemOrId) {
    return this.getItemStock(itemOrId) > 0;
  }

  getItemUseState(itemOrId) {
    const stock = this.getItemStock(itemOrId);
    return Object.freeze({ stock, usable: stock > 0, reason: stock > 0 ? null : '在庫がない。' });
  }

  consumeItemStock(itemOrId, amount = 1) {
    if (this.getItemStock(itemOrId) < amount) return false;
    return this.itemConsumer(this.itemId(itemOrId), amount, itemOrId) !== false;
  }

  log(text, kind = 'info') {
    const entry = Object.freeze({ id: ++this.logSequence, text, kind, timestamp: Date.now() });
    this.logJournal.push(entry);
    if (this.logJournal.length > 80) this.logJournal.shift();
    eventBus.emit('battle:log', text);
    eventBus.emit('battle:logEntry', entry);
    return entry;
  }

  emitActionResolved(actor, results, fromSequence = 0, action = null) {
    const entries = this.logJournal.filter((entry) => entry.id > fromSequence);
    const presentationResults = results.map((result) => {
      const target = this.units.find((unit) => unit.uid === result.targetUid);
      return target ? { ...result, presentationPatch: result.presentationPatch ?? { uid: target.uid, ...snapshotUnit(target) } } : { ...result };
    });
    eventBus.emit('battle:actionResolved', { actor, action, results: presentationResults, logEntries: entries });
    eventBus.emit('battle:logBatch', { actorUid: actor.uid, entries });
  }

  broadcastState() {
    eventBus.emit('battle:stateUpdate', {
      party: this.party,
      boss: this.boss,
      preview: this.ctb.previewQueue(8),
    });
  }

  addItemStock(itemOrId, amount = 1) {
    return this.itemAdder(this.itemId(itemOrId), amount, itemOrId) !== false;
  }

  getGil() { return Math.max(0, Math.floor(Number(this.gilProvider()) || 0)); }

  spendGil(amount) { return this.gilConsumer(Math.max(0, Math.floor(amount))) !== false; }

  revealBossIntel(action, target = this.boss) {
    if (!target || target.uid !== this.boss.uid || action?.kind !== 'scan') return false;
    const actionKey = [action.id, action.sourceId, action.visualId, action.name]
      .filter(Boolean)
      .join(' ')
      .toLowerCase();
    const detailed = /libra|scan|ライブラ|みやぶる/.test(actionKey);
    this.bossIntel.hp = true;
    if (detailed) {
      this.bossIntel.mp = true;
      this.bossIntel.weakness = true;
      this.bossIntel.status = true;
      this.bossIntel.level = true;
    }
    return true;
  }

  start() {
    this.log(`${this.boss.name} が あらわれた！`);
    this.broadcastState();
    this.scheduleNextTurn(400);
  }

  deferNextTurnFor(durationMs = 0) {
    const safeDuration = Math.max(0, Number(durationMs) || 0);
    this.presentationHoldUntil = Math.max(this.presentationHoldUntil, Date.now() + safeDuration);
  }

  scheduleNextTurn(delay = AUTO_ADVANCE_DELAY_MS) {
    if (this.finished) return;
    const presentationDelay = Math.max(0, this.presentationHoldUntil - Date.now());
    setTimeout(() => this.advanceTurn(), Math.max(delay, presentationDelay));
  }

  checkBattleEnd() {
    if (this.finished) return true;
    const finish = (result, message) => {
      this.finished = true;
      this.result = result;
      clearTimeout(this.battleEndTimer);
      let announced = false;
      const settleThenEnd = () => {
        const remaining = Math.max(0, this.presentationHoldUntil - Date.now());
        if (remaining > 0) {
          this.battleEndTimer = setTimeout(settleThenEnd, remaining + 20);
          return;
        }
        if (!announced) {
          announced = true;
          // battle:log listeners synchronously extend presentationHoldUntil
          // for the victory/defeat message. Re-check it before emitting end.
          this.log(message);
          this.battleEndTimer = setTimeout(settleThenEnd, 20);
          return;
        }
        this.battleEndTimer = null;
        eventBus.emit('battle:end', { result });
      };
      this.battleEndTimer = setTimeout(settleThenEnd, 120);
      return true;
    };
    if (!this.boss.isAlive() || this.boss.removedFromBattle || this.boss.statuses.has('petrify')) {
      return finish('victory', `${this.boss.name} を たおした！`);
    }
    if (this.party.every((p) => !p.isAlive() || p.removedFromBattle || p.statuses.has('petrify'))) {
      return finish('defeat', 'パーティは ぜんめつした...');
    }
    return false;
  }

  advanceTurn() {
    if (this.finished) return;
    const presentationDelay = Math.max(0, this.presentationHoldUntil - Date.now());
    if (presentationDelay > 0) {
      this.scheduleNextTurn(presentationDelay);
      return;
    }
    this.presentationHoldUntil = 0;
    const actor = this.ctb.advanceToNextActor();
    if (!actor) return;
    this.currentActor = actor;

    // Stop freezes a unit's own CTB gauge (effectiveAgility -> 0), so its own
    // turn never comes around again on its own — meaning the normal
    // "decrement duration when it's your turn" tick would never fire and
    // Stop would never wear off. FF5's Stop instead runs down over the
    // course of *other* units' turns, so tick it here, once per turn taken
    // by anyone else, independently of the frozen unit's own (frozen) CTB.
    this.units.forEach((unit) => {
      if (unit === actor || !unit.isAlive() || !unit.statuses.has('stop')) return;
      if (unit.permanentStatuses?.has('stop')) return;
      const remaining = (unit.statusDurations.get('stop') ?? 1) - 1;
      if (remaining <= 0) {
        unit.removeStatus('stop');
        this.log(`${unit.name} の ${statusLabels(['stop'])} が切れた。`);
      } else {
        unit.statusDurations.set('stop', remaining);
      }
    });

    const tickAction = { id: 'status-tick', name: '継続効果', kind: 'status-tick' };
    const tickActionStartSequence = this.logSequence;
    const tickResults = actor.processTurnStatuses();
    if (tickResults.length) eventBus.emit('battle:actionStarted', { actor, action: tickAction });
    tickResults.forEach((result) => {
      if (result.type === 'status-damage') this.log(`${actor.name} は ${statusLabels([result.status])}で ${result.amount} ダメージ！`);
      if (result.type === 'status-heal' && result.amount > 0) this.log(`${actor.name} の HPが ${result.amount} 回復した。`);
      if (result.type === 'doom') this.log(`${actor.name} は死の宣告に倒れた！`);
      if (result.type === 'status-expired' && result.status !== 'doom') this.log(`${actor.name} の ${statusLabels([result.status])} が切れた。`);
    });
    if (tickResults.length) this.emitActionResolved(actor, tickResults, tickActionStartSequence, tickAction);
    if (this.checkBattleEnd()) return;

    const statusMessageDelay = Math.max(0, this.presentationHoldUntil - Date.now());
    if (tickResults.length && statusMessageDelay > 0) {
      setTimeout(() => this.beginActorTurn(actor), statusMessageDelay);
      return;
    }
    this.beginActorTurn(actor);
  }

  beginActorTurn(actor) {
    if (this.finished || this.currentActor !== actor) return;

    // Reset defend stance at the start of a unit's own turn.
    actor.defending = false;
    actor.physicalDamageMultiplier = actor.equipmentEffects?.physicalDamageMultiplier ?? 1;

    if (actor.pendingJump) {
      this.resolveJumpLanding(actor);
    } else if (isIncapacitated(actor)) {
      this.log(`${actor.name} は動けない！`);
      this.ctb.consumeTurn(actor, 0.45);
      this.currentActor = null;
      this.broadcastState();
      this.scheduleNextTurn(260);
    } else if (actor.singing) {
      const actionStartSequence = this.logSequence;
      const action = { ...actor.singing, specialCommand: 'sing' };
      eventBus.emit('battle:actionStarted', { actor, action });
      this.log(`${actor.name} は ${action.name}を歌い続けている。`);
      const special = resolveFF5SpecialCommand({ manager: this, actor, action, targets: this.party });
      const results = special.results ?? [];
      this.emitActionResolved(actor, results, actionStartSequence, action);
      this.ctb.consumeTurn(actor, action.ctbCost ?? 1.15);
      this.currentActor = null;
      this.broadcastState();
      if (!this.checkBattleEnd()) this.scheduleNextTurn();
    } else if (actor.statuses.has('berserk') || actor.statuses.has('confuse')) {
      this.broadcastState();
      setTimeout(() => this.forcedAct(actor), 360);
    } else if (actor.isEnemy) {
      this.broadcastState();
      setTimeout(() => this.enemyAct(actor), ENEMY_TURN_DELAY_MS);
    } else {
      this.awaitingPlayerInput = true;
      this.broadcastState();
      eventBus.emit('battle:playerTurn', { actor });
    }
  }

  resolveJumpLanding(actor) {
    const pending = actor.pendingJump;
    actor.pendingJump = null;
    actor.hidden = false;
    const target = this.units.find((unit) => unit.uid === pending?.targetUid && unit.isAlive())
      ?? this.units.find((unit) => unit.isAlive() && unit.isEnemy !== actor.isEnemy);
    if (!target) { this.currentActor = null; this.scheduleNextTurn(); return; }
    const actionStartSequence = this.logSequence;
    const action = { ...pending.action, name: 'ジャンプ' };
    eventBus.emit('battle:actionStarted', { actor, action });
    this.log(`${actor.name} の ジャンプ！`);
    const results = resolveAction({ actor, action, targets: [target], battleUnits: this.units });
    results.filter((result) => result.type === 'damage').forEach((result) => this.log(`${target.name} に ${result.amount} の ダメージ！`));
    this.emitActionResolved(actor, results, actionStartSequence, action);
    this.ctb.consumeTurn(actor, 1);
    this.currentActor = null;
    this.broadcastState();
    if (!this.checkBattleEnd()) this.scheduleNextTurn();
  }

  forcedAct(actor) {
    const confused = actor.statuses.has('confuse');
    const candidates = this.units.filter((unit) => unit.isAlive() && !unit.hidden && !unit.removedFromBattle && (confused || unit.isEnemy !== actor.isEnemy));
    const target = candidates[Math.floor(Math.random() * candidates.length)];
    if (!target) return this.scheduleNextTurn();
    const action = { kind: 'physical-attack', name: 'こうげき' };
    const actionStartSequence = this.logSequence;
    eventBus.emit('battle:actionStarted', { actor, action });
    this.log(`${actor.name} は${confused ? '混乱して' : '狂戦士となり'} ${target.name} を攻撃！`);
    const results = resolveAction({ actor, action, targets: [target], battleUnits: this.units });
    results.filter((result) => result.type === 'damage').forEach((result) => this.log(`${target.name} に ${result.amount} の ダメージ！`));
    this.emitActionResolved(actor, results, actionStartSequence, action);
    this.ctb.consumeTurn(actor, 1);
    this.currentActor = null;
    this.broadcastState();
    if (!this.checkBattleEnd()) this.scheduleNextTurn();
  }

  /** Simple AI: picks a target based on the boss's `ai` behaviour tag. */
  pickEnemyTarget() {
    const aliveParty = this.party.filter((p) => p.isAlive() && !p.hidden && !p.removedFromBattle);
    if (aliveParty.length === 0) return null;

    switch (this.boss.ai) {
      case 'lowestHp':
        return aliveParty.reduce((a, b) => (a.hp < b.hp ? a : b));
      case 'aggressive':
        return aliveParty.reduce((a, b) => (a.atk > b.atk ? a : b));
      case 'random':
      default:
        return aliveParty[Math.floor(Math.random() * aliveParty.length)];
    }
  }

  /**
   * Resolves and presents a single enemy action against its target(s),
   * including the enemy-side mirror of Reflect redirection (a reflectable
   * move cast at a target with Reflect bounces to the opposite side, same
   * as the player-cast path in submitPlayerAction).
   */
  performEnemyAction(actor, action, fallbackTarget) {
    let targets = action.target === 'all_enemies'
      ? this.party.filter((unit) => unit.isAlive() && !unit.hidden && !unit.removedFromBattle)
      : [fallbackTarget];
    if (!targets.length || !targets[0]) return [];

    if (action.reflectable) {
      targets = targets.map((target) => {
        if (!target.statuses?.has('reflect')) return target;
        const reflected = this.units.filter((unit) => unit.isAlive() && unit.isEnemy === actor.isEnemy);
        const redirect = reflected[Math.floor(Math.random() * reflected.length)] ?? actor;
        this.log(`${target.name} のリフレク！ ${redirect.name} へ反射した！`);
        return redirect;
      });
    }

    const actionStartSequence = this.logSequence;
    eventBus.emit('battle:actionStarted', { actor, action });
    this.log(`${actor.name} の ${action.name ?? 'こうげき'}！`, action.power >= 2 ? 'danger' : 'action');
    const results = action.kind === 'physical-attack' && targets.length > 1
      ? targets.flatMap((eachTarget) => resolveAction({ actor, action, targets: [eachTarget], battleUnits: this.units }))
      : resolveAction({ actor, action, targets, battleUnits: this.units });

    results.forEach((r) => {
      const affected = this.units.find((unit) => unit.uid === r.targetUid) ?? fallbackTarget;
      if (r.type === 'damage') {
        this.log(`${affected.name} に ${r.amount} の ダメージ！`);
      } else if (r.type === 'miss') {
        this.log(`${actor.name} の こうげきは はずれた！`);
      } else if (r.type === 'blocked') {
        this.log(`${affected.name} は こうげきを ふせいだ！`);
      }
    });

    this.emitActionResolved(actor, results, actionStartSequence, action);
    return results;
  }

  enemyAct(actor) {
    if (this.finished) return;
    const target = this.pickEnemyTarget();
    if (!target) {
      this.log(`${actor.name} は攻撃対象を見失った。`);
      this.ctb.consumeTurn(actor, 1);
      this.currentActor = null;
      this.broadcastState();
      if (!this.checkBattleEnd()) this.scheduleNextTurn();
      return;
    }

    const pendingAction = this.pendingEnemyActions.get(actor.uid);
    if (pendingAction) this.pendingEnemyActions.delete(actor.uid);
    const scriptedAction = pendingAction ?? nextBossActionFor(actor, this.enemyActionCursor);

    // Turns with two actions in a row (e.g. Omega's turn-5 "2回攻撃").
    if (scriptedAction.multi?.length) {
      scriptedAction.multi.forEach((subAction) => {
        if (!this.boss.isAlive()) return;
        const subTarget = subAction.target === 'all_enemies' ? target : this.pickEnemyTarget();
        if (!subTarget && subAction.target !== 'all_enemies') return;
        this.performEnemyAction(actor, subAction, subTarget ?? target);
      });
      this.enemyActionCursor += 1;
      this.ctb.consumeTurn(actor, FF5_ENEMY_TURN_COST);
      this.currentActor = null;
      this.broadcastState();
      if (this.checkBattleEnd()) return;
      this.scheduleNextTurn();
      return;
    }

    const chosenAction = pendingAction ?? (actor.canAffordMp(scriptedAction.mpCost ?? 0) ? scriptedAction : { id: 'enemy-attack', name: 'こうげき', kind: 'physical-attack' });
    if (chosenAction.telegraph && !pendingAction) {
      const preparedAction = { ...chosenAction, telegraph: null };
      this.pendingEnemyActions.set(actor.uid, preparedAction);
      this.log(`${actor.name}：${chosenAction.telegraph}`, 'telegraph');
      eventBus.emit('battle:telegraph', { actor, action: preparedAction, hint: chosenAction.telegraph });
      this.ctb.consumeTurn(actor, 0.5);
      this.currentActor = null;
      this.broadcastState();
      this.scheduleNextTurn(420);
      return;
    }

    this.performEnemyAction(actor, chosenAction, target);
    this.enemyActionCursor += 1;
    this.ctb.consumeTurn(actor, FF5_ENEMY_TURN_COST);
    this.currentActor = null;
    this.broadcastState();

    if (this.checkBattleEnd()) return;
    this.scheduleNextTurn();
  }

  /**
   * Some bosses (e.g. Omega) always retaliate with a burst of counter-moves
   * immediately after taking damage, independent of the CTB turn order.
   * Faithful to the source game's "反撃行動: 2つ選んで行動" pattern — each
   * of the `times` slots draws from its own fixed pool (Omega's 1st counter
   * is ロケットパンチ/マスタードボム, the 2nd is ロケットパンチ/サークル).
   */
  resolveCounterAttacks(originalActor) {
    const counterSequence = counterSequenceFor(this.boss);
    const counterConfig = this.boss.counterOnHit;
    if (!counterSequence.length || !counterConfig || !this.boss.isAlive()) return;
    // Faithful to the source game: a boss frozen by Stop (or otherwise
    // incapacitated — paralyzed, asleep, petrified) cannot act at all,
    // including its automatic counterattack.
    if (isIncapacitated(this.boss)) return;
    if (Math.random() > (counterConfig.chance ?? 1)) return;

    const times = Math.min(counterConfig.times ?? 1, counterSequence.length);
    for (let i = 0; i < times; i += 1) {
      const aliveParty = this.party.filter((unit) => unit.isAlive() && !unit.hidden && !unit.removedFromBattle);
      if (!aliveParty.length || !this.boss.isAlive()) break;
      const slot = counterSequence[i];
      const pick = slot?.choices?.length ? slot.choices[Math.floor(Math.random() * slot.choices.length)] : slot;
      if (!pick) continue;
      const counterAction = { ...pick, isCounterAction: true };
      const focusTarget = aliveParty.includes(originalActor) ? originalActor : aliveParty[Math.floor(Math.random() * aliveParty.length)];
      const counterTargets = counterAction.target === 'all_enemies' ? aliveParty : [focusTarget];

      const actionStartSequence = this.logSequence;
      eventBus.emit('battle:actionStarted', { actor: this.boss, action: counterAction });
      this.log(`${this.boss.name} の反撃！ ${counterAction.name}！`, 'counter');
      const results = resolveAction({ actor: this.boss, action: counterAction, targets: counterTargets, battleUnits: this.units });
      results.forEach((r) => {
        const affected = this.units.find((unit) => unit.uid === r.targetUid);
        if (r.type === 'damage') this.log(`${affected?.name ?? '???'} に ${r.amount} の ダメージ！`, 'counter');
        else if (r.type === 'status') this.log(`${affected?.name ?? '???'} に ${statusLabels(r.statuses) || '特殊効果'}！`, 'counter');
        else if (r.type === 'status-resist') this.log(`${affected?.name ?? '???'} は ${statusLabels(r.statuses)} を防いだ！`, 'counter');
        else if (r.type === 'removed') this.log(`${affected?.name ?? '???'} は戦場から消え去った！`, 'counter');
      });
      this.emitActionResolved(this.boss, results, actionStartSequence, counterAction);
    }
    this.broadcastState();
  }

  /**
   * Called by the UI once the player has picked a command (+ target).
   * `choice` shape: { kind, name, ctbCost, element, power, mpCost, healAmount }
   */
  submitPlayerAction(choice, targetUnit) {
    if (!this.awaitingPlayerInput || !this.currentActor) return;
    const actor = this.currentActor;
    const actionStartSequence = this.logSequence;

    let action;
    let targets;
    const resolveTargets = (targetId, fallback) => {
      if (targetId === 'self') return [actor];
      if (['all_allies', 'party'].includes(targetId)) {
        const revive = (choice.spell?.operations ?? choice.ability?.operations ?? choice.item?.operations ?? []).some((operation) => operation.op === 'revive');
        return this.party.filter((unit) => revive ? !unit.isAlive() : unit.isAlive());
      }
      if (['all_enemies', 'enemy_group'].includes(targetId)) return this.units.filter((unit) => unit.isAlive() && unit.isEnemy !== actor.isEnemy);
      if (targetId === 'all_units' || targetId === 'enemy_and_party') return this.units.filter((unit) => unit.isAlive());
      if (targetId === 'enemy_group_and_ally') return [this.boss, fallback ?? actor];
      if (targetId === 'random_unit') {
        const alive = this.units.filter((unit) => unit.isAlive());
        return [alive[Math.floor(Math.random() * alive.length)]];
      }
      return [fallback ?? (String(targetId).includes('ally') ? actor : this.boss)];
    };

    switch (choice.type) {
      case 'attack':
        action = { kind: 'physical-attack' };
        targets = [targetUnit ?? this.boss];
        this.log(`${actor.name} の こうげき！`);
        break;
      case 'magic':
        action = {
          kind: choice.spell.actionKind ?? (choice.spell.healAmount !== undefined && choice.spell.power === undefined
            ? 'heal'
            : 'magic-attack'),
          ...choice.spell,
        };
        targets = resolveTargets(choice.spell.target, targetUnit ?? (action.kind === 'heal' ? actor : this.boss));
        this.log(`${actor.name} の ${choice.spell.name}！`);
        break;
      case 'ability':
        action = {
          kind: choice.ability.actionKind ?? (choice.ability.healAmount !== undefined ? 'heal' : 'magic-attack'),
          ...choice.ability,
        };
        targets = resolveTargets(choice.ability.target, targetUnit);
        this.log(`${actor.name} の ${choice.ability.name}！`);
        break;
      case 'crystal': {
        const shard = choice.shard;
        action = {
          kind: shard.actionKind ?? 'magic-attack',
          ...shard,
          operations: shard.operations ?? shard.battle?.operations,
        };
        targets = resolveTargets(shard.target ?? shard.battle?.target?.id ?? 'one_enemy', targetUnit);
        this.log(`${actor.name} のえんばんせき ${shard.name ?? shard.techniqueNameJa}！`);
        break;
      }
      case 'item':
        if (!this.canUseItem(choice.item)) {
          this.log(`${choice.item.name ?? 'アイテム'} の在庫がない！`);
          return false;
        }
        action = (choice.item.operations ?? choice.item.battle?.operations)?.length
          ? { ...choice.item, operations: choice.item.operations ?? choice.item.battle.operations, kind: choice.item.actionKind ?? 'scripted' }
          : { kind: 'heal', healAmount: choice.item.healAmount };
        targets = resolveTargets(choice.item.target ?? choice.item.battle?.target?.id, targetUnit ?? actor);
        if (choice.item.sourceId === 'item_magic_lamp' || choice.item.id === 'item_magic_lamp') {
          const lampOrder = ['magic_bahamut', 'magic_leviathan', 'magic_phoenix', 'magic_odin', 'magic_syldra', 'magic_carbuncle', 'magic_catoblepas', 'magic_golem', 'magic_titan', 'magic_ifrit', 'magic_ramuh', 'magic_shiva', 'magic_remora', 'magic_sylph', 'magic_chocobo'];
          const summonId = lampOrder[Math.min(this.magicLampUse, lampOrder.length - 1)];
          const summon = Object.values(magicSets).flat().find((spell) => spell.sourceId === summonId);
          if (summon) {
            this.magicLampUse += 1;
            action = { ...summon, kind: summon.actionKind, mpCost: 0, name: `${choice.item.name}：${summon.name}` };
            targets = resolveTargets(summon.target, this.boss);
          }
        }
        this.log(`${actor.name} は ${choice.item.name} を つかった！`);
        break;
      case 'defend':
        action = { kind: 'defend' };
        targets = [actor];
        this.log(`${actor.name} は みをまもっている。`);
        break;
      default:
        return false;
    }

    if (!actor.canAffordMp(action.mpCost ?? 0)) {
      this.log(`${actor.name} の MPが足りない！`);
      return false;
    }
    if (action.disabledReason) {
      this.log(action.disabledReason, 'unavailable');
      return false;
    }

    const isSummon = action.school === 'summon';
    const isCrystal = choice.type === 'crystal';
    const isMagicLike = choice.type === 'magic'
      || isCrystal
      || action.sourceType === 'magic'
      || (choice.type === 'ability' && (action.mpCost ?? 0) > 0);
    if (isMagicLike && !actor.canUseMagic()) {
      const reason = actor.statuses?.has('silence')
        ? '沈黙状態'
        : actor.statuses?.has('toad')
          ? 'カエル状態'
          : '行動不能状態';
      const commandName = isSummon ? '召喚' : isCrystal ? 'えんばんせき' : '魔法';
      this.log(`${actor.name} は${reason}のため${commandName}を使えない！`, 'unavailable');
      return false;
    }
    if (choice.type === 'item' && choice.item.consumable !== false && !this.consumeItemStock(choice.item)) {
      this.log(`${choice.item.name ?? 'アイテム'} の使用に失敗した。`);
      return false;
    }

    eventBus.emit('battle:actionStarted', { actor, action });
    if (isMagicLike && !action.ignoreReflect) {
      targets = targets.map((target) => {
        if (!target.statuses?.has('reflect')) return target;
        const reflected = this.units.filter((unit) => unit.isAlive() && unit.isEnemy !== target.isEnemy);
        const redirect = reflected[Math.floor(Math.random() * reflected.length)] ?? actor;
        this.log(`${target.name} のリフレク！ ${redirect.name} へ反射した！`);
        return redirect;
      });
    }

    let results;
    if (action.specialCommand) {
      const special = resolveFF5SpecialCommand({ manager: this, actor, action, targets });
      if (!special.valid) {
        this.log(special.reason ?? 'その行動は実行できない。', 'unavailable');
        eventBus.emit('battle:actionCancelled', { actor, action });
        eventBus.emit('battle:playerTurn', { actor });
        return false;
      }
      action = special.action ?? action;
      targets = special.targets ?? targets;
      results = special.results ?? [];
      action._doNotRemember = special.remember === false;
    } else {
      results = resolveAction({ actor, action, targets, battleUnits: this.units });
    }
    if (results.some((result) => ['insufficient-mp', 'sealed', 'invalid-target', 'unavailable'].includes(result.type))) {
      this.log('その行動は実行できない。');
      eventBus.emit('battle:actionCancelled', { actor, action });
      eventBus.emit('battle:playerTurn', { actor });
      return false;
    }
    results
      .filter((result) => result.type === 'scan')
      .forEach((result) => this.revealBossIntel(action, this.units.find((unit) => unit.uid === result.targetUid)));
    results.forEach((r) => {
      const affectedUnit = this.units.find((unit) => unit.uid === r.targetUid) ?? targets[0] ?? actor;
      if (r.type === 'damage') {
        const weakText = r.weak ? '(弱点！)' : '';
        const hitText = r.hits > 1 ? ` ${r.hits}ヒット！` : '';
        const nullText = r.nullified ? ' 無効！' : '';
        this.log(`${affectedUnit.name} に ${r.amount} の ダメージ！${hitText}${weakText}${nullText}`);
      } else if (r.type === 'heal') {
        const healedUnit = this.units.find((unit) => unit.uid === r.targetUid) ?? targets[0];
        this.log(`${healedUnit.name} の HPが ${r.amount} かいふくした。`);
      } else if (r.type === 'mp-heal') {
        this.log(`${affectedUnit.name} の MPが ${r.amount} かいふくした。`);
      } else if (r.type === 'mp-damage') {
        this.log(`${affectedUnit.name} の MPが ${r.amount} へった。`);
      } else if (r.type === 'miss') {
        this.log(`${r.hits > 1 ? `${r.hits}回 ` : ''}ミス！`);
      } else if (r.type === 'blocked') {
        this.log(`${targets[0].name} は こうげきを ふせいだ！`);
      } else if (r.type === 'absorb') {
        this.log(`${affectedUnit.name} は属性攻撃を吸収し、HPが ${r.amount} かいふくした。`);
      } else if (r.type === 'buff') {
        this.log(`${affectedUnit.name}：${r.label}`);
      } else if (r.type === 'revive') {
        this.log(`${affectedUnit.name} は HP${r.amount} で復帰した！`);
      } else if (r.type === 'scan') {
        if (this.bossIntel.weakness) {
          const activeStatuses = statusLabels(r.statuses) || 'なし';
          this.log(`${affectedUnit.name} Lv${r.level} HP ${r.hp}/${r.maxHp} MP ${r.mp}/${r.maxMp}　弱点 ${r.weakness ?? 'なし'}　状態 ${activeStatuses}`);
        } else {
          this.log(`${affectedUnit.name} HP ${r.hp}/${r.maxHp}`);
        }
      } else if (r.type === 'status') {
        this.log(`${affectedUnit.name} に ${statusLabels(r.statuses) || '特殊効果'}。`);
      } else if (r.type === 'status-resist') {
        this.log(`${affectedUnit.name} は ${statusLabels(r.statuses)} を防いだ！`);
      } else if (r.type === 'cleanse') {
        this.log(`${affectedUnit.name} の状態異常を治療した。`);
      } else if (r.type === 'dispel') {
        this.log(`${affectedUnit.name} の有利な効果を解除した。`);
      } else if (r.type === 'effect') {
        this.log(`${affectedUnit.name}：${r.label}`);
      } else if (r.type === 'removed') {
        this.log(`${affectedUnit.name} は戦場から消え去った！`);
      } else if (r.type === 'barrier') {
        this.log(`${affectedUnit.name} を物理障壁（${r.amount}）が守る！`);
      } else if (r.type === 'barrier-absorb') {
        this.log(`物理障壁が ${r.amount} ダメージを肩代わりした。残り ${r.remaining}`);
      } else if (r.type === 'field-status') {
        this.log(`${affectedUnit.name} は時の流れを見切った！`);
      } else if (r.type === 'steal') {
        this.log(`${r.itemName}を ぬすんだ！${r.rare ? '（レア）' : ''}`);
      } else if (r.type === 'command-message') {
        this.log(r.label);
      } else if (r.type === 'jump-start') {
        this.log(`${actor.name} は空高く跳び上がった！`);
      } else if (r.type === 'captured' || r.type === 'hidden' || r.type === 'revealed') {
        this.log(r.label ?? (r.type === 'hidden' ? `${actor.name}は身を隠した。` : `${actor.name}は姿を現した。`));
      } else if (r.type === 'song-stopped') {
        this.log(`${affectedUnit.name} の歌が中断された。`);
      }
    });

    this.emitActionResolved(actor, results, actionStartSequence, action);

    if (!actor.isEnemy && !action._doNotRemember && !['defend'].includes(action.kind)) {
      this.lastPartyAction = {
        action: cloneSerializable({ ...action, mpCost: action.mpCost ?? 0 }, null),
        targetIds: targets.map((unit) => unit.uid),
      };
    }

    const pendingBossAction = this.pendingEnemyActions.get(this.boss.uid);
    if (pendingBossAction && action.element && action.element === this.boss.weakness && results.some((result) => result.targetUid === this.boss.uid && result.type === 'damage')) {
      pendingBossAction.power = Math.max(0.5, (pendingBossAction.power ?? 1) * 0.55);
      pendingBossAction.name = `${pendingBossAction.name}（体勢崩し）`;
      this.log(`${this.boss.name} の構えが崩れ、大技の威力が低下した！`, 'counter');
      eventBus.emit('battle:counter', { actor, boss: this.boss, action: pendingBossAction });
    }

    if (this.boss.isAlive() && results.some((result) => result.targetUid === this.boss.uid && result.type === 'damage' && result.amount > 0)) {
      this.resolveCounterAttacks(actor);
    }

    const nextPhase = bossPhaseIndex(this.boss);
    if (nextPhase > this.bossPhase && this.boss.isAlive()) {
      this.bossPhase = nextPhase;
      this.log(`${this.boss.name} の気配が変わった――フェーズ ${nextPhase + 1}！`, 'phase');
      eventBus.emit('battle:phaseChanged', { boss: this.boss, phase: nextPhase + 1 });
    }

    const costUsed = choice.ctbCost ?? action.ctbCost ?? 1.0;
    this.ctb.consumeTurn(actor, costUsed);

    this.awaitingPlayerInput = false;
    this.currentActor = null;
    this.broadcastState();

    if (this.checkBattleEnd()) return;
    this.scheduleNextTurn();
    return true;
  }
}

function hash32(value) {

function hasOperation(record, ...operations) {

  if (hasOperation(record, 'battle.escape', 'remove.from_battle')) return 'spatial';

  if (hasOperation(record, 'restore.full', 'heal.hp', 'heal.caster_hp', 'heal.mp')) return 'restorative';

  if (hasOperation(record, 'drain.hp', 'drain.mp')) return 'siphon';
  if (hasOperation(record, 'damage.hp_ratio', 'damage.mp_ratio')) return 'gravity';
  if (hasOperation(record, 'damage.fixed', 'damage.missing_hp')) return 'kinetic';
  if (hasOperation(record, 'damage.caster_hp', 'caster.sacrifice')) return 'sacrifice';
  if (hasOperation(record, 'inspect')) return 'scan';
  if (hasOperation(record, 'status.apply')) return POSITIVE_STATUS.test(record.effect) ? 'enhancement' : 'affliction';
  if (record.battle.element && ELEMENT_FAMILY[record.battle.element]) return ELEMENT_FAMILY[record.battle.element];
  if (record.school === 'summon') return 'invocation';
  if (hasOperation(record, 'damage.magic')) return record.effect.includes('複数回') ? 'barrage' : 'astral';

function deepFreeze(value) {
  if (!value || typeof value !== 'object' || Object.isFrozen(value)) return value;

function familyFor(record, sourceType) {

function makeDescriptor(record, sourceType, ordinal, familyOrdinal) {

    ? Math.max(1, Math.min(6, (record.level ?? Math.ceil((record.mpCost ?? 0) / 14)) || 2))
    : 1 + ((ordinal + familyOrdinal) % 6);
  const windupMs = 170 + intensity * 38 + (seed % 47);
  const travelMs = 120 + ((seed >>> 5) % 190);

    restorative: 'lift', resurrection: 'silhouette-flash', cleanse: 'dissolve-edge', ward: 'silhouette-flash',
    enhancement: 'lift', alchemy: 'lift', performance: 'lift', cryomancy: 'stagger-freeze',
    gravity: 'compress', judgment: 'dissolve-edge', sacrifice: 'dissolve-edge', kinetic: 'recoil',
    barrage: 'recoil', siphon: 'compress', affliction: 'stagger-freeze', spatial: 'dissolve-edge',
    stealth: 'dissolve-edge', steal: 'dissolve-edge',
  })[family] ?? generatedReaction;

  const songPattern = sourceType === 'song' ? SONG_PATTERNS[record.id] : null;

  return deepFreeze({
    key: record.id,
    id: record.id,
    actionId: record.id,
    sourceType,
    summonMotif,
    songPattern,
    family,
    motion: {

    particleCount: Math.min(14, 8 + intensity + ((seed >>> 24) % 4)),

    textureMode: pick(TEXTURE_MODES, 10),
    impactMode: `${baseImpact}:${pick(['center', 'radial', 'directional', 'layered'], 18)}`,

    familyCounts.set(family, familyOrdinal + 1);

const battleEffectRecipes = battleEffectDescriptors;
const runtimeDescriptorCache = new Map();

function getBattleEffectDescriptor(id) {
  return battleEffectDescriptors[id] ?? null;
}

function hasBattleEffectDescriptor(id) {
  return Object.hasOwn(battleEffectDescriptors, id);
}

function getBattleEffectRecipe(actionOrId) {
  if (typeof actionOrId === 'string') return getBattleEffectDescriptor(actionOrId);
  if (!actionOrId) return null;
  const nested = actionOrId.spell ?? actionOrId.ability ?? actionOrId.song ?? null;
  const candidates = [
    actionOrId.visualId, actionOrId.sourceId, actionOrId.commandSourceId,
    nested?.visualId, nested?.sourceId, nested?.commandSourceId, nested?.id, actionOrId.id,
  ];
  for (const id of candidates) {
    if (id && battleEffectRecipes[id]) return battleEffectRecipes[id];
  }
  return null;
}

/**
 * Renderer-facing resolver. It accepts wrapped menu actions, prefixed runtime
 * IDs (for example dual-magic_fire), or creates a deterministic fallback for
 * a future command that is not in the reference catalog yet.
 */
function resolveBattleEffectDescriptor(actionOrId) {
  const exact = getBattleEffectRecipe(actionOrId);
  if (exact) return exact;
  const action = typeof actionOrId === 'string' ? { id: actionOrId } : (actionOrId ?? {});
  const nested = action.spell ?? action.ability ?? action.song ?? {};
  const candidates = [action.visualId, action.sourceId, action.commandSourceId, nested.visualId, nested.sourceId, nested.commandSourceId, nested.id, action.id].filter(Boolean);
  const registeredIds = Object.keys(battleEffectRecipes);
  for (const candidate of candidates) {
    const normalized = String(candidate).replaceAll('-', '_');
    const alias = registeredIds.find((id) => normalized === id || normalized.endsWith(id) || normalized.endsWith(id.replace(/^(magic|ability|song)_/, '')));
    if (alias) return battleEffectRecipes[alias];
  }

  const fallbackKey = candidates[0] ?? `runtime_${hash32(JSON.stringify({ kind: action.kind, name: action.name }))}`;
  if (!runtimeDescriptorCache.has(fallbackKey)) {
    runtimeDescriptorCache.set(fallbackKey, makeDescriptor({
      id: `runtime_${String(fallbackKey).replace(/[^a-z0-9_]+/gi, '_').toLowerCase()}`,
      nameJa: action.name ?? nested.name ?? '未登録アクション',
      effect: action.effect ?? nested.effect ?? action.kind ?? '未来の戦闘コマンド',
      target: action.target ?? nested.target ?? 'one_enemy',
      type: 'command',
    }, 'ability', hash32(String(fallbackKey)), hash32(String(fallbackKey)) % 128));
  }
  return runtimeDescriptorCache.get(fallbackKey);
}

const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
const easeOut = (value) => 1 - ((1 - clamp(value)) ** 3);
const easeInOut = (value) => {
  const t = clamp(value);
  return t < .5 ? 4 * t * t * t : 1 - ((-2 * t + 2) ** 3) / 2;
};
const segment = (frame, from, to) => clamp((frame - from) / Math.max(1, to - from));
const fade = (frame, fadeInEnd, fadeOutStart, end) => Math.min(segment(frame, 0, fadeInEnd), 1 - segment(frame, fadeOutStart, end));
const snap = (value) => Math.round(value) + .5;

function setup(ctx, width = LOGICAL_SIZE, height = LOGICAL_SIZE) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, width, height);
  ctx.imageSmoothingEnabled = false;
  ctx.lineJoin = 'miter';
  ctx.lineCap = 'square';
}

function line(ctx, x1, y1, x2, y2, color, width = 2, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = clamp(alpha);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(snap(x1), snap(y1));
  ctx.lineTo(snap(x2), snap(y2));
  ctx.stroke();
  ctx.restore();
}

function poly(ctx, points, fill, alpha = 1, stroke = null, width = 1) {
  if (!points.length) return;
  ctx.save();
  ctx.globalAlpha = clamp(alpha);
  ctx.beginPath();
  ctx.moveTo(Math.round(points[0][0]), Math.round(points[0][1]));
  points.slice(1).forEach(([x, y]) => ctx.lineTo(Math.round(x), Math.round(y)));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke(); }
  ctx.restore();
}

function ring(ctx, x, y, radius, color, width = 2, alpha = 1, start = 0, end = Math.PI * 2) {
  ctx.save();
  ctx.globalAlpha = clamp(alpha);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.arc(Math.round(x), Math.round(y), Math.max(.5, Math.round(radius)), start, end);
  ctx.stroke();
  ctx.restore();
}

function diamond(ctx, x, y, size, fill, alpha = 1, stroke = null) {
  poly(ctx, [[x, y - size], [x + size, y], [x, y + size], [x - size, y]], fill, alpha, stroke, 2);
}

function burst(ctx, x, y, radius, rays, color, alpha = 1, offset = 0) {
  for (let i = 0; i < rays; i += 1) {
    const angle = offset + (Math.PI * 2 * i) / rays;
    const inner = radius * .28;
    line(ctx, x + Math.cos(angle) * inner, y + Math.sin(angle) * inner, x + Math.cos(angle) * radius, y + Math.sin(angle) * radius, color, i % 2 ? 2 : 3, alpha);
  }
}

function motes(ctx, count, frame, color, mode = 'orbit', radius = 72, alpha = 1) {
  for (let i = 0; i < count; i += 1) {
    const seed = (i * 47 + 19) % 101;
    const angle = i * 2.399 + frame * .035 * (i % 2 ? 1 : -1);
    const progress = (frame * .017 + seed / 101) % 1;
    let x = 96 + Math.cos(angle) * radius * (.4 + progress * .6);
    let y = 96 + Math.sin(angle) * radius * (.4 + progress * .6);
    if (mode === 'rise') { x = 46 + ((seed * 13) % 100); y = 170 - progress * 145; }
    if (mode === 'fall') { x = 35 + ((seed * 17) % 125); y = 8 + progress * 160; }
    if (mode === 'converge') { x = 96 + Math.cos(angle) * radius * (1 - progress); y = 96 + Math.sin(angle) * radius * (1 - progress); }
    ctx.globalAlpha = clamp(alpha * (1 - progress * .55));
    ctx.fillStyle = color;
    const size = i % 3 === 0 ? 3 : 2;
    ctx.fillRect(Math.round(x), Math.round(y), size, size);
  }
  ctx.globalAlpha = 1;
}

function flame(ctx, x, baseY, height, width, color, alpha = 1, lean = 0) {
  poly(ctx, [[x, baseY - height], [x + width * .24 + lean, baseY - height * .55], [x + width * .5, baseY - height * .15], [x + width * .16, baseY], [x - width * .45, baseY - height * .13], [x - width * .28 + lean, baseY - height * .58]], color, alpha);
}

function iceShard(ctx, x, y, height, width, color, alpha = 1, angle = 0) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.rotate(angle);
  poly(ctx, [[0, -height], [width, -height * .16], [0, height], [-width, -height * .16]], color, alpha, '#efffff', 1);
  ctx.restore();
}

function lightning(ctx, x, top, bottom, branches, color, alpha = 1, width = 3) {
  const points = [[x, top]];
  const steps = 7;
  for (let i = 1; i <= steps; i += 1) points.push([x + (i % 2 ? -1 : 1) * (7 + branches * 2), top + ((bottom - top) * i) / steps]);
  for (let i = 0; i < points.length - 1; i += 1) line(ctx, ...points[i], ...points[i + 1], color, width, alpha);
  for (let i = 1; i <= branches; i += 1) {
    const at = points[2 + i];
    line(ctx, at[0], at[1], at[0] + (i % 2 ? -1 : 1) * (18 + i * 4), at[1] + 14, color, 2, alpha * .85);
  }
}

function clock(ctx, frame, mode, alpha) {
  ring(ctx, 96, 96, 49, mode === 'stop' ? '#d9f8ff' : '#ffe89b', 3, alpha);
  ring(ctx, 96, 96, 42, '#7dcfff', 1, alpha * .8);
  for (let i = 0; i < 12; i += 1) {
    const a = -Math.PI / 2 + i * Math.PI / 6;
    line(ctx, 96 + Math.cos(a) * 35, 96 + Math.sin(a) * 35, 96 + Math.cos(a) * 42, 96 + Math.sin(a) * 42, '#f7ffff', i % 3 ? 1 : 2, alpha);
  }
  const speed = mode === 'haste' ? .18 : mode === 'slow' ? .018 : 0;
  const a = -Math.PI / 2 + frame * speed;
  line(ctx, 96, 96, 96 + Math.cos(a) * 31, 96 + Math.sin(a) * 31, '#fff', 3, alpha);
  line(ctx, 96, 96, 96 + Math.cos(a * .23 - 1.2) * 21, 96 + Math.sin(a * .23 - 1.2) * 21, '#7dcfff', 2, alpha);
  diamond(ctx, 96, 96, 4, '#fff', alpha);
}

function drawFire(ctx, frame, tier) {

function drawComet(ctx, frame, meteor = false) {
