    ],
  }),
});

function bossActionsFor(unit) {
  const profile = BOSS_ACTION_PROFILES[unit.id];
  if (!profile) return unit.aiActions ?? [];
  const ratio = unit.hpRatio();
  return profile.phases
    .filter((phase) => ratio <= phase.maxHpRatio)
    .sort((a, b) => a.maxHpRatio - b.maxHpRatio)[0]?.actions ?? [];
}

function bossPhaseIndex(unit) {
  const profile = BOSS_ACTION_PROFILES[unit.id];
  if (!profile) return 0;
  const eligible = profile.phases.filter((phase) => unit.hpRatio() <= phase.maxHpRatio);
  const active = eligible.sort((a, b) => a.maxHpRatio - b.maxHpRatio)[0];
  return profile.phases.indexOf(active);
}

/** Counter-move pool for bosses that always retaliate when hit (e.g. Omega). */
function counterPoolFor(unit) {
  const profile = BOSS_ACTION_PROFILES[unit.id];
  return profile?.counterPool ?? [];
}

// ---- src/ui/MessageWindow.js ----
const MAX_QUEUE_LENGTH = 6;

class MessageWindow {
  constructor(windowEl, textEl) {
    this.windowEl = windowEl;
    this.textEl = textEl;
    this.hideTimer = null;
    this.advanceTimer = null;
    this.queue = [];
    this.isShowing = false;
  }

  show(text) {
    if (!text) return;
    this.queue.push(String(text));
    if (this.queue.length > MAX_QUEUE_LENGTH) this.queue.splice(0, this.queue.length - MAX_QUEUE_LENGTH);
    if (!this.isShowing) this.showNext();
  }

  showNext() {
    const text = this.queue.shift();
    if (!text) {
      this.hide();
      return;
    }
    this.isShowing = true;
    this.textEl.textContent = text;
    this.windowEl.classList.remove('hidden', 'message-enter');
    // Force a fresh transition when several combat messages arrive together.
    requestAnimationFrame(() => this.windowEl.classList.add('message-enter'));
    clearTimeout(this.hideTimer);
    // Read the current speed setting on every message so a mid-battle
    // change in Options takes effect immediately, without needing to
    // reset or recreate the message window.
    const { holdMs: HOLD_MS, fastHoldMs: FAST_HOLD_MS, betweenMs: BETWEEN_MESSAGES_MS } = getMessageSpeedTiming();
    const holdMs = this.queue.length ? FAST_HOLD_MS : HOLD_MS;
    this.hideTimer = setTimeout(() => {
      this.windowEl.classList.remove('message-enter');
      this.isShowing = false;
      if (this.queue.length) this.advanceTimer = setTimeout(() => this.showNext(), BETWEEN_MESSAGES_MS);
      else this.hide();
    }, holdMs);
  }

  hide() {
    clearTimeout(this.hideTimer);
    clearTimeout(this.advanceTimer);
    this.isShowing = false;
    this.windowEl.classList.add('hidden');
  }

  reset() {
    clearTimeout(this.hideTimer);
    clearTimeout(this.advanceTimer);
    this.queue.length = 0;
    this.isShowing = false;
    this.textEl.textContent = '';
    this.windowEl.classList.remove('message-enter');
    this.windowEl.classList.add('hidden');
  }
}

// ---- src/battle/BattleManager.js ----
const ENEMY_TURN_DELAY_MS = 900;
const AUTO_ADVANCE_DELAY_MS = 550;

class BattleManager {
  constructor(partyUnits, bossUnit, options = {}) {
    this.party = partyUnits;
    this.boss = bossUnit;
    this.units = [...partyUnits, bossUnit];
    this.ctb = new CTBEngine(this.units);

    this.currentActor = null;
    this.awaitingPlayerInput = false;
    this.finished = false;
    this.result = null; // 'victory' | 'defeat'
    this.logSequence = 0;
    this.logJournal = [];
    this.pendingEnemyActions = new Map();
    this.bossPhase = 0;
    this.presentationHoldUntil = 0;
    this.itemStockProvider = options.getItemStock ?? (() => Infinity);
    this.itemConsumer = options.consumeItem ?? (() => true);
  }

  itemId(itemOrId) {
    return typeof itemOrId === 'string' ? itemOrId : itemOrId?.sourceId ?? itemOrId?.id ?? '';
  }

  getItemStock(itemOrId) {
    const stock = Number(this.itemStockProvider(this.itemId(itemOrId), itemOrId));
    return Number.isFinite(stock) ? Math.max(0, Math.floor(stock)) : Infinity;
  }

  canUseItem(itemOrId) {
    return this.getItemStock(itemOrId) > 0;
  }

  getItemUseState(itemOrId) {
    const stock = this.getItemStock(itemOrId);
    return Object.freeze({ stock, usable: stock > 0, reason: stock > 0 ? null : '在庫がない。' });
  }

  consumeItemStock(itemOrId, amount = 1) {
    if (this.getItemStock(itemOrId) < amount) return false;
    return this.itemConsumer(this.itemId(itemOrId), amount, itemOrId) !== false;
  }

  log(text, kind = 'info') {
    const entry = Object.freeze({ id: ++this.logSequence, text, kind, timestamp: Date.now() });
    this.logJournal.push(entry);
    if (this.logJournal.length > 80) this.logJournal.shift();
    eventBus.emit('battle:log', text);
    eventBus.emit('battle:logEntry', entry);
    return entry;
  }

  emitActionResolved(actor, results, fromSequence = 0, action = null) {
    const entries = this.logJournal.filter((entry) => entry.id > fromSequence);
    eventBus.emit('battle:actionResolved', { actor, action, results, logEntries: entries });
    eventBus.emit('battle:logBatch', { actorUid: actor.uid, entries });
  }

  broadcastState() {
    eventBus.emit('battle:stateUpdate', {
      party: this.party,
      boss: this.boss,
      preview: this.ctb.previewQueue(8),
    });
  }

  start() {
    this.log(`${this.boss.name} が あらわれた！`);
    this.broadcastState();
    this.scheduleNextTurn(400);
  }

  deferNextTurnFor(durationMs = 0) {
    const safeDuration = Math.max(0, Number(durationMs) || 0);
    this.presentationHoldUntil = Math.max(this.presentationHoldUntil, Date.now() + safeDuration);
  }

  scheduleNextTurn(delay = AUTO_ADVANCE_DELAY_MS) {
    if (this.finished) return;
    const presentationDelay = Math.max(0, this.presentationHoldUntil - Date.now());
    setTimeout(() => this.advanceTurn(), Math.max(delay, presentationDelay));
  }

  checkBattleEnd() {
    if (!this.boss.isAlive() || this.boss.removedFromBattle || this.boss.statuses.has('petrify')) {
      this.finished = true;
      this.result = 'victory';
      this.log(`${this.boss.name} を たおした！`);
      eventBus.emit('battle:end', { result: 'victory' });
      return true;
    }
    if (this.party.every((p) => !p.isAlive() || p.removedFromBattle || p.statuses.has('petrify'))) {
      this.finished = true;
      this.result = 'defeat';
      this.log('パーティは ぜんめつした...');
      eventBus.emit('battle:end', { result: 'defeat' });
      return true;
    }
    return false;
  }

  advanceTurn() {
    if (this.finished) return;
    const actor = this.ctb.advanceToNextActor();
    if (!actor) return;
    this.currentActor = actor;

    // Stop freezes a unit's own CTB gauge (effectiveAgility -> 0), so its own
    // turn never comes around again on its own — meaning the normal
    // "decrement duration when it's your turn" tick would never fire and
    // Stop would never wear off. FF5's Stop instead runs down over the
    // course of *other* units' turns, so tick it here, once per turn taken
    // by anyone else, independently of the frozen unit's own (frozen) CTB.
    this.units.forEach((unit) => {
      if (unit === actor || !unit.isAlive() || !unit.statuses.has('stop')) return;
      const remaining = (unit.statusDurations.get('stop') ?? 1) - 1;
      if (remaining <= 0) {
        unit.removeStatus('stop');
        this.log(`${unit.name} の ${statusLabels(['stop'])} が切れた。`);
      } else {
        unit.statusDurations.set('stop', remaining);
      }
    });

    const tickResults = actor.processTurnStatuses();
    tickResults.forEach((result) => {
      if (result.type === 'status-damage') this.log(`${actor.name} は ${statusLabels([result.status])}で ${result.amount} ダメージ！`);
      if (result.type === 'status-heal' && result.amount > 0) this.log(`${actor.name} の HPが ${result.amount} 回復した。`);
      if (result.type === 'doom') this.log(`${actor.name} は死の宣告に倒れた！`);
      if (result.type === 'status-expired' && result.status !== 'doom') this.log(`${actor.name} の ${statusLabels([result.status])} が切れた。`);
    });
    if (tickResults.length) eventBus.emit('battle:actionResolved', { actor, results: tickResults });
    if (this.checkBattleEnd()) return;

    // Reset defend stance at the start of a unit's own turn.
    actor.defending = false;
    actor.physicalDamageMultiplier = actor.equipmentEffects?.physicalDamageMultiplier ?? 1;

    if (isIncapacitated(actor)) {
      this.log(`${actor.name} は動けない！`);
      this.ctb.consumeTurn(actor, 0.45);
      this.broadcastState();
      this.scheduleNextTurn(260);
    } else if (actor.statuses.has('berserk') || actor.statuses.has('confuse')) {
      this.broadcastState();
      setTimeout(() => this.forcedAct(actor), 360);
    } else if (actor.isEnemy) {
      this.broadcastState();
      setTimeout(() => this.enemyAct(actor), ENEMY_TURN_DELAY_MS);
    } else {
      this.awaitingPlayerInput = true;
      this.broadcastState();
      eventBus.emit('battle:playerTurn', { actor });
    }
  }

  forcedAct(actor) {
    const confused = actor.statuses.has('confuse');
    const candidates = this.units.filter((unit) => unit.isAlive() && !unit.removedFromBattle && (confused || unit.isEnemy !== actor.isEnemy));
    const target = candidates[Math.floor(Math.random() * candidates.length)];
    if (!target) return this.scheduleNextTurn();
    this.log(`${actor.name} は${confused ? '混乱して' : '狂戦士となり'} ${target.name} を攻撃！`);
    const results = resolveAction({ actor, action: { kind: 'physical-attack' }, targets: [target], battleUnits: this.units });
    eventBus.emit('battle:actionResolved', { actor, action: { kind: 'physical-attack', name: 'こうげき' }, results });
    results.filter((result) => result.type === 'damage').forEach((result) => this.log(`${target.name} に ${result.amount} の ダメージ！`));
    this.ctb.consumeTurn(actor, 1);
    this.broadcastState();
    if (!this.checkBattleEnd()) this.scheduleNextTurn();
  }

  /** Simple AI: picks a target based on the boss's `ai` behaviour tag. */
  pickEnemyTarget() {
    const aliveParty = this.party.filter((p) => p.isAlive());
    if (aliveParty.length === 0) return null;

    switch (this.boss.ai) {
      case 'lowestHp':
        return aliveParty.reduce((a, b) => (a.hp < b.hp ? a : b));
      case 'aggressive':
        return aliveParty.reduce((a, b) => (a.atk > b.atk ? a : b));
      case 'random':
      default:
        return aliveParty[Math.floor(Math.random() * aliveParty.length)];
    }
  }

  enemyAct(actor) {
    if (this.finished) return;
    const target = this.pickEnemyTarget();
    if (!target) {
      this.checkBattleEnd();
      return;
    }

    const actionStartSequence = this.logSequence;
    const pendingAction = this.pendingEnemyActions.get(actor.uid);
    if (pendingAction) this.pendingEnemyActions.delete(actor.uid);
    const usableAiActions = bossActionsFor(actor).filter((action) => actor.canAffordMp(action.mpCost ?? 0));
    const weightedActions = usableAiActions.flatMap((action) => Array(Math.max(1, action.weight ?? 1)).fill(action));
    const chosenAction = pendingAction ?? (weightedActions.length ? weightedActions[Math.floor(Math.random() * weightedActions.length)] : { kind: 'physical-attack' });
    if (chosenAction.telegraph && !pendingAction) {
      const preparedAction = { ...chosenAction, telegraph: null };
      this.pendingEnemyActions.set(actor.uid, preparedAction);
      this.log(`${actor.name}：${chosenAction.telegraph}`, 'telegraph');
      eventBus.emit('battle:telegraph', { actor, action: preparedAction, hint: chosenAction.telegraph });
      this.ctb.consumeTurn(actor, 0.5);
      this.broadcastState();
      this.scheduleNextTurn(420);
      return;
    }
    const targets = chosenAction.target === 'all_enemies'
      ? this.party.filter((unit) => unit.isAlive())
      : [target];
    this.log(`${actor.name} の ${chosenAction.name ?? 'こうげき'}！`, chosenAction.power >= 2 ? 'danger' : 'action');
    const results = chosenAction.kind === 'physical-attack' && targets.length > 1
      ? targets.flatMap((eachTarget) => resolveAction({ actor, action: chosenAction, targets: [eachTarget], battleUnits: this.units }))
      : resolveAction({ actor, action: chosenAction, targets, battleUnits: this.units });

    results.forEach((r) => {
      if (r.type === 'damage') {
        const affected = this.units.find((unit) => unit.uid === r.targetUid) ?? target;
        this.log(`${affected.name} に ${r.amount} の ダメージ！`);
      } else if (r.type === 'miss') {
        this.log(`${actor.name} の こうげきは はずれた！`);
      } else if (r.type === 'blocked') {
        this.log(`${target.name} は こうげきを ふせいだ！`);
      }
    });

    this.emitActionResolved(actor, results, actionStartSequence, chosenAction);
    this.ctb.consumeTurn(actor, chosenAction.ctbCost ?? attackAction.ctbCost);
    this.broadcastState();

    if (this.checkBattleEnd()) return;
    this.scheduleNextTurn();
  }

  /**
   * Some bosses (e.g. Omega) always retaliate with a burst of counter-moves
   * immediately after taking damage, independent of the CTB turn order.
   * Faithful to the source game's "反撃行動: 2つ選んで行動" pattern.
   */
  resolveCounterAttacks(originalActor) {
    const pool = counterPoolFor(this.boss);
    const counterConfig = this.boss.counterOnHit;
    if (!pool.length || !counterConfig || !this.boss.isAlive()) return;
    // Faithful to the source game: a boss frozen by Stop (or otherwise
    // incapacitated — paralyzed, asleep, petrified) cannot act at all,
    // including its automatic counterattack.
    if (isIncapacitated(this.boss)) return;
    if (Math.random() > (counterConfig.chance ?? 1)) return;

    const times = counterConfig.times ?? 1;
    for (let i = 0; i < times; i += 1) {
      const aliveParty = this.party.filter((unit) => unit.isAlive() && !unit.removedFromBattle);
      if (!aliveParty.length || !this.boss.isAlive()) break;
      const counterAction = pool[Math.floor(Math.random() * pool.length)];
      const focusTarget = aliveParty.includes(originalActor) ? originalActor : aliveParty[Math.floor(Math.random() * aliveParty.length)];
      const counterTargets = counterAction.target === 'all_enemies' ? aliveParty : [focusTarget];

      this.log(`${this.boss.name} の反撃！ ${counterAction.name}！`, 'counter');
      const actionStartSequence = this.logSequence;
      const results = resolveAction({ actor: this.boss, action: counterAction, targets: counterTargets, battleUnits: this.units });
      results.forEach((r) => {
        const affected = this.units.find((unit) => unit.uid === r.targetUid);
        if (r.type === 'damage') this.log(`${affected?.name ?? '???'} に ${r.amount} の ダメージ！`, 'counter');
        else if (r.type === 'status') this.log(`${affected?.name ?? '???'} に ${statusLabels(r.statuses) || '特殊効果'}！`, 'counter');
        else if (r.type === 'status-resist') this.log(`${affected?.name ?? '???'} は ${statusLabels(r.statuses)} を防いだ！`, 'counter');
        else if (r.type === 'removed') this.log(`${affected?.name ?? '???'} は戦場から消え去った！`, 'counter');
      });
      this.emitActionResolved(this.boss, results, actionStartSequence, counterAction);
    }
    this.broadcastState();
  }

  /**
   * Called by the UI once the player has picked a command (+ target).
   * `choice` shape: { kind, name, ctbCost, element, power, mpCost, healAmount }
   */
  submitPlayerAction(choice, targetUnit) {
    if (!this.awaitingPlayerInput || !this.currentActor) return;
    const actor = this.currentActor;
    const actionStartSequence = this.logSequence;

    let action;
    let targets;
    const resolveTargets = (targetId, fallback) => {
      if (targetId === 'self') return [actor];
      if (['all_allies', 'party'].includes(targetId)) return this.party.filter((unit) => unit.isAlive());
      if (['all_enemies', 'enemy_group'].includes(targetId)) return this.units.filter((unit) => unit.isAlive() && unit.isEnemy !== actor.isEnemy);
      if (targetId === 'all_units' || targetId === 'enemy_and_party') return this.units.filter((unit) => unit.isAlive());
      if (targetId === 'enemy_group_and_ally') return [this.boss, fallback ?? actor];
      if (targetId === 'random_unit') {
        const alive = this.units.filter((unit) => unit.isAlive());
        return [alive[Math.floor(Math.random() * alive.length)]];
      }
      return [fallback ?? (String(targetId).includes('ally') ? actor : this.boss)];
    };

    switch (choice.type) {
      case 'attack':
        action = { kind: 'physical-attack' };
        targets = [targetUnit ?? this.boss];
        this.log(`${actor.name} の こうげき！`);
        break;
      case 'magic':
        action = {
          kind: choice.spell.actionKind ?? (choice.spell.healAmount !== undefined && choice.spell.power === undefined
            ? 'heal'
            : 'magic-attack'),
          ...choice.spell,
        };
        targets = resolveTargets(choice.spell.target, targetUnit ?? (action.kind === 'heal' ? actor : this.boss));
        this.log(`${actor.name} の ${choice.spell.name}！`);
        break;
      case 'ability':
        action = {
          kind: choice.ability.actionKind ?? (choice.ability.healAmount !== undefined ? 'heal' : 'magic-attack'),
          ...choice.ability,
        };
        targets = resolveTargets(choice.ability.target, targetUnit);
        this.log(`${actor.name} の ${choice.ability.name}！`);
        break;
      case 'crystal': {
        const shard = choice.shard;
        action = {
          kind: shard.actionKind ?? 'magic-attack',
          ...shard,
          operations: shard.operations ?? shard.battle?.operations,
        };
        targets = resolveTargets(shard.target ?? shard.battle?.target?.id ?? 'one_enemy', targetUnit);
        this.log(`${actor.name} の結晶技 ${shard.name ?? shard.techniqueNameJa}！`);
        break;
      }
      case 'item':
        if (!this.canUseItem(choice.item)) {
          this.log(`${choice.item.name ?? 'アイテム'} の在庫がない！`);
          return false;
        }
        action = (choice.item.operations ?? choice.item.battle?.operations)?.length
          ? { ...choice.item, operations: choice.item.operations ?? choice.item.battle.operations, kind: choice.item.actionKind ?? 'scripted' }
          : { kind: 'heal', healAmount: choice.item.healAmount };
        targets = [targetUnit ?? actor];
        this.log(`${actor.name} は ${choice.item.name} を つかった！`);
        break;
      case 'defend':
        action = { kind: 'defend' };
        targets = [actor];
        this.log(`${actor.name} は みをまもっている。`);
        break;
      default:
        return false;
    }

    if (!actor.canAffordMp(action.mpCost ?? 0)) {
      this.log(`${actor.name} の MPが足りない！`);
      return false;
    }
    if (action.disabledReason) {
      this.log(action.disabledReason, 'unavailable');
      return false;
    }

    const isSummon = action.school === 'summon';
    const isCrystal = choice.type === 'crystal';
    const isMagicLike = choice.type === 'magic'
      || isCrystal
      || action.sourceType === 'magic'
      || (choice.type === 'ability' && (action.mpCost ?? 0) > 0);
    if (isMagicLike && !actor.canUseMagic()) {
      const reason = actor.statuses?.has('silence')
        ? '沈黙状態'
        : actor.statuses?.has('toad')
          ? 'カエル状態'
          : '行動不能状態';
      const commandName = isSummon ? '召喚' : isCrystal ? '結晶技' : '魔法';
      this.log(`${actor.name} は${reason}のため${commandName}を使えない！`, 'unavailable');
      return false;
    }
    if (isMagicLike && !action.ignoreReflect) {
      targets = targets.map((target) => {
        if (!target.statuses?.has('reflect')) return target;
        const reflected = this.units.filter((unit) => unit.isAlive() && unit.isEnemy !== target.isEnemy);
        const redirect = reflected[Math.floor(Math.random() * reflected.length)] ?? actor;
        this.log(`${target.name} のリフレク！ ${redirect.name} へ反射した！`);
        return redirect;
      });
    }

    if (choice.type === 'item' && !this.consumeItemStock(choice.item)) {
      this.log(`${choice.item.name ?? 'アイテム'} の使用に失敗した。`);
      return false;
    }
    const results = resolveAction({ actor, action, targets, battleUnits: this.units });
    if (results.some((result) => ['insufficient-mp', 'sealed', 'invalid-target', 'unavailable'].includes(result.type))) {
      this.log('その行動は実行できない。');
      return false;
    }
    results.forEach((r) => {
      const affectedUnit = this.units.find((unit) => unit.uid === r.targetUid) ?? targets[0] ?? actor;
      if (r.type === 'damage') {
        const weakText = r.weak ? '(弱点！)' : '';
        const hitText = r.hits > 1 ? ` ${r.hits}ヒット！` : '';
        const nullText = r.nullified ? ' 無効！' : '';
        this.log(`${affectedUnit.name} に ${r.amount} の ダメージ！${hitText}${weakText}${nullText}`);
      } else if (r.type === 'heal') {
        const healedUnit = this.units.find((unit) => unit.uid === r.targetUid) ?? targets[0];
        this.log(`${healedUnit.name} の HPが ${r.amount} かいふくした。`);
      } else if (r.type === 'mp-heal') {
        this.log(`${affectedUnit.name} の MPが ${r.amount} かいふくした。`);
      } else if (r.type === 'mp-damage') {
        this.log(`${affectedUnit.name} の MPが ${r.amount} へった。`);
      } else if (r.type === 'miss') {
        this.log(`${r.hits > 1 ? `${r.hits}回 ` : ''}ミス！`);
      } else if (r.type === 'blocked') {
        this.log(`${targets[0].name} は こうげきを ふせいだ！`);
      } else if (r.type === 'absorb') {
        this.log(`${affectedUnit.name} は属性攻撃を吸収し、HPが ${r.amount} かいふくした。`);
      } else if (r.type === 'buff') {
        this.log(`${affectedUnit.name}：${r.label}`);
      } else if (r.type === 'revive') {
        this.log(`${affectedUnit.name} は HP${r.amount} で復帰した！`);
      } else if (r.type === 'scan') {
        this.log(`${affectedUnit.name} HP ${r.hp}/${r.maxHp}　弱点 ${r.weakness ?? 'なし'}`);
      } else if (r.type === 'status') {
        this.log(`${affectedUnit.name} に ${statusLabels(r.statuses) || '特殊効果'}。`);
      } else if (r.type === 'status-resist') {
        this.log(`${affectedUnit.name} は ${statusLabels(r.statuses)} を防いだ！`);
      } else if (r.type === 'cleanse') {
        this.log(`${affectedUnit.name} の状態異常を治療した。`);
      } else if (r.type === 'dispel') {
        this.log(`${affectedUnit.name} の有利な効果を解除した。`);
      } else if (r.type === 'effect') {
        this.log(`${affectedUnit.name}：${r.label}`);
      } else if (r.type === 'removed') {
        this.log(`${affectedUnit.name} は戦場から消え去った！`);
      } else if (r.type === 'barrier') {
        this.log(`${affectedUnit.name} を物理障壁（${r.amount}）が守る！`);
      } else if (r.type === 'barrier-absorb') {
        this.log(`物理障壁が ${r.amount} ダメージを肩代わりした。残り ${r.remaining}`);
      } else if (r.type === 'field-status') {
        this.log(`${affectedUnit.name} は時の流れを見切った！`);
      }
    });

    this.emitActionResolved(actor, results, actionStartSequence, action);

    const pendingBossAction = this.pendingEnemyActions.get(this.boss.uid);
    if (pendingBossAction && action.element && action.element === this.boss.weakness && results.some((result) => result.targetUid === this.boss.uid && result.type === 'damage')) {
      pendingBossAction.power = Math.max(0.5, (pendingBossAction.power ?? 1) * 0.55);
      pendingBossAction.name = `${pendingBossAction.name}（体勢崩し）`;
      this.log(`${this.boss.name} の構えが崩れ、大技の威力が低下した！`, 'counter');
      eventBus.emit('battle:counter', { actor, boss: this.boss, action: pendingBossAction });
    }

    if (this.boss.isAlive() && results.some((result) => result.targetUid === this.boss.uid && result.type === 'damage' && result.amount > 0)) {
      this.resolveCounterAttacks(actor);
    }

    const nextPhase = bossPhaseIndex(this.boss);
    if (nextPhase > this.bossPhase && this.boss.isAlive()) {
      this.bossPhase = nextPhase;
      this.log(`${this.boss.name} の気配が変わった――フェーズ ${nextPhase + 1}！`, 'phase');
      eventBus.emit('battle:phaseChanged', { boss: this.boss, phase: nextPhase + 1 });
    }

    const costUsed = choice.ctbCost ?? action.ctbCost ?? 1.0;
    this.ctb.consumeTurn(actor, costUsed);

    this.awaitingPlayerInput = false;
    this.currentActor = null;
    this.broadcastState();

    if (this.checkBattleEnd()) return;
    this.scheduleNextTurn();
    return true;
  }
}

const POSITIVE_STATUS = /回復|復帰|治療|上昇|軽減|回避|リフレク|浮遊|強化|無効|防ぐ|肩代わり/;

function hash32(value) {
  let hash = 0x811c9dc5;
  for (let index = 0; index < value.length; index += 1) {
    hash ^= value.charCodeAt(index);
    hash = Math.imul(hash, 0x01000193);
  }
  return hash >>> 0;
}

function hasOperation(record, ...operations) {
  return record.battle.operations.some((operation) => operations.includes(operation.op));
}

function magicFamily(record) {
  if (record.id === 'magic_missile') return 'gravity';
  if (record.id === 'magic_flare' || record.id === 'magic_level_3_flare') return 'astral';
  if (record.id === 'magic_level_5_death') return 'judgment';
  if (record.id === 'magic_return') return 'temporal-reversal';
  if (hasOperation(record, 'barrier.physical')) return 'ward';
  if (hasOperation(record, 'battle.speed', 'turn.extra', 'stat.song_growth')) return 'chronomancy';
  if (hasOperation(record, 'battle.field_status')) return 'null-field';
  if (hasOperation(record, 'battle.escape', 'remove.from_battle')) return 'spatial';
  if (hasOperation(record, 'revive')) return 'resurrection';
  if (hasOperation(record, 'restore.full', 'heal.hp', 'heal.caster_hp', 'heal.mp')) return 'restorative';
  if (hasOperation(record, 'status.remove', 'status.dispel')) return 'cleanse';
  if (hasOperation(record, 'drain.hp', 'drain.mp')) return 'siphon';
  if (hasOperation(record, 'damage.hp_ratio', 'damage.mp_ratio')) return 'gravity';
  if (hasOperation(record, 'damage.fixed', 'damage.missing_hp')) return 'kinetic';
  if (hasOperation(record, 'damage.caster_hp', 'caster.sacrifice')) return 'sacrifice';
  if (hasOperation(record, 'inspect')) return 'scan';
  if (hasOperation(record, 'status.apply')) return POSITIVE_STATUS.test(record.effect) ? 'enhancement' : 'affliction';
  if (record.battle.element && ELEMENT_FAMILY[record.battle.element]) return ELEMENT_FAMILY[record.battle.element];
  if (record.school === 'summon') return 'invocation';
  if (hasOperation(record, 'damage.magic')) return record.effect.includes('複数回') ? 'barrage' : 'astral';
  return record.school === 'time' ? 'chronomancy' : 'grimoire';
}

function abilityFamily(record) {
  const effect = record.effect ?? '';
  if (ABILITY_FAMILY_BY_ID[record.id]) return ABILITY_FAMILY_BY_ID[record.id];
  if (record.id === 'ability_mimic') return 'mimicry';
  if (record.type === 'equip') return 'armament';
  if (record.type === 'passive') return 'passive-aura';
  if (record.type === 'field') return 'fieldcraft';
  if (/魔法を使用|青魔法|白魔法|黒魔法|召喚魔法|時空魔法|連続で/.test(effect)) return 'grimoire';
  if (/回復|治療|復帰|そせい/.test(effect)) return 'restorative';
  if (/歌|うた|踊り|おどる/.test(effect)) return 'performance';
  if (/調合|薬|飲む|アイテム/.test(effect)) return 'alchemy';
  if (/逃走|退避|隠し|盗|捕獲|けむり/.test(effect)) return 'stealth';
  if (/調べる|詳細情報|発見/.test(effect)) return 'scan';
  if (/複数|4回|2回攻撃|連撃/.test(effect)) return 'barrage';
  if (/攻撃|一撃|投擲|ジャンプ|即死|麻痺/.test(effect)) return 'kinetic';
  if (/無効|回避|バリア|分身|止める/.test(effect)) return 'ward';
  if (/付与|上昇|強化|高める/.test(effect)) return 'enhancement';
  return 'mimicry';
}

function deepFreeze(value) {
  if (!value || typeof value !== 'object' || Object.isFrozen(value)) return value;
  Object.values(value).forEach(deepFreeze);
  return Object.freeze(value);
}

function familyFor(record, sourceType) {
  if (sourceType === 'magic') return magicFamily(record);
  if (sourceType === 'song') return 'performance';
  if (sourceType === 'crystal') return ELEMENT_FAMILY[record.battle.element] ?? 'invocation';
  return abilityFamily(record);
}

function makeDescriptor(record, sourceType, ordinal, familyOrdinal) {
  const family = familyFor(record, sourceType);
  const [motionKind, primaryGeometry, trajectoryKind, baseImpact] = FAMILY_PROFILES[family];
  const seed = hash32(`${record.id}|${record.effect}|${ordinal}`);
  const pick = (list, shift = 0) => list[(seed >>> shift) % list.length];
  const intensity = sourceType === 'magic'
    ? Math.max(1, Math.min(6, (record.level ?? Math.ceil((record.mpCost ?? 0) / 14)) || 2))
    : Math.max(1, Math.min(6, Math.ceil((record.abp ?? 10) / 170)));
  const windupMs = 170 + intensity * 38 + (seed % 47);
  const travelMs = 120 + ((seed >>> 5) % 190);
  const impactMs = 110 + intensity * 26 + ((seed >>> 11) % 71);
  const decayMs = 160 + ((seed >>> 17) % 180);
  const beats = 1 + intensity + ((seed >>> 23) % 3);
  const glyphRoot = SIGNATURE_GLYPHS[record.id] ?? (sourceType === 'magic' ? SCHOOL_GLYPHS[record.school] : sourceType === 'song' ? '♫' : sourceType === 'crystal' ? '◇' : TYPE_GLYPHS[record.type]);
  // Mixed-radix structural axes: the tuple remains unique within a family
  // without relying on palette, text, ID, glyph, particles, timing, or seed.
  const entrance = ENTRANCES[familyOrdinal % ENTRANCES.length];
  const secondary = SECONDARY_GEOMETRY[Math.floor(familyOrdinal / ENTRANCES.length) % SECONDARY_GEOMETRY.length];
  const formation = FORMATIONS[Math.floor(familyOrdinal / (ENTRANCES.length * SECONDARY_GEOMETRY.length)) % FORMATIONS.length];
  const placement = IMPACT_PLACEMENTS[Math.floor(familyOrdinal / 2) % IMPACT_PLACEMENTS.length];
  const cameraCue = CAMERA_CUES[Math.floor(familyOrdinal / 3) % CAMERA_CUES.length];
  const generatedReaction = TARGET_REACTIONS[Math.floor(familyOrdinal / 5) % TARGET_REACTIONS.length];
  const targetReaction = ({
    restorative: 'lift', resurrection: 'silhouette-flash', cleanse: 'dissolve-edge', ward: 'silhouette-flash',
    enhancement: 'lift', alchemy: 'lift', performance: 'lift', cryomancy: 'stagger-freeze',
    gravity: 'compress', judgment: 'dissolve-edge', sacrifice: 'dissolve-edge', kinetic: 'recoil',
    barrage: 'recoil', siphon: 'compress', affliction: 'stagger-freeze', spatial: 'dissolve-edge',
    stealth: 'dissolve-edge', steal: 'dissolve-edge',
  })[family] ?? generatedReaction;
  const summonMotif = sourceType === 'magic' && record.school === 'summon' ? SUMMON_MOTIFS[record.id] : null;
  const songPattern = sourceType === 'song' ? SONG_PATTERNS[record.id] : null;

  return deepFreeze({
    key: record.id,
    id: record.id,
    actionId: record.id,
    sourceType,
    summonMotif,
    songPattern,
    family,
    motion: {
      kind: motionKind,
      entrance,
      rotationDegrees: ((seed >>> 7) % 9 - 4) * 45,
      oscillation: 1 + ((seed >>> 15) % 4),
    },
    geometry: {
      primary: primaryGeometry,
      secondary,
      formation,
      symmetry: 3 + ((seed >>> 9) % 10),
      layers: 2 + ((seed >>> 19) % 4),
    },
    trajectory: {
      kind: trajectoryKind,
      origin: record.target === 'self' ? 'caster-core' : 'caster-glyph',
      targetMode: record.target ?? 'none',
      arcBias: Number((((seed >>> 13) % 101) / 100 - 0.5).toFixed(2)),
      turns: Math.floor(familyOrdinal / (ENTRANCES.length * 2)) % 4,
    },
    pulsePattern: {
      shape: pick(PULSE_PATTERNS, 2),
      beats,
      spacingMs: 48 + ((seed >>> 8) % 93),
      amplitude: Number((0.55 + ((seed >>> 20) % 41) / 100).toFixed(2)),
    },
    particleCount: Math.min(14, 8 + intensity + ((seed >>> 24) % 4)),
    timing: {
      windupMs,
      travelMs,
      impactMs,
      decayMs,
      totalMs: windupMs + travelMs + impactMs + decayMs,
      easing: pick(EASINGS, 6),
    },
    glyph: {
      symbol: glyphRoot ?? '✦',
      runeSequence: `${record.id.replace(/^(magic|ability|song|shard)_/, '').slice(0, 12)}-${seed.toString(36).padStart(7, '0')}`,
      ringCount: 1 + ((seed >>> 12) % 4),
      clockwise: Boolean(seed & 1),
    },
    textureMode: pick(TEXTURE_MODES, 10),
    impactMode: `${baseImpact}:${pick(['center', 'radial', 'directional', 'layered'], 18)}`,
    impact: deepFreeze({ topology: baseImpact, placement }),
    palette: FAMILY_PALETTES[family] ?? FAMILY_PALETTES.astral,
    duration: windupMs + travelMs + impactMs + decayMs,
    titleTag: `${sourceType === 'magic' ? record.school : sourceType === 'song' ? 'song' : record.type}:${record.nameJa ?? record.name ?? record.id}`,
    castMotion: motionKind,
    cameraCue,
    targetReaction,
    audioCue: `${family}:${pick(['chime', 'snap', 'rush', 'rumble', 'pulse'], 16)}`,
    reducedMotionVariant: deepFreeze({ motion: 'cross-fade', cameraCue: 'none', particleCount: Math.min(6, 3 + intensity) }),
    performanceTier: 'iphone12-dom',
    phaseTopology: deepFreeze({
      phases: 2 + (familyOrdinal % 3),
      topology: `${['linear', 'overlap', 'call-response', 'nested'][Math.floor(familyOrdinal / 4) % 4]}-${Math.floor(familyOrdinal / 16) + 1}`,
    }),
    seed,
    mobileBudget: deepFreeze({ maxParticles: 14, usesTransformOnly: true, maxOverdrawLayers: 5 }),
  });
}

const familyCounts = new Map();
function makeRegistry(records, sourceType, offset) {
  return Object.freeze(Object.fromEntries(records.map((record, index) => {
    const family = familyFor(record, sourceType);
    const familyOrdinal = familyCounts.get(family) ?? 0;
    familyCounts.set(family, familyOrdinal + 1);
    return [record.id, makeDescriptor(record, sourceType, offset + index, familyOrdinal)];
  })));
}

const magicEffectDescriptors = makeRegistry(battleReadyMagic, 'magic', 0);
const abilityEffectDescriptors = makeRegistry(battleReadyAbilities, 'ability', battleReadyMagic.length);
const songEffectDescriptors = makeRegistry(battleReadySongs, 'song', battleReadyMagic.length + battleReadyAbilities.length);
const crystalEffectDescriptors = makeRegistry(battleReadyShards, 'crystal', battleReadyMagic.length + battleReadyAbilities.length + battleReadySongs.length);

const battleEffectDescriptors = Object.freeze({
  ...magicEffectDescriptors,
  ...abilityEffectDescriptors,
  ...songEffectDescriptors,
  ...crystalEffectDescriptors,
});

const battleEffectRecipes = battleEffectDescriptors;
const runtimeDescriptorCache = new Map();

function getBattleEffectDescriptor(id) {
  return battleEffectDescriptors[id] ?? null;
}

function hasBattleEffectDescriptor(id) {
  return Object.hasOwn(battleEffectDescriptors, id);
}

function getBattleEffectRecipe(actionOrId) {
  if (typeof actionOrId === 'string') return getBattleEffectDescriptor(actionOrId);
  if (!actionOrId) return null;
  const nested = actionOrId.spell ?? actionOrId.ability ?? actionOrId.song ?? null;
  const candidates = [
    actionOrId.visualId, actionOrId.sourceId, actionOrId.commandSourceId,
    nested?.visualId, nested?.sourceId, nested?.commandSourceId, nested?.id, actionOrId.id,
  ];
  for (const id of candidates) {
    if (id && battleEffectRecipes[id]) return battleEffectRecipes[id];
  }
  return null;
}

/**
 * Renderer-facing resolver. It accepts wrapped menu actions, prefixed runtime
 * IDs (for example dual-magic_fire), or creates a deterministic fallback for
 * a future command that is not in the reference catalog yet.
 */
function resolveBattleEffectDescriptor(actionOrId) {
  const exact = getBattleEffectRecipe(actionOrId);
  if (exact) return exact;
  const action = typeof actionOrId === 'string' ? { id: actionOrId } : (actionOrId ?? {});
  const nested = action.spell ?? action.ability ?? action.song ?? {};
  const candidates = [action.visualId, action.sourceId, action.commandSourceId, nested.visualId, nested.sourceId, nested.commandSourceId, nested.id, action.id].filter(Boolean);
  const registeredIds = Object.keys(battleEffectRecipes);
  for (const candidate of candidates) {
    const normalized = String(candidate).replaceAll('-', '_');
    const alias = registeredIds.find((id) => normalized === id || normalized.endsWith(id) || normalized.endsWith(id.replace(/^(magic|ability|song)_/, '')));
    if (alias) return battleEffectRecipes[alias];
  }

  const fallbackKey = candidates[0] ?? `runtime_${hash32(JSON.stringify({ kind: action.kind, name: action.name }))}`;
  if (!runtimeDescriptorCache.has(fallbackKey)) {
    runtimeDescriptorCache.set(fallbackKey, makeDescriptor({
      id: `runtime_${String(fallbackKey).replace(/[^a-z0-9_]+/gi, '_').toLowerCase()}`,
      nameJa: action.name ?? nested.name ?? '未登録アクション',
      effect: action.effect ?? nested.effect ?? action.kind ?? '未来の戦闘コマンド',
      target: action.target ?? nested.target ?? 'one_enemy',
      type: 'command',
      abp: 0,
    }, 'ability', hash32(String(fallbackKey)), hash32(String(fallbackKey)) % 128));
  }
  return runtimeDescriptorCache.get(fallbackKey);
}

const battleEffectRegistryStats = Object.freeze({
  magic: Object.keys(magicEffectDescriptors).length,
  abilities: Object.keys(abilityEffectDescriptors).length,
  songs: Object.keys(songEffectDescriptors).length,
  crystals: Object.keys(crystalEffectDescriptors).length,
  total: Object.keys(battleEffectDescriptors).length,
});

function hpBarClass(unit) {
  const ratio = unit.hpRatio();
  if (ratio <= 0.25) return 'low';
  if (ratio <= 0.5) return 'mid';
  return '';
}

const statusNamesJa = STATUS_LABELS_JA;

const targetNamesJa = Object.freeze({
  self: '自分', 'single-enemy': '敵単体', one_enemy: '敵単体', enemy_group: '敵全体', all_enemies: '敵全体', one_or_all_enemies: '敵単体/全体',
  'single-ally': '味方単体', one_ally: '味方単体', all_allies: '味方全体', party: '味方全体', one_or_all_allies: '味方単体/全体',
  all_units: '全体', random_unit: 'ランダム', enemy_group_and_ally: '敵全体＋味方', enemy_and_party: '敵味方全体',
  battle: '戦場',
});

const unitRunes = Object.freeze({ p1: '✦', p2: '◈', p3: '⬢', p4: '⌁', omega: '⊗', boss1: '◆', boss2: '◇', boss3: '✧' });

function safeToken(value, fallback = 'unknown') {
  const token = String(value ?? fallback).toLowerCase().replace(/[^a-z0-9_-]/g, '');
  return token || fallback;
}

function abilityCommandName(abilityId) {
  return selectableAbilities.find((ability) => ability.id === abilityId)?.nameJa ?? 'アビリティ';
}

function effectModifier(prefix, value) {
  return value ? `${prefix}-${safeToken(value)}` : '';
}

function effectDuration(descriptor) {
  const reducedMotion = typeof window !== 'undefined' && window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  // Keep the signature frame readable while suppressing the full travel and
  // camera choreography. 160ms was effectively invisible on mobile capture.
  return reducedMotion ? 360 : Math.min(1600, Math.max(620, descriptor.duration));
}

function battleEffectRenderProfile(actionOrDescriptor = {}, results = []) {
  const descriptor = actionOrDescriptor.family && actionOrDescriptor.phaseTopology
    ? actionOrDescriptor
    : resolveBattleEffectDescriptor(actionOrDescriptor);
  const action = actionOrDescriptor.family ? {} : actionOrDescriptor;
  const family = safeToken(descriptor.family);
  const motion = safeToken(descriptor.motion.kind);
  const geometry = safeToken(descriptor.geometry.primary);
  const impact = safeToken(descriptor.impact.topology);
  const modifiers = [
    effectModifier('entrance', descriptor.motion.entrance),
    effectModifier('secondary', descriptor.geometry.secondary),
    effectModifier('formation', descriptor.geometry.formation),
    effectModifier('placement', descriptor.impact?.placement),
    effectModifier('pulse', descriptor.pulsePattern.shape),
    effectModifier('texture', descriptor.textureMode),
    effectModifier('camera', descriptor.cameraCue),
    effectModifier('reaction', descriptor.targetReaction),
    effectModifier('phases', descriptor.phaseTopology.phases),
    effectModifier('topology', descriptor.phaseTopology.topology),
    effectModifier('trajectory', descriptor.trajectory.kind),
    effectModifier('origin', descriptor.trajectory.origin),
    effectModifier('turns', descriptor.trajectory.turns),
    effectModifier('source', descriptor.sourceType),
    effectModifier('school', String(descriptor.titleTag).split(':')[0]),
    effectModifier('command', action.commandSourceId),
  ].filter(Boolean);
  return Object.freeze({ descriptor, family, motion, geometry, impact, modifiers: Object.freeze(modifiers) });
}

class BattleUI {

    this.battleManager = null;

    this.effectTimer = null;
    this.activeEffectDeadline = 0;

    this._bindStaticEvents();

  attachBattle(battleManager) {
    this.battleManager = battleManager;
    this.messageWindow.reset();
    this.clearTelegraph();
    this.currentPhase = 1;
    this.clearBattleEffects();
    this.battleFieldEl?.classList.remove('impacting');
    this.closeActionWindows();
    this.renderCommandListIdle();
  }

  _bindStaticEvents() {
    eventBus.on('battle:log', (text) => this.messageWindow.show(text));

    eventBus.on('battle:stateUpdate', ({ party, boss, preview }) => {
      this.renderEnemyField(boss);
      this.renderPartyField(party, this.battleManager?.currentActor);
      this.renderCtbList(preview);
      this.renderEnemyInfo(boss);
      this.renderPartyStatus(party);
    });

    eventBus.on('battle:playerTurn', ({ actor }) => {
      this.closeActionWindows();
      this.renderCommandListForActor(actor);
    });

    eventBus.on('battle:actionResolved', ({ actor, action, results }) => {
      if (actor?.isEnemy) this.clearTelegraph();
      this.playActionPulse(actor, results, action);
      const effectDescriptor = action?.id || action?.sourceId || action?.visualId || action?.name
        ? resolveBattleEffectDescriptor(action)
        : null;
      results.forEach((r) => {
        const el = document.querySelector(`[data-uid="${r.targetUid}"]`);
        if (el) {
          el.classList.add('flash');
          setTimeout(() => el.classList.remove('flash'), 440);
          if (effectDescriptor) this.playTargetReaction(el, effectDescriptor, r);
        }
        this.showCombatResult(r, el);
      });
    });

    eventBus.on('battle:telegraph', ({ actor, hint }) => {
      this.telegraphEl.innerHTML = `<b>DANGER</b><span>${actor?.name ?? '敵'}：${hint ?? '強力な攻撃を準備中'}</span>`;
      this.telegraphEl.classList.remove('hidden', 'countered');
    });

    eventBus.on('battle:counter', ({ boss }) => {
      this.telegraphEl.innerHTML = `<b>BREAK</b><span>${boss?.name ?? '敵'}の大技を弱体化</span>`;
      this.telegraphEl.classList.add('countered');
      this.telegraphEl.classList.remove('hidden');
      setTimeout(() => this.clearTelegraph(), 1100);
    });

    eventBus.on('battle:phaseChanged', ({ boss, phase }) => {
      this.currentPhase = phase;
      this.phaseEl.textContent = `PHASE ${phase}　${boss?.name ?? '敵'}が戦闘形態を変化`;
      this.phaseEl.classList.remove('hidden');
      setTimeout(() => this.phaseEl.classList.add('hidden'), 1500);
    });

    eventBus.on('battle:end', () => this.clearTelegraph());
  }

  // ---------- Rendering ----------

  renderEnemyField(boss) {

  // ---------- Player input flow ----------

  handleCommandSelect(commandId, actor) {
    // A newly selected command always replaces any open submenu/target window.
    this.closeActionWindows();

    switch (commandId) {
      case 'attack':
        this.submitAttack(actor);
        break;
      case 'defend':
        this.submitDefend(actor);
        break;
      case 'ability': {
        this.openSubmenu(abilityCommandName(actor.abilityId), getAbilityActions(actor.abilityId), 'ability', actor);
        break;
      }
      case 'crystal': {
        const shardAction = crystalShardAction(actor.crystalShardId);
        this.openSubmenu('結晶技', shardAction ? [shardAction] : [], 'crystal', actor);
        break;
      }
      case 'item':
        this.openSubmenu('アイテム', itemActions, 'item', actor);
        break;
      default:
        break;
    }
  }

  submitAttack(actor) {
    this.battleManager.submitPlayerAction({ type: 'attack', ctbCost: attackAction.ctbCost }, this.battleManager.boss);
  }

  submitDefend(actor) {
    this.battleManager.submitPlayerAction({ type: 'defend', ctbCost: defendAction.ctbCost }, actor);
  }

  openSubmenu(heading, list, kind, actor) {
    this.submenuHeadingEl.textContent = heading;
    this.submenuListEl.innerHTML = '';

    const cancel = this.createChoice('もどる', () => this.closeSubmenu(), { accent: true });
    cancel.classList.add('submenu-back');
    this.submenuListEl.appendChild(cancel);

    if (list.length === 0) {
      const li = document.createElement('li');
      li.textContent = '(つかえるものがない)';
      this.submenuListEl.appendChild(li);
    }

    list.forEach((entry) => {
      const actualMpCost = Math.ceil((entry.mpCost ?? 0) * (actor.mpCostMultiplier ?? 1));
      const costLabel = entry.mpCost ? ` (MP${actualMpCost})` : '';
      const itemState = kind === 'item' && typeof this.battleManager?.getItemUseState === 'function'
        ? this.battleManager.getItemUseState(entry)
        : null;
      const itemStock = itemState?.stock ?? (kind === 'item' && typeof this.battleManager?.getItemStock === 'function'
        ? this.battleManager.getItemStock(entry.id, entry)
        : null);
      const itemUsable = itemState?.usable ?? (kind === 'item' && typeof this.battleManager?.canUseItem === 'function'
        ? this.battleManager.canUseItem(entry)
        : true);
      const disabledReason = entry.disabledReason
        ?? itemState?.disabledReason
        ?? itemState?.reason
        ?? (itemStock === 0 ? '在庫がない。' : '');
      const stockLabel = itemStock == null ? '' : ` ×${Number.isFinite(itemStock) ? itemStock : '∞'}`;
      const disabled = (['spell', 'ability', 'crystal'].includes(kind) && actualMpCost && actor.mp < actualMpCost)
        || itemStock === 0 || itemUsable === false;
      const li = this.createChoice(
        `${entry.name}${costLabel}${stockLabel}`,
        () => {
          this.closeSubmenu();
          if (entry.disabledReason) {
            this.messageWindow.show(entry.disabledReason);
            this.playActionPulse(actor, [{ type: 'status', targetUid: actor.uid, statuses: ['unavailable'] }], entry);
            return;
          }
          this.pendingCommandType = kind;
          this.pendingSpellOrItem = entry;
          this.promptTarget(entry, kind, actor);
        },
        { disabled, detail: disabledReason || this.entryDetail(entry, kind) }
      );
      this.submenuListEl.appendChild(li);
    });

    this.submenuWindowEl.classList.remove('hidden');
  }

  closeSubmenu() {
    this.submenuWindowEl.classList.add('hidden');
  }

  closeActionWindows() {
    this.closeSubmenu();
    this.closeTargetWindow();
    this.pendingCommandType = null;
    this.pendingSpellOrItem = null;
  }

  promptTarget(entry, kind, actor) {
    const allyTarget = ['single-ally', 'one_ally', 'one_or_all_allies', 'all_allies', 'party', 'enemy_group_and_ally'].includes(entry.target);
    const automaticTarget = ['all_allies', 'all_enemies', 'all_units', 'party', 'enemy_group', 'enemy_and_party', 'random_unit'].includes(entry.target);
    const reviveAction = entry.operations?.some((operation) => operation.op === 'revive');
    const targets = entry.target === 'self'
      ? [actor]
      : allyTarget
        ? this.battleManager.party.filter((partyUnit) => reviveAction ? !partyUnit.isAlive() : partyUnit.isAlive())
        : [this.battleManager.boss];

    if (targets.length === 0) {
      this.closeActionWindows();
      this.messageWindow.show(reviveAction ? '戦闘不能の味方はいない。' : '対象がいない。');
      return;
    }

    if (automaticTarget) {
      this.finalizeAction(entry, kind, targets[0]);
      return;
    }

    if (targets.length === 1) {
      this.finalizeAction(entry, kind, targets[0]);
      return;
    }

    this.targetListEl.innerHTML = '';
    targets.forEach((t) => {
      const li = this.createChoice(`${t.name} (HP ${t.hp}/${t.maxHp})`, () => {
        this.closeTargetWindow();
        this.finalizeAction(entry, kind, t);
      });
      this.targetListEl.appendChild(li);
    });
    this.targetWindowEl.classList.remove('hidden');
  }

  closeTargetWindow() {
    this.targetWindowEl.classList.add('hidden');
  }

  finalizeAction(entry, kind, target) {
    this.closeActionWindows();
    if (kind === 'spell') {
      this.battleManager.submitPlayerAction({ type: 'magic', spell: entry, ctbCost: entry.ctbCost }, target);
    } else if (kind === 'ability') {
      this.battleManager.submitPlayerAction({ type: 'ability', ability: entry, ctbCost: entry.ctbCost }, target);
    } else if (kind === 'crystal') {
      this.battleManager.submitPlayerAction({ type: 'crystal', shard: entry, ctbCost: entry.ctbCost }, target);
    } else if (kind === 'item') {
      this.battleManager.submitPlayerAction({ type: 'item', item: entry, ctbCost: entry.ctbCost }, target);
    }
  }

  playActionPulse(actor, results, action = {}) {
    const actorEl = actor ? document.querySelector(`[data-uid="${actor.uid}"]`) : null;
    actorEl?.classList.add('action-pulse');
    setTimeout(() => actorEl?.classList.remove('action-pulse'), 420);
    if (actorEl && (action?.id || action?.sourceId || action?.visualId || action?.name)) {
      const castDescriptor = getBattleEffectDescriptor(action.commandSourceId) ?? resolveBattleEffectDescriptor(action);
      const castClass = `cast-motion-${safeToken(castDescriptor.castMotion)}`;
      [...actorEl.classList].filter((name) => name.startsWith('cast-motion-')).forEach((name) => actorEl.classList.remove(name));
      actorEl.classList.add('casting-effect', castClass);
      const castDistance = 4 + castDescriptor.motion.oscillation * 2;
      actorEl.style.setProperty('--cast-distance', `${castDistance}px`);
      actorEl.style.setProperty('--cast-distance-negative', `${-castDistance}px`);
      actorEl.style.setProperty('--cast-distance-half-negative', `${Math.round(castDistance * -0.6)}px`);
      actorEl.style.setProperty('--cast-distance-half-positive', `${Math.round(castDistance * 0.6)}px`);
      actorEl.style.setProperty('--cast-angle-negative', `${castDescriptor.motion.rotationDegrees * -0.15}deg`);
      actorEl.style.setProperty('--cast-angle-positive', `${castDescriptor.motion.rotationDegrees * 0.12}deg`);
      setTimeout(() => actorEl.classList.remove('casting-effect', castClass), 720);
    }

    if (!this.battleFieldEl || results.length === 0) return;
    const element = action?.element ?? results.find((result) => result.element)?.element;
    const visualType = results.some((result) => ['heal', 'mp-heal', 'revive', 'absorb'].includes(result.type))
      ? 'cast-heal'
      : results.some((result) => ['status', 'buff', 'cleanse', 'dispel', 'effect'].includes(result.type))
        ? 'cast-arcane'
        : 'cast-impact';
    if (this.effectsEl) {
      [...this.effectsEl.classList].filter((name) => name.startsWith('element-')).forEach((name) => this.effectsEl.classList.remove(name));
      this.effectsEl.classList.remove('cast-heal', 'cast-arcane', 'cast-impact');
      requestAnimationFrame(() => this.effectsEl?.classList.add(visualType, ...(element ? [`element-${safeToken(element)}`] : [])));
      setTimeout(() => {
        this.effectsEl?.classList.remove(visualType);
        if (element) this.effectsEl?.classList.remove(`element-${safeToken(element)}`);
      }, 650);
      if (action?.id || action?.sourceId || action?.visualId || action?.name) {
        this.enqueueBattleEffect(actor, action, results, visualType);
      }
    }
    this.battleFieldEl.classList.remove('impacting');
    // Restarting the class in a new frame keeps rapid multi-hit actions legible.
    requestAnimationFrame(() => {
      this.battleFieldEl?.classList.add('impacting');
      setTimeout(() => this.battleFieldEl?.classList.remove('impacting'), 320);
    });
  }

  playTargetReaction(targetEl, descriptor, result = {}) {
    const semanticReaction = ['heal', 'mp-heal', 'buff'].includes(result.type)
      ? 'lift'
      : result.type === 'revive'
        ? 'silhouette-flash'
        : ['cleanse', 'dispel'].includes(result.type)
          ? 'dissolve-edge'
          : descriptor.targetReaction;
    const reactionClass = `reaction-${safeToken(semanticReaction)}`;
    [...targetEl.classList].filter((name) => name.startsWith('reaction-')).forEach((name) => targetEl.classList.remove(name));
    targetEl.classList.remove('target-reaction');
    requestAnimationFrame(() => {
      targetEl.classList.add('target-reaction', reactionClass);
      setTimeout(() => targetEl.classList.remove('target-reaction', reactionClass), 720);
    });
  }

  enqueueBattleEffect(actor, action = {}, results = [], visualType = 'cast-impact') {
    if (!this.effectsEl) return;
    const descriptor = resolveBattleEffectDescriptor(action);
    const duration = effectDuration(descriptor);
    this.effectQueue.push({ actor, action, results, visualType, descriptor, duration });
    const remainingMs = Math.max(0, this.activeEffectDeadline - Date.now());
    const queuedMs = this.effectQueue.reduce((total, queued) => total + queued.duration + 180, 0);
    this.battleManager?.deferNextTurnFor(remainingMs + queuedMs + 20);
    this.runNextBattleEffect();
  }

  runNextBattleEffect() {
    if (this.activeEffect || !this.effectsEl || this.effectQueue.length === 0) return;
    const effectState = this.effectQueue.shift();
    const { actor, action, results, visualType, descriptor, duration } = effectState;
    const commandDescriptor = getBattleEffectDescriptor(action.commandSourceId);
    const sequence = document.createElement('div');
    const profile = battleEffectRenderProfile(action, results);
    const { family, motion, geometry, impact } = profile;
    const targetUnits = [...new Set(results.map((result) => result.targetUid).filter(Boolean))]
      .map((uid) => this.battleManager?.units.find((unit) => unit.uid === uid))
      .filter(Boolean);
    const alliedTargets = actor ? targetUnits.filter((unit) => unit.isEnemy === actor.isEnemy) : [];
    const hostileTargets = actor ? targetUnits.filter((unit) => unit.isEnemy !== actor.isEnemy) : targetUnits;
    const friendlyTarget = Boolean(actor && targetUnits.length && alliedTargets.length === targetUnits.length);
    const mixedTarget = alliedTargets.length > 0 && hostileTargets.length > 0;
    const multiTarget = targetUnits.length > 1 || ['all_allies', 'all_enemies', 'all_units', 'party', 'enemy_group', 'enemy_and_party', 'enemy_group_and_ally'].includes(action.target);
    const directionClass = friendlyTarget
      ? `target-friendly-${actor?.isEnemy ? 'enemy' : 'player'}`
      : actor?.isEnemy ? 'direction-enemy' : 'direction-player';
    const modifiers = [
      ...profile.modifiers,
      directionClass,
      friendlyTarget ? 'target-friendly' : 'target-hostile',
      mixedTarget ? 'target-mixed' : '',
      multiTarget ? 'target-multi' : 'target-single',
      descriptor.summonMotif ? `motif-${safeToken(descriptor.summonMotif)}` : '',
      descriptor.songPattern ? `song-${safeToken(descriptor.songPattern)}` : '',
    ].filter(Boolean);
    sequence.className = [
      'effect-sequence', `effect-${safeToken(descriptor.actionId)}`, `family-${family}`, `motion-${motion}`, `geometry-${geometry}`,
      `impact-${impact}`, visualType, ...modifiers,
    ].join(' ');
    sequence.dataset.effectId = descriptor.actionId;
    sequence.dataset.visualId = String(action.visualId ?? action.sourceId ?? action.id ?? descriptor.actionId);
    sequence.dataset.effectFamily = descriptor.family;
    sequence.dataset.motion = descriptor.motion.kind;
    sequence.dataset.geometry = descriptor.geometry.primary;
    sequence.dataset.phaseTopology = descriptor.phaseTopology.topology;
    sequence.style.setProperty('--fx-duration', `${duration}ms`);
    sequence.style.setProperty('--fx-primary', descriptor.palette[1]);
    sequence.style.setProperty('--fx-secondary', descriptor.palette[2]);
    sequence.style.setProperty('--fx-highlight', descriptor.palette[0]);
    sequence.style.setProperty('--fx-rotation', `${descriptor.motion.rotationDegrees}deg`);
    sequence.style.setProperty('--fx-intensity', String(descriptor.pulsePattern.amplitude));
    sequence.style.setProperty('--fx-beats', String(descriptor.pulsePattern.beats));
    sequence.style.setProperty('--fx-layers', String(descriptor.geometry.layers));
    sequence.style.setProperty('--fx-symmetry', String(descriptor.geometry.symmetry));
    sequence.style.setProperty('--fx-arc-bias', String(descriptor.trajectory.arcBias));
    sequence.style.setProperty('--fx-turns', String(descriptor.trajectory.turns));

    if (friendlyTarget) {
      const stageRect = this.effectsEl.getBoundingClientRect();
      const pointFor = (unit) => {
        const element = unit ? document.querySelector(`[data-uid="${unit.uid}"]`) : null;
        const rect = element?.getBoundingClientRect();
        return rect ? {
          x: ((rect.left - stageRect.left + rect.width / 2) / Math.max(1, stageRect.width)) * 100,
          y: ((rect.top - stageRect.top + rect.height / 2) / Math.max(1, stageRect.height)) * 100,
        } : null;
      };
      const casterPoint = pointFor(actor) ?? { x: actor?.isEnemy ? 24 : 78, y: 42 };
      const targetPoints = targetUnits.map(pointFor).filter(Boolean);
      const targetPoint = targetPoints.length ? {
        x: targetPoints.reduce((sum, point) => sum + point.x, 0) / targetPoints.length,
        y: targetPoints.reduce((sum, point) => sum + point.y, 0) / targetPoints.length,
      } : casterPoint;
      sequence.style.setProperty('--fx-caster-x', `${casterPoint.x.toFixed(2)}%`);
      sequence.style.setProperty('--fx-caster-y', `${casterPoint.y.toFixed(2)}%`);
      sequence.style.setProperty('--fx-target-x', `${targetPoint.x.toFixed(2)}%`);
      sequence.style.setProperty('--fx-target-y', `${targetPoint.y.toFixed(2)}%`);
    }

    const backdrop = document.createElement('span');
    backdrop.className = 'fx-backdrop';
    const title = document.createElement('span');
    title.className = 'fx-title';
    const titleText = document.createElement('b');
    titleText.textContent = `${String(descriptor.titleTag).split(':')[0].toUpperCase()} // ${action.name ?? descriptor.actionId}`;
    title.appendChild(titleText);
    const sigil = document.createElement('span');
    sigil.className = 'fx-caster-sigil';
    let commandLayer = null;
    if (commandDescriptor && commandDescriptor.actionId !== descriptor.actionId) {
      commandLayer = document.createElement('span');
      commandLayer.className = [
        'fx-command-layer',
        `family-${safeToken(commandDescriptor.family)}`,
        `motion-${safeToken(commandDescriptor.motion.kind)}`,
        `geometry-${safeToken(commandDescriptor.geometry.primary)}`,
        `entrance-${safeToken(commandDescriptor.motion.entrance)}`,
      ].join(' ');
      commandLayer.dataset.commandEffectId = commandDescriptor.actionId;
      const commandCore = document.createElement('i');
      commandCore.className = 'fx-core';
      commandCore.textContent = commandDescriptor.glyph.symbol;
      commandLayer.appendChild(commandCore);
    }
    const path = document.createElement('span');
    path.className = 'fx-path';
    const core = document.createElement('span');
    core.className = 'fx-core';
    const orbit = document.createElement('span');
    orbit.className = 'fx-orbit';
    const hit = document.createElement('span');
    hit.className = 'fx-impact';
    let mixedImpact = null;
    if (mixedTarget) {
      mixedImpact = document.createElement('span');
      mixedImpact.className = 'fx-impact fx-impact-echo';
      mixedImpact.setAttribute('aria-hidden', 'true');
    }
    const glyph = document.createElement('span');
    glyph.className = 'fx-glyph';
    const glyphText = document.createElement('b');
    glyphText.textContent = descriptor.glyph.symbol;
    glyph.appendChild(glyphText);
    glyph.setAttribute('aria-hidden', 'true');
    let summonEmblem = null;
    if (descriptor.summonMotif) {
      summonEmblem = document.createElement('span');
      summonEmblem.className = `fx-summon-emblem motif-${safeToken(descriptor.summonMotif)}`;
      summonEmblem.setAttribute('aria-hidden', 'true');
    }
    let songWave = null;
    if (descriptor.songPattern) {
      songWave = document.createElement('span');
      songWave.className = `fx-song-wave song-${safeToken(descriptor.songPattern)}`;
      songWave.setAttribute('aria-hidden', 'true');
    }
    const particles = document.createElement('span');
    particles.className = 'fx-particles';
    const reservedAnimatedNodes = Number(Boolean(commandLayer)) + Number(Boolean(summonEmblem)) + Number(Boolean(songWave)) + Number(Boolean(mixedImpact));
    const particleCount = Math.max(8, Math.min(descriptor.mobileBudget.maxParticles - reservedAnimatedNodes, descriptor.particleCount));
    for (let index = 0; index < particleCount; index += 1) {
      const particle = document.createElement('i');
      const angle = Math.round((360 / particleCount) * index + ((descriptor.seed >>> (index % 16)) & 15));
      particle.style.setProperty('--particle-angle', `${angle}deg`);
      particle.style.setProperty('--particle-distance', `${48 + ((descriptor.seed >>> (index % 19)) & 63)}px`);
      particle.style.setProperty('--fx-delay', `${Math.round((index % Math.max(1, descriptor.pulsePattern.beats)) * descriptor.pulsePattern.spacingMs * -0.18)}ms`);
      particles.appendChild(particle);
    }
    sequence.append(backdrop, title, sigil);
    if (commandLayer) sequence.appendChild(commandLayer);
    sequence.append(path, core, orbit, hit);
    if (mixedImpact) sequence.appendChild(mixedImpact);
    sequence.append(particles, glyph);
    if (summonEmblem) sequence.appendChild(summonEmblem);
    if (songWave) sequence.appendChild(songWave);
    this.effectsEl.appendChild(sequence);
    this.activeEffect = sequence;

    this.activeEffectDeadline = Date.now() + duration + 180;
    const finish = () => {
      if (this.activeEffect !== sequence) return;
      sequence.remove();
      this.activeEffect = null;
      this.activeEffectDeadline = 0;
      clearTimeout(this.effectTimer);
      this.effectTimer = null;
      eventBus.emit('battle:effectComplete', { actor, action, descriptor });
      this.runNextBattleEffect();
    };
    sequence.addEventListener('animationend', (event) => {
      if (event.target === sequence) finish();
    }, { once: true });
    this.effectTimer = setTimeout(finish, duration + 160);
  }

  clearBattleEffects() {
    clearTimeout(this.effectTimer);
    this.effectTimer = null;
    this.effectQueue = [];
    this.activeEffect = null;
    this.activeEffectDeadline = 0;
    if (this.effectsEl) this.effectsEl.innerHTML = '';
  }

  showCombatResult(result, targetEl) {
    if (!this.effectsEl || !targetEl) return;
    const targetRect = targetEl.getBoundingClientRect();
    const stageRect = this.effectsEl.getBoundingClientRect();
    const effect = document.createElement('span');
    effect.className = `combat-result ${result.type}`;
    if (result.element) effect.classList.add(`element-${safeToken(result.element)}`);

    if (['damage', 'mp-damage'].includes(result.type)) {
      const outcome = result.nullified ? '無効' : result.resisted ? '耐性' : result.weak ? '弱点' : '';
      effect.textContent = `${outcome} −${result.amount ?? 0}`;
    }
    else if (['heal', 'mp-heal', 'revive', 'absorb'].includes(result.type)) effect.textContent = `+${result.amount ?? 0}`;
    else if (result.type === 'miss') effect.textContent = 'ミス';
    else if (result.type === 'blocked' || result.type === 'defend') effect.textContent = 'ガード';
    else if (result.type === 'status') effect.textContent = statusNamesJa[result.statuses?.[0]] ?? result.statuses?.[0] ?? '状態異常';
    else if (result.type === 'status-resist') effect.textContent = `耐性 ${statusNamesJa[result.statuses?.[0]] ?? result.statuses?.[0] ?? ''}`;
    else effect.textContent = result.label ?? '効果';

    effect.style.left = `${targetRect.left - stageRect.left + targetRect.width / 2}px`;
    effect.style.top = `${targetRect.top - stageRect.top + targetRect.height * 0.22}px`;
    this.effectsEl.appendChild(effect);
    effect.addEventListener('animationend', () => effect.remove(), { once: true });
    setTimeout(() => effect.remove(), 1300);
  }

  entryDetail(entry, kind) {
    const parts = [];
    if (entry.element) parts.push(elementNames[entry.element] ?? entry.element);
    if (entry.target) parts.push(targetNamesJa[entry.target] ?? entry.target);
    const effect = entry.effect ?? entry.battle?.description ?? entry.description;
    if (effect) parts.push(String(effect).replace(/\s+/g, ' ').slice(0, 34));
    else if (kind === 'item' && entry.healAmount) parts.push(`HP ${entry.healAmount} 回復`);
    return parts.join('・');
  }

  clearTelegraph() {
    this.telegraphEl.classList.add('hidden');
    this.telegraphEl.classList.remove('countered');
    this.telegraphEl.textContent = '';
  }

  createChoice(label, onActivate, { disabled = false, accent = false, detail = '' } = {}) {
    const li = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    button.className = `battle-choice${accent ? ' accent' : ''}`;
    const primary = document.createElement('span');
    primary.className = 'choice-primary';
    primary.textContent = label;
    button.appendChild(primary);
    if (detail) {
      const secondary = document.createElement('small');
      secondary.className = 'choice-detail';
      secondary.textContent = detail;
      button.appendChild(secondary);
    }
    button.disabled = disabled;
    if (disabled) button.setAttribute('aria-disabled', 'true');
    else button.addEventListener('click', onActivate);
    li.appendChild(button);
    return li;
  }
}

const slotLabels = {
  weapon: '武器',
  shield: '盾',
  head: '頭',
  body: '体',
  accessory: 'アクセサリ',
};

const jobLabels = {
  knight: 'ナイト', monk: 'モンク', thief: 'シーフ', blue_mage: '青魔道士',
  white_mage: '白魔道士', black_mage: '黒魔道士', mystic_knight: '魔法剣士',
  berserker: 'バーサーカー', summoner: '召喚士', time_mage: '時魔道士',
  red_mage: '赤魔道士', beastmaster: '魔獣使い', geomancer: '風水士',
  ninja: '忍者', ranger: '狩人', bard: '吟遊詩人', samurai: '侍',
  dancer: '踊り子', dragoon: '竜騎士', chemist: '薬師', mime: 'ものまね士',
};

function equipmentStatLine(item) {
  if (!item) return '';
  return item.slot === 'weapon'
    ? `攻撃力 ${item.attack} ／ 命中 ${item.accuracy ?? '-'}%`
    : `防御 ${item.defense} ／ 魔防 ${item.magicDefense} ／ 回避 ${item.evasion}%`;
}

/**
 * Party formation screen shown between bosses. One character occupies the
 * whole screen at a time (bigger text, easier to read on mobile); use the
 * prev/next arrow buttons to page between party members. Equipment/ability/
 * crystal-shard choices are made via a full-detail picker modal (name + stat
 * gains + additional effect for every option) rather than a plain <select>,
 * and are persisted to localStorage via Loadout.js as soon as they change,
 * so the player doesn't have to re-pick them on every run.
 */
class IntermissionUI {
  constructor() {
    this.containerEl = document.getElementById('intermission-party');
    this.nextBossLabelEl = document.getElementById('next-boss-label');
    this.prevButton = document.getElementById('intermission-prev');
    this.nextButton = document.getElementById('intermission-next');
    this.indicatorEl = document.getElementById('intermission-indicator');
    this.partyUnits = [];
    this.currentIndex = 0;

    this.prevButton?.addEventListener('click', () => this.step(-1));
    this.nextButton?.addEventListener('click', () => this.step(1));

    this.buildPickerModal();
  }

  buildPickerModal() {
    const overlay = document.createElement('div');
    overlay.className = 'picker-overlay hidden';

    const modal = document.createElement('div');
    modal.className = 'ff5-window picker-modal';
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');

    const header = document.createElement('div');
    header.className = 'picker-modal-header';
    const title = document.createElement('div');
    title.className = 'picker-modal-title';
    const closeButton = document.createElement('button');
    closeButton.type = 'button';
    closeButton.className = 'picker-modal-close';
    closeButton.setAttribute('aria-label', '閉じる');
    closeButton.textContent = '×';
    header.append(title, closeButton);

    const list = document.createElement('div');
    list.className = 'picker-modal-list';

    modal.append(header, list);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    const close = () => overlay.classList.add('hidden');
    closeButton.addEventListener('click', close);
    overlay.addEventListener('click', (event) => {
      if (event.target === overlay) close();
    });

    this.pickerEl = overlay;
    this.pickerTitleEl = title;
    this.pickerListEl = list;
  }

  /**
   * options: array of { value, name, statLine, effectText, selected, disabled, badge }
   */
  openPicker(titleText, options, onSelect) {
    this.pickerTitleEl.textContent = titleText;
    this.pickerListEl.innerHTML = '';

    options.forEach((opt) => {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'picker-row';
      if (opt.selected) row.classList.add('selected');
      if (opt.disabled) row.classList.add('disabled');
      row.disabled = !!opt.disabled;

      const rowTop = document.createElement('div');
      rowTop.className = 'picker-row-top';
      const name = document.createElement('span');
      name.className = 'picker-row-name';
      name.textContent = opt.name;
      rowTop.appendChild(name);
      if (opt.badge) {
        const badge = document.createElement('span');
        badge.className = 'picker-row-badge';
        badge.textContent = opt.badge;
        rowTop.appendChild(badge);
      }
      row.appendChild(rowTop);

      if (opt.statLine) {
        const stat = document.createElement('div');
        stat.className = 'picker-row-stat';
        stat.textContent = opt.statLine;
        row.appendChild(stat);
      }

      if (opt.effectText) {
        const effect = document.createElement('div');
        effect.className = 'picker-row-effect';
        effect.textContent = `追加効果: ${opt.effectText}`;
        row.appendChild(effect);
      }

      row.addEventListener('click', () => {
        if (opt.disabled) return;
        onSelect(opt.value);
        this.pickerEl.classList.add('hidden');
      });

      this.pickerListEl.appendChild(row);
    });

    this.pickerEl.classList.remove('hidden');
    this.pickerListEl.scrollTop = 0;
  }

  clear() {
    this.containerEl.replaceChildren();
    this.nextBossLabelEl.textContent = '';
    if (this.indicatorEl) this.indicatorEl.textContent = '';
    this.partyUnits = [];
    this.pickerEl?.classList.add('hidden');
  }

  step(direction) {
    if (this.partyUnits.length < 2) return;
    this.currentIndex = (this.currentIndex + direction + this.partyUnits.length) % this.partyUnits.length;
    this.renderCurrentCard();
  }

  render(partyUnits, nextBoss) {
    this.partyUnits = partyUnits;
    this.currentIndex = 0;
    this.nextBossLabelEl.textContent = nextBoss
      ? `つぎのボス: ${nextBoss.name} （弱点: ${nextBoss.weakness ? (elementNames[nextBoss.weakness] ?? nextBoss.weakness) : '不明'}）`
      : '';

    const showNav = partyUnits.length > 1;
    this.prevButton?.classList.toggle('hidden', !showNav);
    this.nextButton?.classList.toggle('hidden', !showNav);

    this.renderCurrentCard();
  }

  renderCurrentCard() {
    const unit = this.partyUnits[this.currentIndex];
    this.containerEl.innerHTML = '';
    this.pickerEl?.classList.add('hidden');
    if (!unit) return;

    if (this.indicatorEl) {
      this.indicatorEl.textContent = `${this.currentIndex + 1} / ${this.partyUnits.length}　${unit.name}`;
    }

    const card = document.createElement('div');
    card.className = 'ff5-window intermission-card';

    const portrait = document.createElement('div');
    portrait.className = 'intermission-portrait';

    const spriteSlot = document.createElement('div');
    spriteSlot.className = 'sprite-slot';
    const sprite = document.createElement('div');
    sprite.className = `sprite-placeholder player unit-${unit.id ?? ''}`;
    sprite.style.width = '100%';
    sprite.style.height = '100%';
    if (unit.spriteUrl) {
      sprite.classList.add('has-sprite-image');
      const img = document.createElement('img');
      img.className = 'sprite-image';
      img.src = unit.spriteUrl;
      img.alt = unit.name;
      img.draggable = false;
      sprite.appendChild(img);
    } else {
      const blob = document.createElement('div');
      blob.className = 'blob';
      blob.style.width = '100%';
      blob.style.height = '100%';
      blob.innerHTML = `<span class="soul-flare"></span><span class="soul-core"></span><span class="soul-rune">${unit.name ? unit.name.charAt(0) : ''}</span>`;
      sprite.appendChild(blob);
    }
    spriteSlot.appendChild(sprite);
    portrait.appendChild(spriteSlot);

    const headline = document.createElement('div');
    headline.className = 'intermission-headline';

    const nameEl = document.createElement('div');
    nameEl.className = 'card-name';
    nameEl.textContent = unit.name;
    headline.appendChild(nameEl);

    const statsEl = document.createElement('div');
    statsEl.className = 'card-stats';
    statsEl.innerHTML = `HP ${unit.hp}/${unit.maxHp}　MP ${unit.mp}/${unit.maxMp}<br>ATK ${unit.atk}　MAG ${unit.magic}　AGI ${unit.agility}`;
    headline.appendChild(statsEl);

    portrait.appendChild(headline);
    card.appendChild(portrait);

    const info = document.createElement('div');
    info.className = 'intermission-card-info';

    const selects = document.createElement('div');
    selects.className = 'formation-selects';

    const detail = document.createElement('div');
    detail.className = 'formation-detail';
    detail.setAttribute('role', 'status');

    const persistLoadout = () => {
      saveUnitLoadout(unit.id, {
        equipment: unit.equipment,
        abilityId: unit.abilityId,
        crystalShardId: unit.crystalShardId,
      });
    };

    const updateDetails = () => {
      const bonuses = calculateEquipmentBonuses(unit.equipment);
      const ability = selectableAbilities.find((entry) => entry.id === unit.abilityId);
      const equipmentLines = Object.entries(slotLabels).map(([slot, label]) => {
        const item = findEquipment(unit.equipment?.[slot]);
        return `${label}: ${item?.nameJa ?? 'なし'} — ${equipmentDetailText(item)}`;
      });
      const abilityLine = ability
        ? `アビリティ: ${ability.nameJa} — ${ability.effect}［${isAbilityImplemented(ability.id) ? '戦闘反映' : '準備中'}］`
        : 'アビリティ: なし';
      detail.textContent = [
        `戦闘能力: 攻撃 ${unit.baseAtk + bonuses.attack} / 防御 ${unit.baseDef + bonuses.defense} / 魔防 ${unit.baseMagicDef + bonuses.magicDefense} / 魔力 ${unit.baseMagic + bonuses.magic} / 素早さ ${unit.baseAgility + bonuses.agility} / 回避 ${bonuses.evasion}%`,
        ...equipmentLines,
        abilityLine,
      ].join('\n');
    };

    // ---- Equipment slots (weapon / shield / head / body / accessory) ----
    Object.entries(slotLabels).forEach(([slot, labelText]) => {
      const field = document.createElement('div');
      field.className = 'formation-field';
      const caption = document.createElement('span');
      caption.textContent = labelText;

      const picker = document.createElement('button');
      picker.type = 'button';
      picker.className = 'picker-trigger';
      picker.setAttribute('aria-haspopup', 'dialog');

      const renderPickerLabel = () => {
        const current = findEquipment(unit.equipment?.[slot]);
        picker.textContent = current ? current.nameJa : 'なし';
      };
      renderPickerLabel();

      picker.addEventListener('click', () => {
        const options = [
          {
            value: '',
            name: 'なし',
            statLine: '',
            effectText: '',
            selected: !unit.equipment?.[slot],
          },
          ...equipmentBySlot[slot].map((item) => ({
            value: item.id,
            name: item.nameJa,
            statLine: equipmentStatLine(item),
            effectText: equipmentEffectText(item),
            selected: unit.equipment?.[slot] === item.id,
            badge: item.special ? '★' : null,
          })),
        ];
        this.openPicker(`${unit.name}の${labelText}を選択`, options, (value) => {
          unit.equipment = { ...unit.equipment, [slot]: value || null };
          if (slot === 'weapon') unit.weaponId = value || null;
          renderPickerLabel();
          updateDetails();
          persistLoadout();
        });
      });

      field.append(caption, picker);
      selects.appendChild(field);
    });

    // ---- Ability slot ----
    const abilityField = document.createElement('div');
    abilityField.className = 'formation-field';
    const abilityCaption = document.createElement('span');
    abilityCaption.textContent = 'アビリティ';
    const abilityPicker = document.createElement('button');
    abilityPicker.type = 'button';
    abilityPicker.className = 'picker-trigger';
    abilityPicker.setAttribute('aria-haspopup', 'dialog');

    const renderAbilityLabel = () => {
      const current = selectableAbilities.find((entry) => entry.id === unit.abilityId);
      abilityPicker.textContent = current ? current.nameJa : 'なし';
    };
    renderAbilityLabel();

    abilityPicker.addEventListener('click', () => {
      const options = selectableAbilities.map((ability) => ({
        value: ability.id,
        name: `${ability.nameJa}（${jobLabels[ability.job] ?? ability.job}）`,
        statLine: '',
        effectText: ability.effect,
        selected: unit.abilityId === ability.id,
        disabled: !isAbilityImplemented(ability.id),
        badge: isAbilityImplemented(ability.id) ? null : '準備中',
      }));
      this.openPicker(`${unit.name}のアビリティを選択`, options, (value) => {
        unit.abilityId = value;
        renderAbilityLabel();
        updateDetails();
        persistLoadout();
      });
    });

    abilityField.append(abilityCaption, abilityPicker);
    selects.appendChild(abilityField);

    // ---- Crystal shard slot ----
    const shardField = document.createElement('div');
    shardField.className = 'formation-field';
    const shardCaption = document.createElement('span');
    shardCaption.textContent = 'クリスタルのかけら';
    const shardPicker = document.createElement('button');
    shardPicker.type = 'button';
    shardPicker.className = 'picker-trigger';
    shardPicker.setAttribute('aria-haspopup', 'dialog');

    const renderShardLabel = () => {
      const current = crystalShards.find((entry) => entry.id === unit.crystalShardId);
      shardPicker.textContent = current ? current.nameJa : 'なし';
    };
    renderShardLabel();

    shardPicker.addEventListener('click', () => {
      const options = crystalShards.map((shard) => ({
        value: shard.id,
        name: shard.nameJa,
        statLine: `技: ${shard.techniqueNameJa}`,
        effectText: shard.lore,
        selected: unit.crystalShardId === shard.id,
      }));
      this.openPicker(`${unit.name}のクリスタルのかけらを選択`, options, (value) => {
        unit.crystalShardId = value;
        renderShardLabel();
        persistLoadout();
      });
    });

    shardField.append(shardCaption, shardPicker);
    selects.appendChild(shardField);

    info.appendChild(selects);

    updateDetails();
    info.appendChild(detail);

    const note = document.createElement('small');
    note.className = 'formation-note';
    note.textContent = '★は追加効果あり。装備の能力値・属性と「戦闘反映」表示のアビリティは次のバトルから有効です。設定は端末に保存され、次回以降も自動的に反映されます。';
    info.appendChild(note);

    card.appendChild(info);
    this.containerEl.appendChild(card);
  }
}

// ---------- Screen switching ----------
const screens = {

  INTERMISSION: document.getElementById('intermission-screen'),

function showScreen(stateName) {
